---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "servicea-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "ServiceA"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: {{ tpl "{{ .Values.config.ServiceA.OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY }}" . | quote }}
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: {{ tpl "{{ .Values.config.ServiceA.ASPNETCORE_FORWARDEDHEADERS_ENABLED }}" . | quote }}
  HTTP_PORTS: {{ tpl "{{ .Values.parameters.ServiceA.port_http | int | toString }}" . | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ tpl "{{ .Values.config.ServiceA.OTEL_EXPORTER_OTLP_ENDPOINT }}" . | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ tpl "{{ .Values.config.ServiceA.OTEL_EXPORTER_OTLP_PROTOCOL }}" . | quote }}
  OTEL_SERVICE_NAME: {{ tpl "{{ .Values.config.ServiceA.OTEL_SERVICE_NAME }}" . | quote }}
