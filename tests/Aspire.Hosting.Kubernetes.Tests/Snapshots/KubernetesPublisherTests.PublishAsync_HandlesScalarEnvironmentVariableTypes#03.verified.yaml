---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "myapp-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "myapp"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  BOOL_TRUE: {{ tpl "{{ .Values.config.myapp.BOOL_TRUE }}" . | quote }}
  BOOL_FALSE: {{ tpl "{{ .Values.config.myapp.BOOL_FALSE }}" . | quote }}
  INT_VALUE: {{ tpl "{{ .Values.config.myapp.INT_VALUE }}" . | quote }}
  DOUBLE_VALUE: {{ tpl "{{ .Values.config.myapp.DOUBLE_VALUE }}" . | quote }}
  DATETIMEOFFSET_VALUE: {{ tpl "{{ .Values.config.myapp.DATETIMEOFFSET_VALUE }}" . | quote }}
  TIMESPAN_VALUE: {{ tpl "{{ .Values.config.myapp.TIMESPAN_VALUE }}" . | quote }}
  URI_VALUE: {{ tpl "{{ .Values.config.myapp.URI_VALUE }}" . | quote }}
  NULLABLE_INT_WITH_VALUE: {{ tpl "{{ .Values.config.myapp.NULLABLE_INT_WITH_VALUE }}" . | quote }}
  STRING_VALUE: {{ tpl "{{ .Values.config.myapp.STRING_VALUE }}" . | quote }}
