---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "project-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "project"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: {{ tpl "{{ .Values.config.project.OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY }}" . | quote }}
  DATA_PATH: {{ tpl "{{ .Values.config.project.DATA_PATH }}" . | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ tpl "{{ .Values.config.project.OTEL_EXPORTER_OTLP_ENDPOINT }}" . | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ tpl "{{ .Values.config.project.OTEL_EXPORTER_OTLP_PROTOCOL }}" . | quote }}
  OTEL_SERVICE_NAME: {{ tpl "{{ .Values.config.project.OTEL_SERVICE_NAME }}" . | quote }}
