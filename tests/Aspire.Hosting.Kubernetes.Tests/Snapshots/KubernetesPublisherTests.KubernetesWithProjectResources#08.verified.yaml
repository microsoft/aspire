---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "api-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "api"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  PROJECT1_HTTP: {{ tpl "http://project1-service:{{ .Values.parameters.project1.port_http }}" . | quote }}
  services__project1__http__0: {{ tpl "http://project1-service:{{ .Values.parameters.project1.port_http }}" . | quote }}
  PROJECT1_HTTPS: {{ tpl "https://project1-service:{{ .Values.parameters.project1.port_http }}" . | quote }}
  PROJECT1_CUSTOM1: {{ tpl "{{ .Values.config.api.PROJECT1_CUSTOM1 }}" . | quote }}
  services__project1__custom1__0: {{ tpl "{{ .Values.config.api.services__project1__custom1__0 }}" . | quote }}
  PROJECT1_CUSTOM2: {{ tpl "{{ .Values.config.api.PROJECT1_CUSTOM2 }}" . | quote }}
  services__project1__custom2__0: {{ tpl "{{ .Values.config.api.services__project1__custom2__0 }}" . | quote }}
  PROJECT1_CUSTOM3: {{ tpl "{{ .Values.config.api.PROJECT1_CUSTOM3 }}" . | quote }}
  services__project1__custom3__0: {{ tpl "{{ .Values.config.api.services__project1__custom3__0 }}" . | quote }}
  PROJECT1_CUSTOM4: {{ tpl "{{ .Values.config.api.PROJECT1_CUSTOM4 }}" . | quote }}
  services__project1__custom4__0: {{ tpl "{{ .Values.config.api.services__project1__custom4__0 }}" . | quote }}
