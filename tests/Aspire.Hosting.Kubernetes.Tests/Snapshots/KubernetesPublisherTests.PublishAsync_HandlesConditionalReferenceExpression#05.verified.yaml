---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "myapp-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "myapp"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  TLS_SUFFIX: {{ tpl "{{ .Values.config.myapp.TLS_SUFFIX }}" . | quote }}
  TLS_SUFFIX_FALSE: {{ tpl "{{ .Values.config.myapp.TLS_SUFFIX_FALSE }}" . | quote }}
