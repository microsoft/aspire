---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "backend-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "backend"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  ORIGIN: {{ tpl "{{ .Values.config.backend.frontend_http_BrowserOrigin }}" . | quote }}
  ORIGINS: {{ tpl "{{ .Values.config.backend.frontend_http_BrowserOrigins }}" . | quote }}
  ORIGINS_JSON: {{ tpl "{{ .Values.config.backend.frontend_http_BrowserOriginsJson }}" . | quote }}
  CONFIG: {{ tpl "origin={{ .Values.config.backend.frontend_http_BrowserOrigin }}" . | quote }}
