apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: parameterized-acme
spec:
  acme:
    server: "https://acme.example.com/directory"
    email: "ops@contoso.com"
    privateKeySecretRef:
      name: parameterized-acme-account-key
    solvers:
    - http01:
        gatewayHTTPRoute: {}
