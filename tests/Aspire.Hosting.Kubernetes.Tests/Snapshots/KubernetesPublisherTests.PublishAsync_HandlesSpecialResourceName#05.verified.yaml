---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "special-app-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "SpeciaL-ApP"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: {{ tpl "{{ .Values.config.SpeciaL_ApP.OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY }}" . | quote }}
  ConnectionStrings__api_cs2: {{ tpl "{{ .Values.config.SpeciaL_ApP.ConnectionStrings__api_cs2 }}" . | quote }}
  ConnectionStrings__manual-db: {{ tpl "{{ .Values.config.SpeciaL_ApP.ConnectionStrings__manual_db }}" . | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ tpl "{{ .Values.config.SpeciaL_ApP.OTEL_EXPORTER_OTLP_ENDPOINT }}" . | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ tpl "{{ .Values.config.SpeciaL_ApP.OTEL_EXPORTER_OTLP_PROTOCOL }}" . | quote }}
  OTEL_SERVICE_NAME: {{ tpl "{{ .Values.config.SpeciaL_ApP.OTEL_SERVICE_NAME }}" . | quote }}
