---
apiVersion: "v1"
kind: "PersistentVolume"
metadata:
  name: "data-pv"
spec:
  storageClassName: "example-csi"
  csi:
    driver: "example.csi.test"
    volumeHandle: "account#share"
    volumeAttributes:
      account: "account"
      share: "share"
  accessModes:
    - "ReadWriteMany"
  mountOptions:
    - "dir_mode=0770"
    - "file_mode=0770"
  capacity:
    storage: "100Gi"
  persistentVolumeReclaimPolicy: "Retain"
