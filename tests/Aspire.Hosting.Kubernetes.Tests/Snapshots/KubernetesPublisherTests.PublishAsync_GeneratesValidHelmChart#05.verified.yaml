---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "project1-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "project1"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: {{ tpl "{{ .Values.config.project1.OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY }}" . | quote }}
  MYAPP_HTTP: {{ tpl "{{ .Values.config.project1.MYAPP_HTTP }}" . | quote }}
  services__myapp__http__0: {{ tpl "{{ .Values.config.project1.services__myapp__http__0 }}" . | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ tpl "{{ .Values.config.project1.OTEL_EXPORTER_OTLP_ENDPOINT }}" . | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ tpl "{{ .Values.config.project1.OTEL_EXPORTER_OTLP_PROTOCOL }}" . | quote }}
  OTEL_SERVICE_NAME: {{ tpl "{{ .Values.config.project1.OTEL_SERVICE_NAME }}" . | quote }}
