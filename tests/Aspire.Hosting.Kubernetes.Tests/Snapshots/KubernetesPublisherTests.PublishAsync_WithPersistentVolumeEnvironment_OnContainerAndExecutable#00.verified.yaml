---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "container-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "container"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  DATA_PATH: {{ tpl "{{ .Values.config.container.DATA_PATH }}" . | quote }}
