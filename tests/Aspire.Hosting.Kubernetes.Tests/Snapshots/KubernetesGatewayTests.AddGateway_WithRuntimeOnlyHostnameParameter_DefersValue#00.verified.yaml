---
apiVersion: "gateway.networking.k8s.io/v1"
kind: "Gateway"
metadata:
  name: "public"
spec:
  gatewayClassName: "nginx"
  listeners:
    - name: "http"
      protocol: "HTTP"
      port: 80
      allowedRoutes:
        namespaces:
          from: "Same"
    - name: "https"
      protocol: "HTTPS"
      port: 443
      hostname: "{{ .Values.parameters.public.hostname }}"
      tls:
        mode: "Terminate"
        certificateRefs:
          - name: "public-tls"
      allowedRoutes:
        namespaces:
          from: "Same"
