---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "gateway-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "gateway"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  API_HTTP: {{ tpl "{{ .Values.config.gateway.API_HTTP }}" . | quote }}
  services__api__http__0: {{ tpl "{{ .Values.config.gateway.services__api__http__0 }}" . | quote }}
