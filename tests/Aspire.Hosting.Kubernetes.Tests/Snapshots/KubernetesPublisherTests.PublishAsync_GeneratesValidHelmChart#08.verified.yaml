---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "myapp-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "myapp"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  ASPNETCORE_ENVIRONMENT: {{ tpl "{{ .Values.config.myapp.ASPNETCORE_ENVIRONMENT }}" . | quote }}
  param0: {{ tpl "{{ .Values.config.myapp.param0 }}" . | quote }}
  param2: {{ tpl "{{ .Values.config.myapp.param2 }}" . | quote }}
