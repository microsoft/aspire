---
apiVersion: "gateway.networking.k8s.io/v1"
kind: "HTTPRoute"
metadata:
  name: "public-route"
spec:
  parentRefs:
    - name: "public"
  hostnames:
    - "{{ .Values.parameters.public.hostname }}"
  rules:
    - matches:
        - path:
            type: "PathPrefix"
            value: "/api"
      backendRefs:
        - name: "myapi-service"
          port: 8080
