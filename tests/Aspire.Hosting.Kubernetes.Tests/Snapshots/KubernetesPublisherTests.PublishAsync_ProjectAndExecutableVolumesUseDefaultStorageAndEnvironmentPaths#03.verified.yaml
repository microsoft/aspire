---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "executable-deployment"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "executable"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Chart.Name }}"
        app.kubernetes.io/component: "executable"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
    spec:
      containers:
        - image: "{{ .Values.parameters.executable.executable_image }}"
          name: "executable"
          envFrom:
            - configMapRef:
                name: "executable-config"
          volumeMounts:
            - name: "executable-data"
              mountPath: "/srv/executable"
          imagePullPolicy: "IfNotPresent"
      volumes:
        - name: "executable-data"
          emptyDir: {}
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Chart.Name }}"
      app.kubernetes.io/component: "executable"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: "RollingUpdate"
