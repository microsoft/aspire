---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "myapp-secrets"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "myapp"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
stringData:
  param1: {{ tpl "{{ .Values.secrets.myapp.param1 }}" . | quote }}
  param3: {{ tpl "{{ .Values.secrets.myapp.param3 }}" . | quote }}
  ConnectionStrings__cs: {{ tpl "Url={{ .Values.config.myapp.param0 }}, Secret={{ .Values.secrets.myapp.param1 }}" . | quote }}
type: "Opaque"
