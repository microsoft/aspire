services:
  env-dashboard:
    image: "mcr.microsoft.com/aspire/nightly/dashboard:17.0"
    environment:
      ASPIRE_DASHBOARD_TELEMETRY_OPTOUT: "true"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  frontend:
    image: "nginx:alpine"
    expose:
      - "8080"
    networks:
      - "aspire"
  backend:
    image: "nginx:alpine"
    environment:
      ORIGIN: "${FRONTEND_HTTP_BROWSERORIGIN}"
      ORIGINS: "${FRONTEND_HTTP_BROWSERORIGINS}"
      ORIGINS_JSON: "${FRONTEND_HTTP_BROWSERORIGINSJSON}"
      CONFIG: "origin=${FRONTEND_HTTP_BROWSERORIGIN}"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
