services:
  docker-compose-dashboard:
    image: "mcr.microsoft.com/aspire/nightly/dashboard:17.0"
    environment:
      ASPIRE_DASHBOARD_TELEMETRY_OPTOUT: "true"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  myapp:
    image: "mcr.microsoft.com/dotnet/aspnet:8.0"
    environment:
      TLS_SUFFIX: ",ssl=true"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
