services:
  docker-compose-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  default:
    image: "my-default:latest"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "default"
    networks:
      - "aspire"
  grpc:
    image: "my-grpc:latest"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "grpc"
    networks:
      - "aspire"
  http-protobuf:
    image: "my-http-protobuf:latest"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-compose-dashboard:18890"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_NAME: "http-protobuf"
    networks:
      - "aspire"
  http-json:
    image: "my-http-json:latest"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-compose-dashboard:18890"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/json"
      OTEL_SERVICE_NAME: "http-json"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
