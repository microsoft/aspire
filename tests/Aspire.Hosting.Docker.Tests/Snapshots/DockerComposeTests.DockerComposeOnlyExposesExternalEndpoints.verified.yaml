services:
  docker-compose-dashboard:
    image: "mcr.microsoft.com/aspire/nightly/dashboard:17.0"
    environment:
      ASPIRE_DASHBOARD_TELEMETRY_OPTOUT: "true"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  service:
    image: "nginx:latest"
    ports:
      - "8081:8081"
    expose:
      - "8080"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
