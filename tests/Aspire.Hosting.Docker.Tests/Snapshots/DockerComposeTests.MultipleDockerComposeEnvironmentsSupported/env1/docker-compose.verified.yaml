services:
  env1-dashboard:
    image: "mcr.microsoft.com/aspire/nightly/dashboard:17.0"
    environment:
      ASPIRE_DASHBOARD_TELEMETRY_OPTOUT: "true"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  api1:
    image: "myimage:latest"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
