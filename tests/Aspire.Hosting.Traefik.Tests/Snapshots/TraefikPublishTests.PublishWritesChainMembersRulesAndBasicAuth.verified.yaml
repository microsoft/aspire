services:
  traefik:
    image: "docker.io/library/traefik:v3.7"
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.traefik.address=:8080"
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`aspire.traefik.traefik`, `true`)"
    ports:
      - "80:80"
    expose:
      - "8080"
    volumes:
      - type: "bind"
        target: "/var/run/docker.sock"
        source: "/var/run/docker.sock"
        read_only: true
    networks:
      - "aspire"
  api:
    image: "myregistry/api:latest"
    expose:
      - "8080"
    networks:
      - "aspire"
    labels:
      traefik.enable: "true"
      aspire.traefik.traefik: "true"
      traefik.http.routers.api.rule: "Host(`api.${DOMAIN}`) && PathPrefix(`/v1`) && (PathRegexp(`^/v1/[a-z]{2,8}$$`) || Method(`OPTIONS`))"
      traefik.http.routers.api.entrypoints: "web"
      traefik.http.routers.api.service: "api"
      traefik.http.routers.api.middlewares: "defaults,auth,api-strip"
      traefik.http.middlewares.defaults.chain.middlewares: "security,compress"
      traefik.http.middlewares.security.headers.stsSeconds: "31536000"
      traefik.http.middlewares.security.headers.frameDeny: "true"
      traefik.http.middlewares.security.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.security.headers.referrerPolicy: "strict-origin-when-cross-origin"
      traefik.http.middlewares.compress.compress: "true"
      traefik.http.middlewares.auth.basicAuth.users: "${ADMIN_HTPASSWD}"
      traefik.http.middlewares.api-strip.stripPrefix.prefixes: "/v1"
      traefik.http.services.api.loadbalancer.server.port: "8080"
networks:
  aspire:
    driver: "bridge"
