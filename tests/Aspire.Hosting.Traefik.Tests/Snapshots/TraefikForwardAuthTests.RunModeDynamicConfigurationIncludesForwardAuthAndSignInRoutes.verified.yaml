http:
  routers:
    sso-proxy-1:
      rule: Host(`admin.dev.localhost`) && PathPrefix(`/oauth2`)
      entryPoints:
      - web
      service: sso-proxy-1
      priority: 1000000
    api:
      rule: Host(`api.dev.localhost`)
      entryPoints:
      - web
      service: api
      middlewares:
      - check
    admin:
      rule: Host(`admin.dev.localhost`)
      entryPoints:
      - web
      service: admin
      middlewares:
      - sso
  services:
    sso-proxy-1:
      loadBalancer:
        servers:
        - url: http://sso-proxy:4180
    api:
      loadBalancer:
        servers:
        - url: http://api:8080
    admin:
      loadBalancer:
        servers:
        - url: http://admin:8080
  middlewares:
    check:
      forwardAuth:
        address: http://host.docker.internal:5300/verify
        authResponseHeaders:
        - X-User
    sso:
      forwardAuth:
        address: http://sso-proxy:4180/
        authResponseHeaders:
        - X-Auth-Request-User
        - X-Auth-Request-Email
        - X-Auth-Request-Preferred-Username
        - X-Auth-Request-Groups
