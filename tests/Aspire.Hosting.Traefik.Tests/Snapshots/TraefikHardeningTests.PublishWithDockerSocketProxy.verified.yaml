services:
  traefik:
    image: "docker.io/library/traefik:v3.7"
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.traefik.address=:8080"
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--accesslog=true"
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`aspire.traefik.traefik`, `true`)"
      - "--providers.docker.endpoint=tcp://traefik-socket-proxy:2375"
    ports:
      - "80:80"
    expose:
      - "8080"
    depends_on:
      traefik-socket-proxy:
        condition: "service_started"
    networks:
      - "aspire"
  traefik-socket-proxy:
    image: "docker.io/tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459"
    environment:
      CONTAINERS: "1"
    expose:
      - "2375"
    volumes:
      - type: "bind"
        target: "/var/run/docker.sock"
        source: "/var/run/docker.sock"
        read_only: true
    networks:
      - "aspire"
  api:
    image: "myregistry/api:latest"
    expose:
      - "8080"
    networks:
      - "aspire"
    labels:
      traefik.enable: "true"
      aspire.traefik.traefik: "true"
      traefik.http.routers.api.rule: "Host(`api.example.com`)"
      traefik.http.routers.api.entrypoints: "web"
      traefik.http.routers.api.service: "api"
      traefik.http.services.api.loadbalancer.server.port: "8080"
networks:
  aspire:
    driver: "bridge"
