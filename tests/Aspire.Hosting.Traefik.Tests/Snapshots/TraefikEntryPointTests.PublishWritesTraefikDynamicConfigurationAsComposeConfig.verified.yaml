services:
  traefik:
    image: "docker.io/library/traefik:v3.7"
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.traefik.address=:8080"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      - "--entrypoints.websecure.http.middlewares=defaults@file"
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`aspire.traefik.traefik`, `true`)"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--api.dashboard=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@example.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
    ports:
      - "80:80"
      - "443:443"
    expose:
      - "8080"
    volumes:
      - type: "bind"
        target: "/var/run/docker.sock"
        source: "/var/run/docker.sock"
        read_only: true
      - type: "volume"
        target: "/letsencrypt"
        source: "aspire.hosting.testutilities-53c8d7322c-traefik-letsencrypt"
        read_only: false
    networks:
      - "aspire"
    configs:
      - source: "traefik-dynamic"
        target: "/etc/traefik/dynamic/aspire.yml"
  auth-server:
    image: "myregistry/auth:latest"
    expose:
      - "9000"
    networks:
      - "aspire"
  api:
    image: "myregistry/api:latest"
    expose:
      - "8080"
    networks:
      - "aspire"
    labels:
      traefik.enable: "true"
      aspire.traefik.traefik: "true"
      traefik.http.routers.api.rule: "Host(`api.${DOMAIN}`)"
      traefik.http.routers.api.entrypoints: "websecure"
      traefik.http.routers.api.service: "api"
      traefik.http.routers.api.tls: "true"
      traefik.http.routers.api.tls.certresolver: "letsencrypt"
      traefik.http.services.api.loadbalancer.server.port: "8080"
networks:
  aspire:
    driver: "bridge"
volumes:
  aspire.hosting.testutilities-53c8d7322c-traefik-letsencrypt:
    driver: "local"
configs:
  traefik-dynamic:
    content: "http:\n  routers:\n    traefik-dashboard:\n      rule: Host(`traefik.${DOMAIN}`)\n      entryPoints:\n      - websecure\n      service: api@internal\n      middlewares:\n      - dashboard-auth\n      tls:\n        certResolver: letsencrypt\n  middlewares:\n    defaults:\n      chain:\n        middlewares:\n        - headers\n        - check\n    headers:\n      headers:\n        customResponseHeaders:\n          X-Price: $$5\n    check:\n      forwardAuth:\n        address: http://auth-server:9000/verify\n    dashboard-auth:\n      basicAuth:\n        users:\n        - ${DASHBOARD_HTPASSWD}\n"
