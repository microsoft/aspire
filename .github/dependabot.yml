version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/extension"
    groups:
      npm:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/tests/Aspire.Cli.EndToEnd.Tests"
    groups:
      npm:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
