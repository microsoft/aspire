name: Update Aspire Skills Bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Aspire skills release version to embed. Defaults to the currently pinned version."
        required: false
        type: string
  schedule:
    - cron: '0 17 * * *' # 9am PT / 17:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update-and-pr:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'microsoft' && inputs.version != 'permission-probe' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate GitHub App Token for bundle update
        id: update-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ASPIRE_BOT_APP_ID }}
          private-key: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}

      - name: Update embedded Aspire skills bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.update-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VERSION)) {
            ./eng/scripts/update-aspire-skills-bundle.ps1
          }
          else {
            ./eng/scripts/update-aspire-skills-bundle.ps1 -Version $env:VERSION
          }

      - name: Restore solution
        run: ./restore.sh

      - name: Test Aspire skills bundle and telemetry hooks
        run: >
          dotnet test --project tests/Aspire.Cli.Tests/Aspire.Cli.Tests.csproj
          --no-launch-profile
          --
          --filter-class "*.AspireSkillsInstallerTests"
          --filter-class "*.AspireSkillsBundleTests"
          --filter-class "*.AgentInitCommandTests"
          --filter-class "*.TelemetryHookInstallerTests"
          --filter-class "*.TelemetryHookScriptTests"
          --filter-not-trait "quarantined=true"
          --filter-not-trait "outerloop=true"

      - name: Generate GitHub App Token for pull request
        id: pr-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ASPIRE_BOT_APP_ID }}
          private-key: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}

      - name: Create or update pull request
        uses: ./.github/actions/create-pull-request
        with:
          token: ${{ steps.pr-token.outputs.token }}
          branch: update-aspire-skills-bundle
          base: main
          draft: true
          commit-message: "[Automated] Update Aspire skills bundle"
          labels: |
            area-cli
            area-engineering-systems
          title: "[Automated] Update Aspire skills bundle"
          body: "Auto-generated update to refresh the embedded Aspire skills bundle fallback used by the Aspire CLI."

  permission-probe:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'microsoft' && inputs.version == 'permission-probe' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate metadata-only GitHub App token
        id: metadata-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ASPIRE_BOT_APP_ID }}
          private-key: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}
          permission-metadata: read

      - name: Exercise public Aspire skills reads
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.metadata-token.outputs.token }}
        run: ./eng/scripts/update-aspire-skills-bundle.ps1

      - name: Restore checkout after skills update
        run: git restore --source=HEAD --staged --worktree .

      - name: Generate read-content pull-request token
        id: read-pr-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ASPIRE_BOT_APP_ID }}
          private-key: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Generate write-content pull-request token
        id: write-pr-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ASPIRE_BOT_APP_ID }}
          private-key: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Exercise pull-request labels and assignees
        shell: bash
        env:
          READ_TOKEN: ${{ steps.read-pr-token.outputs.token }}
          WRITE_TOKEN: ${{ steps.write-pr-token.outputs.token }}
        run: |
          set -euo pipefail

          base_branch="$GITHUB_REF_NAME"
          read_branch="ankj/permission-probe-read-${GITHUB_RUN_ID}"
          write_branch="ankj/permission-probe-write-${GITHUB_RUN_ID}"
          probe_label="permission-probe-${GITHUB_RUN_ID}"
          read_pr=""
          write_pr=""

          cleanup() {
            set +e
            if [ -n "$read_pr" ]; then
              GH_TOKEN="$WRITE_TOKEN" gh pr close "$read_pr" --repo "$GITHUB_REPOSITORY"
            fi
            if [ -n "$write_pr" ]; then
              GH_TOKEN="$WRITE_TOKEN" gh pr close "$write_pr" --repo "$GITHUB_REPOSITORY"
            fi
            GH_TOKEN="$WRITE_TOKEN" gh label delete "$probe_label" --repo "$GITHUB_REPOSITORY" --yes
            GH_TOKEN="$WRITE_TOKEN" gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${read_branch}"
            GH_TOKEN="$WRITE_TOKEN" gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${write_branch}"
          }
          trap cleanup EXIT

          base_tree=$(GH_TOKEN="$WRITE_TOKEN" gh api \
            "repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}" \
            --jq '.tree.sha')

          create_probe_ref() {
            local branch="$1"
            local message="$2"
            local commit_sha

            commit_sha=$(jq -n \
              --arg message "$message" \
              --arg tree "$base_tree" \
              --arg parent "$GITHUB_SHA" \
              '{message: $message, tree: $tree, parents: [$parent]}' |
              GH_TOKEN="$WRITE_TOKEN" gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/git/commits" \
                --input - \
                --jq '.sha')

            jq -n \
              --arg ref "refs/heads/${branch}" \
              --arg sha "$commit_sha" \
              '{ref: $ref, sha: $sha}' |
              GH_TOKEN="$WRITE_TOKEN" gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/git/refs" \
                --input -
          }

          create_probe_ref "$read_branch" "Create read-token permission probe"
          create_probe_ref "$write_branch" "Create write-token permission probe"

          GH_TOKEN="$READ_TOKEN" gh label create "$probe_label" \
            --repo "$GITHUB_REPOSITORY" \
            --color BFD4F2 \
            --description "Temporary GitHub App permission probe"
          GH_TOKEN="$READ_TOKEN" gh label create "$probe_label" \
            --repo "$GITHUB_REPOSITORY" \
            --color BFD4F2 \
            --description "Temporary GitHub App permission probe" \
            --force

          read_pr_url=$(GH_TOKEN="$READ_TOKEN" gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$base_branch" \
            --head "$read_branch" \
            --title "[permission probe] read-content token" \
            --body "Temporary permission validation; this pull request will be closed automatically." \
            --draft \
            --label "$probe_label" \
            --assignee radical)
          read_pr="${read_pr_url##*/}"

          GH_TOKEN="$READ_TOKEN" gh pr edit "$read_pr" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "$probe_label" \
            --add-label "$probe_label" \
            --remove-assignee radical \
            --add-assignee radical
          GH_TOKEN="$READ_TOKEN" gh pr view "$read_pr" \
            --repo "$GITHUB_REPOSITORY" \
            --json labels,assignees > /tmp/read-pr.json
          jq -e --arg label "$probe_label" \
            '([.labels[].name] | index($label)) != null and ([.assignees[].login] | index("radical")) != null' \
            /tmp/read-pr.json

          write_pr_url=$(GH_TOKEN="$WRITE_TOKEN" gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$base_branch" \
            --head "$write_branch" \
            --title "[permission probe] write-content token" \
            --body "Temporary permission validation; this pull request will be closed automatically." \
            --draft \
            --label "$probe_label" \
            --assignee radical)
          write_pr="${write_pr_url##*/}"

          GH_TOKEN="$WRITE_TOKEN" gh pr edit "$write_pr" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "$probe_label" \
            --add-label "$probe_label" \
            --remove-assignee radical \
            --add-assignee radical
          GH_TOKEN="$WRITE_TOKEN" gh pr view "$write_pr" \
            --repo "$GITHUB_REPOSITORY" \
            --json labels,assignees > /tmp/write-pr.json
          jq -e --arg label "$probe_label" \
            '([.labels[].name] | index($label)) != null and ([.assignees[].login] | index("radical")) != null' \
            /tmp/write-pr.json
