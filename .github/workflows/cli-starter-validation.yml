name: Aspire CLI Starter Validation

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      artifactSuffix:
        required: true
        type: string
      maxStartupSeconds:
        required: true
        type: number
      resourceReadyTimeoutSeconds:
        required: true
        type: number
      prNumber:
        required: true
        type: number
      workflowRunId:
        required: true
        type: string
      checkoutRef:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate:
    name: Validate
    if: ${{ github.repository == 'microsoft/aspire' }}
    runs-on: ${{ inputs.runner }}
    # Shared budget for every caller of this reusable workflow. The validation script can spend
    # up to six startup waits (run + start for three templates) and five resource waits, which is
    # 42 minutes on the current Windows ARM64 input set before template creation, package add, log
    # collection, and artifact upload. Keep the job timeout above that aggregate budget.
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Configure NuGet package cache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Write-Output "NUGET_PACKAGES=${{ github.workspace }}/.nuget/packages" >> $env:GITHUB_ENV

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkoutRef }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Go
        shell: pwsh
        # Download the official toolchain directly so this lane needs no additional action pin.
        # Verify the archive using the checksum published by https://go.dev/dl/?mode=json.
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $os = switch ('${{ runner.os }}') {
            'Windows' { 'windows' }
            'macOS' { 'darwin' }
            'Linux' { 'linux' }
            default { throw 'Unsupported runner OS' }
          }
          $arch = switch ('${{ runner.arch }}') {
            'X64' { 'amd64' }
            'ARM64' { 'arm64' }
            default { throw 'Unsupported runner architecture' }
          }
          $releases = Invoke-RestMethod 'https://go.dev/dl/?mode=json&include=all'
          $release = $releases | Where-Object version -EQ 'go1.26.10'
          $archive = @($release.files | Where-Object { $_.os -eq $os -and $_.arch -eq $arch -and $_.kind -eq 'archive' })
          if ($archive.Count -ne 1) { throw "Expected one Go archive for $os/$arch" }
          $download = Join-Path $env:RUNNER_TEMP $archive[0].filename
          Invoke-WebRequest "https://go.dev/dl/$($archive[0].filename)" -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash -ne $archive[0].sha256) {
            throw 'Go archive checksum mismatch'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'starter-go'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          if ($os -eq 'windows') {
            Expand-Archive $download -DestinationPath $destination
          } else {
            tar -xzf $download -C $destination
          }
          $goBin = Join-Path $destination 'go/bin'
          $goBin >> $env:GITHUB_PATH
          & (Join-Path $goBin 'go') version

      - name: Install Aspire CLI from PR dogfood script
        shell: pwsh
        env:
          PR_NUMBER: ${{ inputs.prNumber }}
          WORKFLOW_RUN_ID: ${{ inputs.workflowRunId }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "eng/scripts/get-aspire-cli-pr.ps1"
          & $scriptPath ([int]$env:PR_NUMBER) -WorkflowRunId ([long]$env:WORKFLOW_RUN_ID) -SkipExtension

          aspire --version

      - name: Create starter app and validate startup
        # Leave headroom above the script's aggregate wait budget so slower runs can still finish
        # template creation, aspire add, and cleanup instead of being cancelled mid-validation.
        timeout-minutes: 55
        shell: pwsh
        env:
          PR_NUMBER: ${{ inputs.prNumber }}
          MAX_STARTUP_SECONDS: ${{ inputs.maxStartupSeconds }}
          RESOURCE_READY_TIMEOUT_SECONDS: ${{ inputs.resourceReadyTimeoutSeconds }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:GITHUB_WORKSPACE/eng/scripts/cli-starter-validation.ps1" `
            -PRNumber ([int]$env:PR_NUMBER) `
            -MaxStartupSeconds ([int]$env:MAX_STARTUP_SECONDS) `
            -ResourceReadyTimeoutSeconds ([int]$env:RESOURCE_READY_TIMEOUT_SECONDS)

      - name: Collect CLI logs
        if: always()
        shell: pwsh
        run: |
          $validationRoot = Join-Path $env:RUNNER_TEMP 'aspire-cli-starter-validation'
          $cliLogsDir = Join-Path $HOME '.aspire/logs'
          $sharedLogsDir = Join-Path $validationRoot 'cli-logs'

          if (Test-Path $cliLogsDir) {
            New-Item -ItemType Directory -Path $validationRoot -Force | Out-Null
            Copy-Item -Path $cliLogsDir -Destination $sharedLogsDir -Recurse -Force
          }

      - name: Upload starter validation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-starter-validation-${{ inputs.artifactSuffix }}
          path: ${{ runner.temp }}/aspire-cli-starter-validation
          if-no-files-found: ignore
