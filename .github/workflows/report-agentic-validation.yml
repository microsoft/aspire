name: Report Agentic Validation

on:
  workflow_run:
    workflows: [Validate Agentic Workflows]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

# Serialize runs from the same source branch without dropping another PR's pending
# report. Freshness is checked again before writing.
concurrency:
  group: report-agentic-validation-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      ${{
        github.repository == 'microsoft/aspire' &&
        github.event.workflow_run.event == 'pull_request' &&
        contains(fromJSON('["failure", "success"]'), github.event.workflow_run.conclusion)
      }}
    runs-on: ubuntu-latest
    steps:
      # workflow_run's SHA belongs to the default branch, not the untrusted source
      # run. Never replace this with workflow_run.head_sha or download PR artifacts.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Update validation comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const report = require('./.github/workflows/agentic-validation-report.js');
            await report.publish({ github, context, core });
