# Predict labels for Pull Requests using a trained model
name: "Labeler: Predict (Pulls)"

on:
  # Per to the following documentation:
  # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#pull_request_target
  #
  # The `pull_request_target` event runs in the context of the base of the pull request, rather
  # than in the context of the merge commit, as the `pull_request` event does. This prevents
  # execution of unsafe code from the head of the pull request that could alter the repository
  # or steal any secrets you use in your workflow. This event allows your workflow to do things
  # like label or comment on pull requests from forks.
  #
  # Predict area labels when pull requests are first opened. Assignment and lifecycle events
  # keep the needs-assignee label on Copilot-authored pull requests in sync.
  pull_request_target:
    # zizmor: ignore[dangerous-triggers] - the workflow uses base-controlled actions and never executes pull request code
    types: [opened, reopened, closed, assigned, unassigned]

    # Configure the branches that need to have PRs labeled
    branches:
      - 'main'
      - 'release/**'

  # Poll for open pull requests that need labels every 5 minutes
  schedule:
    - cron: "*/5 * * * *"

  # Allow dispatching the workflow via the Actions UI, specifying ranges of numbers
  # If no pull request numbers are provided, all open pull requests that need labels are processed
  workflow_dispatch:
    inputs:
      pulls:
        description: "Pull Request Numbers (comma-separated list of ranges). Leave empty to process all open pull requests that need labels."
        required: false
      cache_key:
        description: "The cache key suffix to use for restoring the model. Defaults to 'ACTIVE'."
        required: true
        default: "ACTIVE"

env:
  # Suppress failures on PR events to avoid blocking merges. Scheduled runs must fail so the poll cursor doesn't advance past missed PRs.
  ALLOW_FAILURE: ${{ github.event_name == 'pull_request_target' }}

  LABEL_PREFIX: "area-"
  THRESHOLD: 0.40
  DEFAULT_LABEL: "needs-area-label"
  EXCLUDED_AUTHORS: "" # Comma-separated list of authors to exclude from training data

jobs:
  update-copilot-assignee-label:
    if: ${{ github.event_name == 'pull_request_target' && github.repository_owner == 'microsoft' }}
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-assignee-label-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: "Checkout label script"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_target sources the workflow from the default branch. Use the matching
          # trusted event SHA so release-targeted pull requests can load this helper too.
          ref: ${{ github.sha }}
          sparse-checkout: .github/workflows/labeler-predict-pulls.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: "Update Copilot PR assignee label"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./.github/workflows/labeler-predict-pulls.js')({ github, context });

  poll-pull-requests:
    # Poll on schedule within the 'microsoft' org, or on manual dispatch without pull request numbers
    if: ${{ (github.event_name == 'schedule' && github.repository_owner == 'microsoft') || (github.event_name == 'workflow_dispatch' && inputs.pulls == '') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
    outputs:
      pulls: ${{ steps.get-pulls.outputs.pulls }}
    steps:
      - name: "Get open pull requests needing labels"
        id: get-pulls
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          # Scheduled runs use the last successful run's start, with 5 minutes of overlap.
          # Manual runs and the first scheduled run look at all open pull requests.
          search=""
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            last_run=$(gh run list --workflow "$WORKFLOW" --event schedule --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty')
            if [ -n "$last_run" ]; then
              search="updated:>=$(date -u -d "$last_run - 5 minutes" +"%Y-%m-%dT%H:%M:%SZ")"
            fi
          fi

          echo "Searching open pull requests: ${search:-all}"
          pulls=$(gh pr list --state open --limit 1000 --search "$search" --json number,labels \
            --jq '[.[] | select(.labels | map(.name) | any(startswith(env.LABEL_PREFIX)) | not) | .number] | join(",")')

          echo "Pull requests needing labels: $pulls"
          echo "pulls=$pulls" >> "$GITHUB_OUTPUT"

  predict-pull-label:
    # Run even when polling is skipped, but only when there are pull requests to label
    # Do not automatically run the workflow on forks outside the 'microsoft' org
    if: ${{ !cancelled() && (github.event_name != 'pull_request_target' || github.event.action == 'opened') && (github.event_name == 'workflow_dispatch' || github.repository_owner == 'microsoft') && (inputs.pulls || needs.poll-pull-requests.outputs.pulls || github.event.number) }}
    needs: [poll-pull-requests]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: "Restore pulls model from cache"
        id: restore-model
        uses: dotnet/issue-labeler/restore@160b6b1e1e8d36da09beb34ef1e4806d2c0520a3 # v2.2.0
        with:
          type: pulls
          fail-on-cache-miss: ${{ !fromJSON(env.ALLOW_FAILURE) }}
          # v2.2.0 only enforces fail-on-cache-miss when quiet is false.
          quiet: ${{ fromJSON(env.ALLOW_FAILURE) }}
          cache_key: ${{ inputs.cache_key || 'ACTIVE' }}

      - name: "Predict pull labels"
        id: prediction
        if: ${{ steps.restore-model.outputs.cache-hit == 'true' }}
        uses: dotnet/issue-labeler/predict@160b6b1e1e8d36da09beb34ef1e4806d2c0520a3 # v2.2.0
        with:
          pulls: ${{ inputs.pulls || needs.poll-pull-requests.outputs.pulls || github.event.number }}
          label_prefix: ${{ env.LABEL_PREFIX }}
          threshold: ${{ env.THRESHOLD }}
          default_label: ${{ env.DEFAULT_LABEL }}
          excluded_authors: ${{ env.EXCLUDED_AUTHORS }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: ${{ fromJSON(env.ALLOW_FAILURE) }}
