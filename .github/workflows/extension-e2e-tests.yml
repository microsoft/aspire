          - name: Linux
            shardName: zero-to-running
            spec: out/test-e2e/test-e2e/zeroToRunning.e2e.test.js
            runner: ubuntu-latest
            rid: linux-x64
            archivePattern: aspire-cli-linux-x64*.tar.gz
            cliBinary: aspire
            useXvfb: true
          - name: Windows
            shardName: zero-to-running
            spec: out/test-e2e/test-e2e/zeroToRunning.e2e.test.js
            runner: windows-latest
            rid: win-x64
            archivePattern: aspire-cli-win-x64*.zip
            cliBinary: aspire.exe
            useXvfb: false
          - name: Linux
            shardName: package-surface
            spec: out/test-e2e/test-e2e/packageSurface.e2e.test.js
            runner: ubuntu-latest
            rid: linux-x64
            archivePattern: aspire-cli-linux-x64*.tar.gz
            cliBinary: aspire
            useXvfb: true
          - name: Windows
            shardName: package-surface
            spec: out/test-e2e/test-e2e/packageSurface.e2e.test.js
            runner: windows-latest
            rid: win-x64
            archivePattern: aspire-cli-win-x64*.zip
            cliBinary: aspire.exe
            useXvfb: false
          - name: Linux
            shardName: java-apphost
            spec: out/test-e2e/test-e2e/javaAppHost.e2e.test.js
            runner: ubuntu-latest
            rid: linux-x64
            archivePattern: aspire-cli-linux-x64*.tar.gz
            cliBinary: aspire
            useXvfb: true
            installJava: true
            timeoutMinutes: 110
          - name: Linux
            shardName: java-apphost-debug-startup-timeout
            spec: out/test-e2e/test-e2e/javaAppHostDebugStartupTimeout.e2e.test.js
            runner: ubuntu-latest
            rid: linux-x64
            archivePattern: aspire-cli-linux-x64*.tar.gz
            cliBinary: aspire
            useXvfb: true
            installJava: true
            timeoutMinutes: 110
            unsetCliStartTimeout: true
          - name: Linux
            shardName: java-codelens
            spec: out/test-e2e/test-e2e/javaCodeLens.e2e.test.js
            runner: ubuntu-latest
            rid: linux-x64
            archivePattern: aspire-cli-linux-x64*.tar.gz
            cliBinary: aspire
            useXvfb: true
            installJava: true
          - name: Linux
            shardName: workspace-target-proof
            spec: out/test-e2e/test-e2e/workspaceTargetProof.e2e.test.js
            runner: ubuntu-latest
            rid: linux-x64
            archivePattern: aspire-cli-linux-x64*.tar.gz
            cliBinary: aspire
            useXvfb: true
          - name: Linux
            shardName: cli-path-resolution
            spec: out/test-e2e/test-e2e/cliPathResolution.e2e.test.js
            runner: ubuntu-latest
            rid: linux-x64
            archivePattern: aspire-cli-linux-x64*.tar.gz
            cliBinary: aspire
            useXvfb: true
          - name: Linux
            shardName: cli-path-rejection
            spec: out/test-e2e/test-e2e/cliPathRejectionNotification.e2e.test.js
            runner: ubuntu-latest
            rid: linux-x64
            archivePattern: aspire-cli-linux-x64*.tar.gz
            cliBinary: aspire
            useXvfb: true
          - name: Windows
            shardName: cli-path-rejection
            spec: out/test-e2e/test-e2e/cliPathRejectionNotification.e2e.test.js
            runner: windows-latest
            rid: win-x64
            archivePattern: aspire-cli-win-x64*.zip
            cliBinary: aspire.exe
            useXvfb: false
          - name: Linux
            shardName: edge-cases
            spec: out/test-e2e/test-e2e/edgeCases.e2e.test.js
            runner: ubuntu-latest
            rid: linux-x64
            archivePattern: aspire-cli-linux-x64*.tar.gz
            cliBinary: aspire
            useXvfb: true
          - name: Windows
            shardName: edge-cases
            spec: out/test-e2e/test-e2e/edgeCases.e2e.test.js
            runner: windows-latest
            rid: win-x64
            archivePattern: aspire-cli-win-x64*.zip
            cliBinary: aspire.exe
            useXvfb: false
          - name: Linux
            shardName: launch-profiles
            spec: out/test-e2e/test-e2e/launchProfiles.e2e.test.js
            runner: ubuntu-latest
            rid: linux-x64
            archivePattern: aspire-cli-linux-x64*.tar.gz
            cliBinary: aspire
            useXvfb: true
          - name: Windows
            shardName: launch-profiles
            spec: out/test-e2e/test-e2e/launchProfiles.e2e.test.js
            runner: windows-latest
            rid: win-x64
            archivePattern: aspire-cli-win-x64*.zip
            cliBinary: aspire.exe
            useXvfb: false
          - name: Linux
            shardName: azure-functions
            advisoryIssue: https://github.com/microsoft/aspire/issues/19151
            spec: out/test-e2e/test-e2e/azureFunctions.e2e.test.js
            runner: ubuntu-latest
            rid: linux-x64
            archivePattern: aspire-cli-linux-x64*.tar.gz
            cliBinary: aspire
            useXvfb: true
            installAzureFunctions: true
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.x'

      - name: Install Corepack
        working-directory: extension
        run: |
          # Scope Corepack's cache to this job so prepareCorepackYarn.mjs cannot
          # collide with any other build sharing the runner's user profile.
          # Cannot be set at job-level env: the `runner` context is unavailable
          # in job env evaluation, so we forward it through $GITHUB_ENV instead.
          $CorepackHome = Join-Path $env:RUNNER_TEMP 'corepack'
          $env:COREPACK_HOME = $CorepackHome
          "COREPACK_HOME=$CorepackHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $CorepackVersion = (Get-Content -Raw -Path 'scripts/corepack-version.txt').Trim()
          # The hosted Windows image already has a yarn shim in npm's global
          # prefix. The npm Corepack package owns that shim too, so force only
          # in CI where the tool install is isolated to this ephemeral job.
          npm install --global --force --registry "$env:NPM_REGISTRY" "corepack@$CorepackVersion"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $npmGlobalBin = (npm prefix --global).Trim()
          $env:PATH = "$npmGlobalBin$([IO.Path]::PathSeparator)$env:PATH"
          $npmGlobalBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $installed = (corepack --version).Trim()
          if ($installed -ne $CorepackVersion) {
            Write-Error "corepack version mismatch: expected $CorepackVersion, got '$installed'. The bundled Corepack on PATH may be taking precedence over the npm-global install."
            exit 1
          }

          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Seed Corepack's cache from the internal dnceng npm feed. Corepack's
          # built-in prepare path can bypass the configured internal feed, so use
          # the shared cache seeding script before any `corepack yarn` invocation.
          node ./scripts/prepareCorepackYarn.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          corepack yarn --version

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Download VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aspire-extension
          path: extension/out

      - name: Download CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-native-archives-${{ matrix.rid }}
          path: artifacts/cli-archive

      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-nugets
          path: artifacts/nugets

      - name: Download RID-specific NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-nugets-for-${{ matrix.rid }}
          path: artifacts/nugets-rid

      - name: Validate lockfile registries
        working-directory: extension
        run: node scripts/validate-lockfile-registry.cjs

      - name: Install extension dependencies
        working-directory: extension
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            corepack yarn install --frozen-lockfile --non-interactive
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            $exitCode = $LASTEXITCODE
            if ($attempt -eq 3) {
              Write-Error "corepack yarn install failed after $attempt attempts."
              exit $exitCode
            }

            $delay = $attempt * 30
            Write-Host "corepack yarn install failed with exit code $exitCode. Retrying in ${delay}s (attempt $($attempt + 1) of 3)."
            Start-Sleep -Seconds $delay
          }

      - name: Install Azure Functions E2E prerequisites
        if: ${{ matrix.installAzureFunctions }}
        shell: bash
        run: |
          set -euo pipefail

          core_tools_version='4.12.1'
          core_tools_directory="$RUNNER_TEMP/azure-functions-core-tools"
          core_tools_archive="$RUNNER_TEMP/Azure.Functions.Cli.linux-x64.${core_tools_version}.zip"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$core_tools_archive" \
            "https://github.com/Azure/azure-functions-core-tools/releases/download/${core_tools_version}/Azure.Functions.Cli.linux-x64.${core_tools_version}.zip"
          echo 'faf8fb8d50b5293df338bec70594b12f45730e9fe251805298859b2238cf627e  '"$core_tools_archive" | sha256sum --check -
          mkdir -p "$core_tools_directory"
          unzip -q "$core_tools_archive" -d "$core_tools_directory"
          chmod +x "$core_tools_directory/func"
          echo "$core_tools_directory" >> "$GITHUB_PATH"
          export PATH="$core_tools_directory:$PATH"
          func --version

          azure_resource_groups_vsix="$RUNNER_TEMP/vscode-azureresourcegroups-0.12.7.vsix"
          curl --fail --location --compressed --retry 3 --retry-all-errors \
            --output "$azure_resource_groups_vsix" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-azuretools/vsextensions/vscode-azureresourcegroups/0.12.7/vspackage'
          echo 'e4a2e7ab012de3777e1ac1781e2c25d65f150ad6f3770e8cfcc5a3d3658df35a  '"$azure_resource_groups_vsix" | sha256sum --check -

          azure_functions_vsix="$RUNNER_TEMP/vscode-azurefunctions-1.22.0.vsix"
          curl --fail --location --compressed --retry 3 --retry-all-errors \
            --output "$azure_functions_vsix" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-azuretools/vsextensions/vscode-azurefunctions/1.22.0/vspackage'
          echo '146aede06f941b07a55c5aebd28c5e3df684d57b07cf6f9ebf90d7bb8ecd41a2  '"$azure_functions_vsix" | sha256sum --check -

          {
            echo 'ASPIRE_EXTENSION_E2E_ENABLE_AZURE_FUNCTIONS=true'
            echo "ASPIRE_EXTENSION_E2E_AZURE_RESOURCE_GROUPS_VSIX=$azure_resource_groups_vsix"
            echo "ASPIRE_EXTENSION_E2E_AZURE_FUNCTIONS_VSIX=$azure_functions_vsix"
            echo 'FUNCTIONS_CORE_TOOLS_TELEMETRY_OPTOUT=1'
          } >> "$GITHUB_ENV"

      - name: Set up the JDK for the Java E2E specs
        if: ${{ matrix.installJava }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          # The CLI compiles a scaffolded Java AppHost with `javac --release 25`, because the AppHost
          # uses an instance main method in an implicitly declared class (JEP 512, finalized in 25).
          # Hosted runner images ship 17 and 21, so neither the AppHost nor the playground's Gradle
          # toolchain resolves without this.
          java-version: '25'

      - name: Cache Java dependencies for the Java E2E specs
        if: ${{ matrix.installJava }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          # The Java specs launch real Spring Boot resources, so a cold runner otherwise downloads the
          # whole Spring dependency tree inside the test's readiness budget. Cache the user-level Maven
          # and Gradle stores rather than a per-project directory: the specs run out of a generated
          # workspace copied from the playground, so only the shared caches survive the copy.
          path: |
            ~/.m2/repository
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: java-e2e-${{ runner.os }}-${{ hashFiles('playground/JavaSpringBoot/**/pom.xml', 'playground/JavaSpringBoot/**/build.gradle*', 'playground/JavaSpringBoot/**/gradle-wrapper.properties') }}
          restore-keys: |
            java-e2e-${{ runner.os }}-

      - name: Warm the Java dependency caches
        if: ${{ matrix.installJava }}
        shell: bash
        run: |
          set -euo pipefail

          # Resolving dependencies here rather than inside the specs keeps a cold cache from being
          # charged against the in-test wait for a resource endpoint, which is what made these shards
          # time out on cache misses. The AppHost project is deliberately excluded: it compiles against
          # the Aspire Java SDK that the CLI generates later, during the E2E run itself.
          #
          # A resolution failure must not fail the job - it only means the specs pay the download cost
          # they paid before this step existed.
          cd playground/JavaSpringBoot
          for maven_project in catalog worker; do
            # `dependency:go-offline` resolves the dependency tree but not every plugin a real build
            # runs, so compiling here is what actually leaves `~/.m2` - the directory this job caches -
            # holding the compiler, resources and Spring Boot plugins. The build output itself is
            # deliberately not reused: the specs copy the playground without `target/` so each run
            # builds clean, which is the same reason the Gradle project below is compiled rather than
            # only resolved.
            (cd "$maven_project" && ./mvnw --batch-mode --no-transfer-progress -q dependency:go-offline compile) \
              || echo "warning: could not pre-resolve Maven dependencies for $maven_project"
          done
          (cd orders && ./gradlew --no-daemon --quiet compileJava) \
            || echo 'warning: could not pre-resolve Gradle dependencies for orders'

      - name: Install Java E2E prerequisites
        if: ${{ matrix.installJava }}
        shell: bash
        run: |
          set -euo pipefail

          # The E2E VS Code instance runs offline, and the extension only advertises the `java`
          # capability - which is what makes the CLI hand a Java AppHost back to the extension to
          # launch and debug, instead of spawning `java` itself - when redhat.java and
          # vscjava.vscode-java-debug are both installed. vscode-java-dependency is a hard activation
          # dependency of the debug extension. Versions and digests are pinned so a marketplace
          # release cannot change what these shards are testing.
          #
          # redhat.java also publishes platform-specific builds that embed a JRE; the universal build
          # is a third of the size and runs on the JDK installed above.
          java_language_vsix="$RUNNER_TEMP/redhat-java-1.55.0.vsix"
          curl --fail --location --compressed --retry 3 --retry-all-errors \
            --output "$java_language_vsix" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/redhat/vsextensions/java/1.55.0/vspackage'
          echo '011639c3ee347b9591895bfc77d8cf28f836c053d0a49ae4a83efe9dc473a603  '"$java_language_vsix" | sha256sum --check -

          java_debug_vsix="$RUNNER_TEMP/vscjava-vscode-java-debug-0.59.0.vsix"
          curl --fail --location --compressed --retry 3 --retry-all-errors \
            --output "$java_debug_vsix" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/vscjava/vsextensions/vscode-java-debug/0.59.0/vspackage'
          echo 'e5973fcd763a984ea4d6e57644ccf8f5fe6caa80c0e589f29403f00c9ace3920  '"$java_debug_vsix" | sha256sum --check -

          java_dependency_vsix="$RUNNER_TEMP/vscjava-vscode-java-dependency-0.27.6.vsix"
          curl --fail --location --compressed --retry 3 --retry-all-errors \
            --output "$java_dependency_vsix" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/vscjava/vsextensions/vscode-java-dependency/0.27.6/vspackage'
          echo 'e4e7c8b90953e62c8ebcedaaafb88b3c42ddec3fcc9e37f268ac3203427d9fa0  '"$java_dependency_vsix" | sha256sum --check -

          {
            echo "ASPIRE_EXTENSION_E2E_JAVA_VSIX=$java_language_vsix:$java_debug_vsix:$java_dependency_vsix"
          } >> "$GITHUB_ENV"

          java -version

      - name: Prepare Aspire CLI and package hive
        id: prepare_cli
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $archive = Get-ChildItem -Path '${{ github.workspace }}/artifacts/cli-archive' -Recurse -File -Filter '${{ matrix.archivePattern }}' | Select-Object -First 1
          if ($null -eq $archive) {
            Get-ChildItem -Path '${{ github.workspace }}/artifacts/cli-archive' -Recurse -File | Format-Table -AutoSize
            throw "Unable to find CLI archive matching ${{ matrix.archivePattern }}."
          }

          $bundleDir = Join-Path '${{ github.workspace }}' 'artifacts/bundle/${{ matrix.rid }}'
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          if ('${{ runner.os }}' -eq 'Windows') {
            Expand-Archive -Path $archive.FullName -DestinationPath $bundleDir -Force
          } else {
            tar -xzf $archive.FullName -C $bundleDir
          }

          $cli = Get-ChildItem -Path $bundleDir -Recurse -File -Filter '${{ matrix.cliBinary }}' | Select-Object -First 1
          if ($null -eq $cli) {
            Get-ChildItem -Path $bundleDir -Recurse -File | Format-Table -AutoSize
            throw "Unable to find ${{ matrix.cliBinary }} in extracted CLI archive."
          }

          if ('${{ runner.os }}' -ne 'Windows') {
            chmod +x $cli.FullName
          }

          & $cli.FullName setup
          # pwsh does not stop on a native command's exit code, so an unchecked failure here left the
          # shard running without the orchestration component and failing minutes later with a debug
          # startup timeout instead of the real reason - "The Aspire orchestration component is not
          # installed at ~/.nuget/packages/microsoft.developercontrolplane.<rid>/<version>/tools/dcp".
          if ($LASTEXITCODE -ne 0) { throw "aspire setup failed with exit code $LASTEXITCODE." }

          # A zero exit code only means setup ran, not that it produced an orchestration component. The
          # shards resolve DCP from this bundle rather than from ~/.nuget/packages, because a
          # guest-language AppHost never restores the Microsoft.DeveloperControlPlane.<rid> package.
          # Assert it is really here so a missing DCP fails on this line, naming the component, instead
          # of surfacing minutes later as an unexplained debug startup timeout.
          #
          # `aspire setup` extracts to SetupCommand.GetDefaultInstallPath(processPath), which is the
          # *parent of the parent* of the CLI binary - not the directory the archive was unpacked into.
          # With the CLI at artifacts/bundle/<rid>/aspire that install path is artifacts/bundle, so DCP
          # lands beside $bundleDir rather than inside it. Derive the same path the CLI derives instead
          # of assuming a layout, otherwise this assertion fails on every shard even when setup worked.
          $cliDir = Split-Path -Path $cli.FullName -Parent
          $installPath = Split-Path -Path $cliDir -Parent
          $dcpExecutable = if ('${{ runner.os }}' -eq 'Windows') { 'dcp.exe' } else { 'dcp' }
          $dcp = Get-ChildItem -Path $installPath -Recurse -File -Filter $dcpExecutable -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $dcp) {
            Get-ChildItem -Path $installPath -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "'aspire setup' succeeded but no $dcpExecutable exists under $installPath, so every AppHost in this shard would fail to orchestrate."
          }
          Write-Host "Orchestration component: $($dcp.FullName)"
          "ASPIRE_DCP_PATH=$($dcp.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $shippingDir = Join-Path '${{ github.workspace }}' 'artifacts/nugets/Debug/Shipping'
          if (-not (Test-Path $shippingDir)) {
            $shippingDir = Join-Path '${{ github.workspace }}' 'artifacts/nugets'
          }

          $samplePackage = Get-ChildItem -Path $shippingDir -Recurse -File -Filter 'Aspire.Hosting.AppHost.*.nupkg' | Select-Object -First 1
          if ($null -eq $samplePackage) {
            throw "Unable to find Aspire.Hosting.AppHost.*.nupkg under $shippingDir."
          }

          $hiveLabel = $null
          if ($samplePackage.Name -match '-pr\.([0-9]+)\.') {
            $hiveLabel = "pr-$($Matches[1])"
          } elseif ('${{ startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/internal/release/') }}' -eq 'true') {
            $hiveLabel = 'staging'
          } else {
            $hiveLabel = 'daily'
          }

          $hiveDir = Join-Path $HOME ".aspire/hives/$hiveLabel/packages"
          New-Item -ItemType Directory -Path $hiveDir -Force | Out-Null
          Get-ChildItem -Path $shippingDir -Recurse -File -Filter '*.nupkg' | Copy-Item -Destination $hiveDir -Force
          $ridNugets = Join-Path '${{ github.workspace }}' 'artifacts/nugets-rid'
          if (Test-Path $ridNugets) {
            Get-ChildItem -Path $ridNugets -Recurse -File -Filter '*.nupkg' | Copy-Item -Destination $hiveDir -Force
          }

          "ASPIRE_EXTENSION_E2E_CLI_PATH=$($cli.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASPIRE_EXTENSION_E2E_APPHOST_SDK_VERSION=$(($samplePackage.Name -replace '^Aspire\.Hosting\.AppHost\.', '') -replace '\.nupkg$', '')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $cli.FullName --version

      - name: Compile extension E2E tests
        working-directory: extension
        run: |
          corepack yarn compile
          corepack yarn compile-e2e
          if (-not (Test-Path '${{ matrix.spec }}')) {
            throw "Compiled E2E shard spec was not found: ${{ matrix.spec }}"
          }

      - name: Install E2E recorder
        if: ${{ matrix.useXvfb }}
        run: |
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            ffmpeg -version | Select-Object -First 1
          } else {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          }

      - name: Run extension E2E tests
        working-directory: extension
        env:
          ASPIRE_EXTENSION_E2E_VSIX: ${{ github.workspace }}/extension/out/aspire-extension.vsix
          ASPIRE_EXTENSION_E2E_SHARD: ${{ matrix.shardName }}
          ASPIRE_EXTENSION_E2E_SPEC: ${{ matrix.spec }}
          ASPIRE_EXTENSION_E2E_ADVISORY_ISSUE: ${{ matrix.advisoryIssue }}
          ASPIRE_EXTENSION_E2E_UNSET_CLI_START_TIMEOUT: ${{ matrix.unsetCliStartTimeout }}
          # Linux E2E jobs run under Xvfb, where ffmpeg recordings are compact
          # and useful for diagnosing timing-sensitive flakes after the fact.
          ASPIRE_EXTENSION_E2E_RECORDING_MODE: ${{ matrix.useXvfb && 'always' || 'off' }}
        run: |
          if ('${{ matrix.useXvfb }}' -eq 'true') {
            xvfb-run -a node scripts/run-e2e.js
          } else {
            node scripts/run-e2e.js
          }

      - name: Upload E2E diagnostics
        id: upload_e2e_diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: extension-e2e-diagnostics-${{ matrix.rid }}-${{ matrix.shardName }}-attempt${{ github.run_attempt }}
          path: |
            extension/.test-results/**
            extension/.test-storage/**/settings/User/**
            extension/.test-storage/**/settings/logs/**
            extension/.test-storage/**/screenshots/**
            extension/.test-storage/**/aspire-home/logs/**
            extension/.test-storage/**/aspire-home/cache/apphost-info/**
            extension/.test-workspaces/**/.aspire/**
            extension/.test-workspaces/**/*.log
            extension/.test-recordings/**
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Print E2E diagnostics links
        if: always()
        working-directory: extension
        run: |
          $artifactName = "extension-e2e-diagnostics-${{ matrix.rid }}-${{ matrix.shardName }}-attempt${{ github.run_attempt }}"
          $artifactUrl = "${{ steps.upload_e2e_diagnostics.outputs.artifact-url }}"
          $uploadOutcome = "${{ steps.upload_e2e_diagnostics.outcome }}"
          if ([string]::IsNullOrWhiteSpace($artifactUrl)) {
            $artifactUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
          }
          $hasResults = Test-Path ".test-results"
          $hasStorage = Test-Path ".test-storage"
          $recordings = Get-ChildItem -Path ".test-recordings" -Recurse -File -Filter "*.mp4" -ErrorAction SilentlyContinue
          $recordingLogs = Get-ChildItem -Path ".test-recordings" -Recurse -File -Filter "*.ffmpeg.log" -ErrorAction SilentlyContinue
          $screenshots = Get-ChildItem -Path ".test-storage" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "[/\\]screenshots[/\\]" }

          Write-Host "Extension E2E diagnostics artifact: $artifactName"
          Write-Host "Diagnostics upload outcome: $uploadOutcome"
          if ($uploadOutcome -ne 'success') {
            Write-Warning "Diagnostics upload did not complete successfully. Keeping the shard result based on the test step."
          }
          Write-Host "Artifacts page: $artifactUrl"
          if ($hasResults) {
            Write-Host "Mocha/state files are under .test-results inside the artifact."
          }
          if ($hasStorage) {
            Write-Host "VS Code logs and Aspire home diagnostics are under .test-storage inside the artifact."
          }
          if ($screenshots) {
            Write-Host "Failure screenshots:"
            $screenshots | ForEach-Object { Write-Host "  $($_.FullName.Replace((Get-Location).Path + [IO.Path]::DirectorySeparatorChar, ''))" }
          } else {
            Write-Host "No failure screenshots were found for this shard."
          }
          if ($recordings) {
            Write-Host "E2E recordings:"
            $recordings | ForEach-Object { Write-Host "  $($_.FullName.Replace((Get-Location).Path + [IO.Path]::DirectorySeparatorChar, ''))" }
          } else {
            Write-Host "No E2E recordings were kept for this shard. Linux CI keeps recordings by default; Windows shards upload screenshots and logs only."
          }
          if ($recordingLogs) {
            Write-Host "Recorder logs:"
            $recordingLogs | ForEach-Object { Write-Host "  $($_.FullName.Replace((Get-Location).Path + [IO.Path]::DirectorySeparatorChar, ''))" }
          }
