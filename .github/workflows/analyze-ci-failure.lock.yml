              "description_suffixes": {},
              "repo_params": {},
              "dynamic_tools": [
                {
                  "description": "Publishes the CI failure analysis to the memory branch, then posts a PR\ncomment or updates a main-breakage issue according to the trusted scope.\nThe agent must write:\n  - /tmp/gh-aw/agent/analysis-result.json (run summary)\n  - /tmp/gh-aw/agent/causes/*.json (one file per failure cause)\nEmit exactly one `publish_data` item with run_id and pr_numbers.\n",
                  "inputSchema": {
                    "additionalProperties": false,
                    "properties": {
                      "pr_numbers": {
                        "description": "The unambiguous subject PR number, or an empty string.",
                        "type": "string"
                      },
                      "run_id": {
                        "description": "The workflow run ID that was analyzed.",
                        "type": "number"
                      }
                    },
                    "required": [
                      "pr_numbers",
                      "run_id"
                    ],
                    "type": "object"
                  },
                  "name": "publish_data"
                },
                {
                  "description": "Reruns the failed CI jobs when the agent determines all failures are\ntransient infrastructure issues. Emit exactly one `rerun_failed_jobs`\nitem with the run_id and pr_numbers when a rerun is warranted.\n",
                  "inputSchema": {
                    "additionalProperties": false,
                    "properties": {
                      "pr_numbers": {
                        "description": "The unambiguous subject PR number, or an empty string.",
                        "type": "string"
                      },
                      "reason": {
                        "description": "Short summary of why the rerun was requested.",
                        "type": "string"
                      },
                      "run_id": {
                        "description": "The workflow run ID to rerun failed jobs for.",
                        "type": "number"
                      }
                    },
                    "required": [
                      "pr_numbers",
                      "reason",
                      "run_id"
                    ],
                    "type": "object"
                  },
                  "name": "rerun_failed_jobs"
                }
              ]
            }
          GH_AW_VALIDATION_JSON: |
            {
              "missing_data": {
                "defaultMax": 20,
                "fields": {
                  "alternatives": {
                    "type": "string",
