name: "Milestone Changelog Generator"
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string

permissions: {}

concurrency:
  group: "gh-aw-${{ github.workflow }}"

run-name: "Milestone Changelog Generator"

env:
  BATCH_SIZE: "20"
  DOCS_REPO: microsoft/aspire.dev
  MILESTONE: "13.5"
  MILESTONE_START: "2026-06-02"
  PREVIOUS_MILESTONE: "13.4"
  PRODUCT: Aspire
  RELEASE_NOTES_URL: https://aka.ms/aspire/update-latest
  REPO: microsoft/aspire

