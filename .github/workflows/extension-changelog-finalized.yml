name: VS Code extension changelog merge gate

on:
  pull_request:

# This gate compares finalized extension release metadata against the current PR
# base SHA. Base-only extension changes do not automatically re-run an existing
# green check, so the eventual required status rule for "Extension changelog
# finalized" must use strict/up-to-date semantics.
permissions:
  contents: read

jobs:
  extension_changelog_finalized:
    name: Extension changelog finalized
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Preload trusted base history for release-branch stale range checks
        if: ${{ startsWith(github.head_ref, 'extension-release/') && github.base_ref == 'main' }}
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "Unshallowing trusted base ref ${PR_BASE_REF} so stale-range checks can compare any finalized TO against ${PR_BASE_SHA}."
            git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" \
              fetch --no-tags --unshallow origin "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
          else
            echo "Fetching trusted base ref ${PR_BASE_REF} to confirm stale-range checks against ${PR_BASE_SHA}."
            git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" \
              fetch --no-tags origin "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
          fi

          if ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Failed to preload trusted PR base history for ${PR_BASE_REF} (${PR_BASE_SHA})."
            exit 1
          fi

          echo "Trusted PR base commit ${PR_BASE_SHA} is available locally."

      - name: Verify extension changelog is finalized
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/workflows/check-extension-changelog-finalized.sh
