name: Build Packages (Reusable)

on:
  workflow_call:
    inputs:
      versionOverrideArg:
        required: false
        type: string

jobs:
  build_packages:
    name: Build packages
    if: ${{ github.repository == 'microsoft/aspire' }}
    runs-on: 8-core-ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with packages
        shell: bash
        env:
          VERSION_OVERRIDE_ARG: ${{ inputs.versionOverrideArg }}
        run: |
          # Overrides contain whitespace-separated MSBuild switches, such as /p:VersionSuffix=pr.123.gabcdef12.
          # Split them as arguments without evaluating caller-supplied values as shell code.
          read -r -a versionOverrideArgs <<< "$VERSION_OVERRIDE_ARG"
          ./build.sh \
            -restore \
            -build \
            -ci \
            -pack \
            -bl \
            -p:InstallBrowsersForPlaywright=false \
            -p:SkipTestProjects=true \
            -p:SkipPlaygroundProjects=true \
            -p:SkipBundleDeps=true \
            -p:SkipNativeBuild=true \
            "${versionOverrideArgs[@]}"

      - name: Generate template component manifest
        shell: pwsh
        run: ./eng/scripts/generate-template-cgmanifest.ps1

      - name: Upload template component manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-component-manifest
          path: artifacts/cg/templates/cgmanifest.json
          if-no-files-found: error
          retention-days: 5

      - name: Clean up artifacts
        run: |
          rm -rf artifacts/bin
          rm -rf artifacts/obj

      - name: Upload built NuGets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-nugets
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 15

      # Always upload logs, even if the build fails, to enable debugging
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build_packages_logs
          path: artifacts/log
          retention-days: 5
