name: Verify Aspire Skills Bundles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Aspire.Cli/Agents/AspireSkills/Embedded/**'
      - 'src/Aspire.Cli/Agents/Hooks/track-telemetry.sh'
      - 'src/Aspire.Cli/Agents/Hooks/track-telemetry.ps1'
      - 'eng/scripts/verify-aspire-skills-bundles.ps1'
      - 'eng/scripts/aspire-skills-bundles.common.ps1'
      - '.github/workflows/verify-aspire-skills-bundles.yml'

permissions:
  contents: read
  attestations: read

jobs:
  verify:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'microsoft' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify embedded Aspire Skills bundle attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./eng/scripts/verify-aspire-skills-bundles.ps1
