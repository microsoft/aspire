# Update Nix CLI Flake Workflow
#
# This workflow updates eng/nix/versions.json for a stable Aspire CLI release.
# It is dispatched by release-publish-nuget.yml, which passes the aspire-cli-*
# .sha512 digests it already downloaded and verified from the signed source
# build's BlobArtifacts. Because the checksums come from the build (not the
# GitHub release), the manifest can be produced while the release is still an
# unpublished draft — required for immutable releases, where draft assets aren't
# served from the public releases/download/... URL. The url values pinned in
# versions.json are still the public release download URLs (what Nix consumers
# fetch once the release is published); only the checksum source changed.
# Manual runs against an already-published release may omit the sha512_* inputs,
# in which case the updater reads the .sha512 assets from the release directly.
# The changes are committed to the update-baseline-<version> branch created by
# release-github-tasks.yml, then the workflow creates or updates the PR from
# that branch so the post-release stable-version updates land together.

name: Update Nix CLI Flake

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Stable release version (e.g., 13.4.6)'
        required: true
        type: string
      dry_run:
        description: 'Dry run mode - validate and log actions without making changes'
        required: false
        type: boolean
        default: false
      # Optional build-provided SHA512 digests (hex), one per platform RID. When
      # supplied (all four required), the manifest updater uses them directly and
      # does NOT read the .sha512 assets from the GitHub release. The AzDO release
      # pipeline passes the digests it already downloaded and verified from the
      # signed source build's BlobArtifacts, so the Nix manifest can be built
      # while the GitHub release is still an unpublished draft (draft assets are
      # not served from the public releases/download/... URL). Manual runs against
      # an already-published release can omit these and fall back to the release
      # read. See eng/nix/update-versions.sh for the offline-mode contract.
      sha512_osx_arm64:
        description: 'SHA512 (hex) of aspire-cli-osx-arm64-<version>.tar.gz. Optional; omit to read from the published release.'
        required: false
        type: string
      sha512_osx_x64:
        description: 'SHA512 (hex) of aspire-cli-osx-x64-<version>.tar.gz. Optional; omit to read from the published release.'
        required: false
        type: string
      sha512_linux_arm64:
        description: 'SHA512 (hex) of aspire-cli-linux-arm64-<version>.tar.gz. Optional; omit to read from the published release.'
        required: false
        type: string
      sha512_linux_x64:
        description: 'SHA512 (hex) of aspire-cli-linux-x64-<version>.tar.gz. Optional; omit to read from the published release.'
        required: false
        type: string

concurrency:
  group: update-nix-cli-flake-${{ inputs.release_version }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-nix-flake:
    name: Update Nix flake manifest
    runs-on: ubuntu-latest
    steps:
      - name: Authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTOR="${{ github.actor }}"
          ACTOR_ID="${{ github.actor_id }}"
          echo "Checking if $ACTOR (id=$ACTOR_ID) is authorized to update the Nix flake..."

          if [[ "$ACTOR" == "aspire-repo-bot[bot]" ]]; then
            ACTOR_INFO=$(gh api "users/$ACTOR" 2>/dev/null || echo '')
            ACTOR_TYPE=$(echo "$ACTOR_INFO" | jq -r '.type // empty')
            ACTOR_API_ID=$(echo "$ACTOR_INFO" | jq -r '.id // empty')

            if [[ "$ACTOR_TYPE" != "Bot" ]]; then
              echo "ERROR: $ACTOR resolves to account type '$ACTOR_TYPE', expected 'Bot'."
              exit 1
            fi

            if [[ -z "$ACTOR_ID" || -z "$ACTOR_API_ID" || "$ACTOR_ID" != "$ACTOR_API_ID" ]]; then
              echo "ERROR: actor_id mismatch (context=$ACTOR_ID, api=$ACTOR_API_ID)."
              exit 1
            fi

            echo "Verified dispatcher is aspire-repo-bot GitHub App (type=Bot, id=$ACTOR_API_ID); skipping human permission check."
            exit 0
          fi

          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/$ACTOR/permission --jq '.permission')
          echo "User permission level: $PERMISSION"

          if [[ "$PERMISSION" != "admin" && "$PERMISSION" != "maintain" ]]; then
            echo "ERROR: User $ACTOR does not have sufficient permissions."
            echo "Required: 'admin' or 'maintain' permission level."
            echo "Current: '$PERMISSION'"
            exit 1
          fi

          echo "User $ACTOR is authorized (permission: $PERMISSION)"

      - name: Validate release version
        run: |
          VERSION="${{ inputs.release_version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release version: $VERSION"
            echo "Expected format: major.minor.patch"
            exit 1
          fi

          echo "Stable release version is valid: $VERSION"

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.ASPIRE_BOT_APP_ID }}
          private-key: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Dry Run - Show Nix update details
        if: inputs.dry_run == true
        run: |
          VERSION="${{ inputs.release_version }}"
          echo "[DRY RUN] Would update the Nix flake manifest:"
          echo "   Version: $VERSION"
          echo "   Manifest: eng/nix/versions.json"
          echo "   Release assets: https://github.com/${{ github.repository }}/releases/download/v$VERSION/aspire-cli-<rid>-$VERSION.tar.gz"
          echo "   Branch: update-baseline-$VERSION"
          echo "   Base: main"
          echo "   Labels: area-engineering-systems"
          echo ""
          echo "Dry-run does not fetch release assets because the AzDO dry-run path does not create or upload a live GitHub release."

      - name: Checkout baseline update branch
        if: inputs.dry_run != true
        run: |
          VERSION="${{ inputs.release_version }}"
          BRANCH_NAME="update-baseline-$VERSION"

          if ! git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null; then
            echo "Expected the existing post-release baseline branch '$BRANCH_NAME' to exist."
            echo "release-github-tasks.yml creates that branch before release-publish-nuget.yml uploads CLI assets and dispatches this workflow."
            exit 1
          fi

          git fetch origin "$BRANCH_NAME:$BRANCH_NAME"
          git checkout "$BRANCH_NAME"

      - name: Update Nix release manifest
        if: inputs.dry_run != true
        env:
          # Passed through env (not string-interpolated into the run body) so the
          # digest values can't break the shell quoting. Empty when the caller
          # didn't supply build-provided checksums (manual/post-publish runs).
          SHA512_OSX_ARM64: ${{ inputs.sha512_osx_arm64 }}
          SHA512_OSX_X64: ${{ inputs.sha512_osx_x64 }}
          SHA512_LINUX_ARM64: ${{ inputs.sha512_linux_arm64 }}
          SHA512_LINUX_X64: ${{ inputs.sha512_linux_x64 }}
        run: |
          set -euo pipefail
          args=(--version "${{ inputs.release_version }}")

          # If any build-provided digest is present, run the updater in offline
          # mode (no GitHub release read). Require all four so the manifest is
          # complete and reproducible — a partial set is a pipeline wiring bug.
          if [[ -n "$SHA512_OSX_ARM64" || -n "$SHA512_OSX_X64" || -n "$SHA512_LINUX_ARM64" || -n "$SHA512_LINUX_X64" ]]; then
            if [[ -z "$SHA512_OSX_ARM64" || -z "$SHA512_OSX_X64" || -z "$SHA512_LINUX_ARM64" || -z "$SHA512_LINUX_X64" ]]; then
              echo "::error::Partial SHA512 inputs supplied. All four platform checksums (osx-arm64, osx-x64, linux-arm64, linux-x64) are required for offline mode."
              exit 1
            fi
            echo "Using build-provided SHA512 checksums (offline mode); not reading the GitHub release."
            args+=(--sha512 "osx-arm64=$SHA512_OSX_ARM64")
            args+=(--sha512 "osx-x64=$SHA512_OSX_X64")
            args+=(--sha512 "linux-arm64=$SHA512_LINUX_ARM64")
            args+=(--sha512 "linux-x64=$SHA512_LINUX_X64")
          else
            echo "No SHA512 inputs supplied; reading checksums from the published GitHub release assets."
          fi

          eng/nix/update-versions.sh "${args[@]}"

      - name: Show Nix manifest diff
        if: inputs.dry_run != true
        run: |
          if git diff --quiet -- eng/nix/versions.json; then
            echo "No Nix manifest changes are needed; eng/nix/versions.json already points at v${{ inputs.release_version }}."
          else
            git diff -- eng/nix/versions.json
          fi

      - name: Create Nix manifest PR
        if: inputs.dry_run != true
        uses: ./.github/actions/create-pull-request
        with:
          token: ${{ steps.app-token.outputs.token }}
          title: "Update PackageValidationBaselineVersion to ${{ inputs.release_version }}"
          body: |
            This PR updates the stable release baseline and first-party Nix flake manifest to Aspire CLI `${{ inputs.release_version }}` after the release assets were uploaded to GitHub.

            ## Changes
            - Updated `src/Directory.Build.props` with the new package validation baseline version.
            - Updated `eng/nix/versions.json` to point at the versioned GitHub release archives.
            - Pinned the official `.sha512` checksum assets as Nix SRI hashes.

            ---
            *Created automatically by the release pipeline.*
          branch: update-baseline-${{ inputs.release_version }}
          base: main
          commit-message: "Update Nix flake to v${{ inputs.release_version }}"
          labels: |
            area-engineering-systems
