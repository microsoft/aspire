name: Refresh Manifests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # 8am PST (16:00 UTC) - same schedule as API review

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-pr:
    runs-on: windows-latest # Using Windows because the script uses PowerShell and build.cmd
    if: ${{ github.repository == 'microsoft/aspire' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Run RefreshManifests Script
        shell: pwsh
        run: |
          ./eng/refreshManifests.ps1

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ASPIRE_BOT_APP_ID }}
          private-key: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}
          # contents pushes the manifest-update branch; pull-requests creates or updates
          # the manifest pull request and applies its labels.
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update pull request
        uses: ./.github/actions/create-pull-request
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update-manifests
          base: main
          commit-message: "[Automated] Update Playground Manifests"
          labels: |
            area-app-model
            area-engineering-systems
          title: "[Automated] Update Playground Manifests"
          body: "Auto-generated update to refresh the manifests."
