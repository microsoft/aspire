name: Update actionlint

# Proposes a draft PR when rhysd/actionlint publishes a newer release than the
# pin in .github/actionlint-version.json (consumed by ci.yml). Manual dispatch
# defaults to validating without changing the updater branch or opening a PR.
on:
  schedule:
    - cron: '0 16 * * 1' # Mondays 16:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: Validate the candidate or propose the pin update
        type: choice
        options:
          - validate
          - propose
        default: validate

permissions:
  contents: read

# Scheduled and propose runs force-push the same fixed branch. Serialize whole runs,
# not just the update job, so each run selects its release only after the previous
# run finished; otherwise a slower run could push an older candidate over a newer one.
# Validate runs use their own group so a queued validate never replaces a pending
# propose run (GitHub keeps only the newest pending run per group).
concurrency:
  group: update-actionlint-${{ github.event_name == 'schedule' && 'propose' || inputs.mode }}
  cancel-in-progress: false

jobs:
  # Downloads and runs the candidate binary without secrets or write credentials.
  check:
    name: Check for a newer actionlint
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'microsoft' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'validate') }}
    outputs:
      updated: ${{ steps.check.outputs.updated }}
      previous-version: ${{ steps.check.outputs.previous-version }}
      version: ${{ steps.check.outputs.version }}
      sha256: ${{ steps.check.outputs.sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check latest actionlint release
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/workflows/update-actionlint.js check

      - name: Install candidate actionlint
        if: ${{ steps.check.outputs.updated == 'true' }}
        env:
          ARCHIVE_PATH: ${{ steps.check.outputs.archive-path }}
        run: |
          tar -xzf "${ARCHIVE_PATH}" -C "${RUNNER_TEMP}" actionlint
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      # Shared with ci.yml so the candidate is proven against the gated file set.
      - name: Lint handwritten workflow files
        if: ${{ steps.check.outputs.updated == 'true' }}
        run: bash .github/workflows/lint-handwritten-workflows.sh

  update:
    name: Propose actionlint update
    needs: check
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'microsoft' && github.ref_name == github.event.repository.default_branch && needs.check.outputs.updated == 'true' && (github.event_name == 'schedule' || inputs.mode == 'propose') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update actionlint pin
        env:
          ACTIONLINT_VERSION: ${{ needs.check.outputs.version }}
          ACTIONLINT_SHA256: ${{ needs.check.outputs.sha256 }}
        run: node .github/workflows/update-actionlint.js apply "${ACTIONLINT_VERSION}" "${ACTIONLINT_SHA256}"

      - name: Generate GitHub App Token for pull request
        id: pr-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ASPIRE_BOT_APP_ID }}
          private-key: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update pull request
        # actionlint (pinned in .github/actionlint-version.json) rejects zizmor's preferred '$/' syntax.
        uses: ./.github/actions/create-pull-request # zizmor: ignore[self-repository]
        with:
          token: ${{ steps.pr-token.outputs.token }}
          branch: update-actionlint
          base: main
          draft: true
          commit-message: "[Automated] Update actionlint to v${{ needs.check.outputs.version }}"
          labels: |
            area-engineering-systems
          title: "[automated] Update actionlint to v${{ needs.check.outputs.version }}"
          body: |
            Updates the actionlint pin in `.github/actionlint-version.json` from v${{ needs.check.outputs.previous-version }} to v${{ needs.check.outputs.version }}.

            - Release: https://github.com/rhysd/actionlint/releases/tag/v${{ needs.check.outputs.version }}
            - `actionlint_${{ needs.check.outputs.version }}_linux_amd64.tar.gz` SHA-256: `${{ needs.check.outputs.sha256 }}`

            The archive was downloaded and verified against the release API asset digest, and the candidate passed the handwritten-workflow lint before this PR was opened. The digest is published by the same upstream release, so review the release notes before merging.
          update-existing-pr-metadata: true

  # File/append a single deduplicated issue when a scheduled run fails (release
  # lookup, digest verification, candidate lint, token minting, or PR creation).
  # The scheduled-workflow watchdog backstops startup_failure/timed_out runs. See
  # docs/ci/pipeline-failure-issues.md.
  create-issue-on-failure:
    name: Create Issue on Failure
    needs: [check, update]
    runs-on: ubuntu-latest
    if: ${{ failure() && github.event_name == 'schedule' && github.repository_owner == 'microsoft' }}
    permissions:
      contents: read   # checkout to require the local .js modules
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: File or update failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKFLOW_FILE: update-actionlint.yml
          DISPLAY_NAME: Update actionlint
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await require('./.github/workflows/report-pipeline-failure.js').report({
              github, context, core,
              labels: ['automation-broken', 'area-engineering-systems'],
            });
