# Hex1b requires a Linux terminal environment, so this workflow uses the same
# non-interactive PowerShell driver on every native runner.
name: Scratch CLI Platform Smoke Tests

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose dogfood packages should be tested
        required: true
        type: number
      workflow_run_id:
        description: CI workflow run containing the native CLI archives
        required: true
        type: number

permissions:
  actions: read
  contents: read

run-name: "CLI platform smoke tests for PR #${{ inputs.pr_number }} (run ${{ inputs.workflow_run_id }})"

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64
            runner: ubuntu-latest
            artifact_suffix: linux-x64
            max_startup_seconds: 120
            resource_ready_timeout_seconds: 120
          - name: Ubuntu ARM64
            runner: ubuntu-24.04-arm
            artifact_suffix: linux-arm64
            max_startup_seconds: 180
            resource_ready_timeout_seconds: 180
          - name: Windows x64
            runner: windows-latest
            artifact_suffix: windows-x64
            max_startup_seconds: 120
            resource_ready_timeout_seconds: 120
          - name: Windows ARM64
            runner: windows-11-arm
            artifact_suffix: windows-arm64
            max_startup_seconds: 180
            resource_ready_timeout_seconds: 300
          - name: macOS x64
            runner: macos-15-intel
            artifact_suffix: macos-x64
            max_startup_seconds: 180
            resource_ready_timeout_seconds: 180
          - name: macOS ARM64
            runner: macos-latest
            artifact_suffix: macos-arm64
            max_startup_seconds: 120
            resource_ready_timeout_seconds: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve artifact source commit
        id: source
        shell: pwsh
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $run = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:WORKFLOW_RUN_ID" | ConvertFrom-Json
          $pullRequest = @($run.pull_requests) |
            Where-Object { $_.number -eq [int]$env:PR_NUMBER } |
            Select-Object -First 1

          if ($null -eq $pullRequest) {
            throw "Workflow run $env:WORKFLOW_RUN_ID is not associated with PR #$env:PR_NUMBER."
          }

          $headSha = [string]$pullRequest.head.sha
          if ([string]::IsNullOrWhiteSpace($headSha)) {
            throw "Workflow run $env:WORKFLOW_RUN_ID did not report the head commit for PR #$env:PR_NUMBER."
          }

          "sha=$headSha" >> $env:GITHUB_OUTPUT

      - name: Checkout test driver
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'

      - name: Install Aspire CLI from PR artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:GITHUB_WORKSPACE/eng/scripts/get-aspire-cli-pr.ps1" `
            ${{ inputs.pr_number }} `
            -WorkflowRunId ${{ inputs.workflow_run_id }} `
            -SkipExtension

          aspire --version

      - name: Run CLI smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:GITHUB_WORKSPACE/eng/scripts/cli-starter-validation.ps1" `
            -PRNumber ${{ inputs.pr_number }} `
            -MaxStartupSeconds ${{ matrix.max_startup_seconds }} `
            -ResourceReadyTimeoutSeconds ${{ matrix.resource_ready_timeout_seconds }}

      - name: Collect CLI logs
        if: always()
        shell: pwsh
        run: |
          $validationRoot = Join-Path $env:RUNNER_TEMP 'aspire-cli-starter-validation'
          $cliLogsDir = Join-Path $HOME '.aspire/logs'
          $sharedLogsDir = Join-Path $validationRoot 'cli-logs'

          if (Test-Path $cliLogsDir) {
            New-Item -ItemType Directory -Path $validationRoot -Force | Out-Null
            Copy-Item -Path $cliLogsDir -Destination $sharedLogsDir -Recurse -Force
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cli-platform-smoke-${{ matrix.artifact_suffix }}
          path: ${{ runner.temp }}/aspire-cli-starter-validation
          if-no-files-found: ignore
