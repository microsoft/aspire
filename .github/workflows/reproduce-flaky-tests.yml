name: Reproduce Flaky Tests

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    name: MongoDB Kubernetes deployment diagnostics
    if: ${{ github.repository == 'microsoft/aspire' }}
    # MongoDB rejects the 7.0.0-* kernel currently used by the newer hosted images.
    # Keep MongoDB 8.3 unchanged and isolate kernel compatibility on Linux 6.8.
    # https://jira.mongodb.org/browse/SERVER-121912
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      MSBUILDTERMINALLOGGER: "false"
      ASPIRE_E2E_CLI_ARCHIVE_DIR: ${{ github.workspace }}/cli-archives
      GITHUB_PR_NUMBER: "21222"
      GITHUB_PR_HEAD_SHA: "5460e184ecce3206b0c482a1c6718f0c849c07cc"
    steps:
      - name: Record host kernel
        run: uname -r

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use the same CLI, packages, and test image as the failing PR, not the latest daily build.
      - name: Download CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 39498367820
          name: cli-native-archives-linux-x64
          path: cli-archives

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 39498367820
          name: built-nugets
          path: packages

      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 39498367820
          name: built-nugets-for-linux-x64
          path: cli-archives

      - name: Stage shipping packages
        shell: bash
        run: |
          shopt -s failglob
          cp packages/Debug/Shipping/*.nupkg cli-archives/

      - name: Download test image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 39498367820
          name: cli-e2e-dotnet-image
          path: cli-e2e-image

      - name: Load test image
        run: eng/scripts/load-cli-e2e-images.sh --image-dir cli-e2e-image --require-dotnet true

      - name: Restore repository
        run: ./restore.sh

      - name: Run one deployment test
        shell: bash
        run: |
          set +e
          ./dotnet.sh test --project tests/Aspire.Cli.EndToEnd.Tests/Aspire.Cli.EndToEnd.Tests.csproj \
            --no-launch-profile -- \
            --filter-method 'Aspire.Cli.EndToEnd.Tests.KubernetesDeployWithMongoDBTests.DeployK8sWithMongoDB' \
            --filter-not-trait 'quarantined=true' \
            --filter-not-trait 'outerloop=true' \
            2>&1 | tee mongodb-test.log
          result=${PIPESTATUS[0]}
          set -e
          if ! grep -Eq 'total:[[:space:]]+1[[:space:]]*$' mongodb-test.log; then
            echo '::error::Expected exactly one MongoDB deployment test to execute.'
            exit 1
          fi
          exit "$result"

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mongodb-deployment-diagnostics
          path: |
            mongodb-test.log
            testresults/
          if-no-files-found: error
