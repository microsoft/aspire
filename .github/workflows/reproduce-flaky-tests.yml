    defaults:
      run:
        shell: pwsh
    steps:
      - name: Configure NuGet package cache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Write-Output "NUGET_PACKAGES=${{ github.workspace }}/.nuget/packages" >> $env:GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Start resource monitor (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: ./eng/scripts/ci-resource-monitor.ps1 -Mode Start -OutputDirectory "${{ github.workspace }}/extension/.test-results/resource-monitor"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.5
      - name: Install Corepack
        working-directory: extension
        run: |
          # Scope Corepack's cache to this job so prepareCorepackYarn.mjs cannot
          # collide with any other build sharing the runner's user profile.
          # Cannot be set at job-level env: the `runner` context is unavailable
          # in job env evaluation, so we forward it through $GITHUB_ENV instead.
          $CorepackHome = Join-Path $env:RUNNER_TEMP 'corepack'
          $env:COREPACK_HOME = $CorepackHome
          "COREPACK_HOME=$CorepackHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $CorepackVersion = (Get-Content -Raw -Path 'scripts/corepack-version.txt').Trim()
          # The hosted Windows image already has a yarn shim in npm's global
          # prefix. The npm Corepack package owns that shim too, so force only
          # in CI where the tool install is isolated to this ephemeral job.
          npm install --global --force --registry "$env:NPM_REGISTRY" "corepack@$CorepackVersion"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $npmGlobalBin = (npm prefix --global).Trim()
          $env:PATH = "$npmGlobalBin$([IO.Path]::PathSeparator)$env:PATH"
          $npmGlobalBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $installed = (corepack --version).Trim()
          if ($installed -ne $CorepackVersion) {
            Write-Error "corepack version mismatch: expected $CorepackVersion, got '$installed'. The bundled Corepack on PATH may be taking precedence over the npm-global install."
            exit 1
          }

          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Seed Corepack's cache from the internal dnceng npm feed. Corepack's
          # built-in prepare path can bypass the configured internal feed, so use
          # the shared cache seeding script before any `corepack yarn` invocation.
          node ./scripts/prepareCorepackYarn.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          corepack yarn --version
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Setup Deno
        if: ${{ matrix.installdeno }}
        uses: ./.github/actions/setup-deno
      - name: Download VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: aspire-extension-${{ matrix.variant }}
          path: extension/out
      - name: Download CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cli-native-archives-${{ matrix.rid }}
          path: artifacts/cli-archive
          run-id: 45293035199
          github-token: ${{ github.token }}
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: built-nugets
          path: artifacts/nugets
          run-id: 45293035199
          github-token: ${{ github.token }}
      - name: Download RID-specific NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: built-nugets-for-${{ matrix.rid }}
          path: artifacts/nugets-rid
          run-id: 45293035199
          github-token: ${{ github.token }}
      - name: Validate lockfile registries
        working-directory: extension
        run: node scripts/validate-lockfile-registry.cjs
      - name: Install extension dependencies
        working-directory: extension
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            corepack yarn install --frozen-lockfile --non-interactive
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            $exitCode = $LASTEXITCODE
            if ($attempt -eq 3) {
              Write-Error "corepack yarn install failed after $attempt attempts."
              exit $exitCode
            }

            $delay = $attempt * 30
            Write-Host "corepack yarn install failed with exit code $exitCode. Retrying in ${delay}s (attempt $($attempt + 1) of 3)."
            Start-Sleep -Seconds $delay
          }
      - name: .NET debugger E2E prerequisites
        if: ${{ matrix.installdotnetdebugger || matrix.installazurefunctions || matrix.installresourcedebug }}
        run: |
          function Get-PinnedArtifact {
            param(
              [Parameter(Mandatory = $true)]
              [string] $Uri,
              [Parameter(Mandatory = $true)]
              [string] $OutFile,
              [Parameter(Mandatory = $true)]
              [string] $ExpectedSha256
            )

            Invoke-WebRequest -Uri $Uri -OutFile $OutFile -MaximumRetryCount 3 -RetryIntervalSec 5
            $actualSha256 = (Get-FileHash -Path $OutFile -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $ExpectedSha256) {
              throw "Checksum verification failed for '$OutFile'. Expected '$ExpectedSha256', got '$actualSha256'."
            }
          }

          $dotnetRuntimeVsix = Join-Path $env:RUNNER_TEMP 'vscode-dotnet-runtime-3.1.0.vsix'
          Get-PinnedArtifact `
            -Uri 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-dotnettools/vsextensions/vscode-dotnet-runtime/3.1.0/vspackage' `
            -OutFile $dotnetRuntimeVsix `
            -ExpectedSha256 '8e675ffe5f3674430d63e28d2dc05ab40f36c8494e9549e79d3995d721b13f5a'

          switch ($env:RUNNER_OS) {
            'Linux' {
              $csharpVsix = Join-Path $env:RUNNER_TEMP 'vscode-csharp-2.148.23-linux-x64.vsix'
              $csharpUri = 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-dotnettools/vsextensions/csharp/2.148.23/vspackage?targetPlatform=linux-x64'
              $csharpSha256 = '18b503e614a979212762683b35a4fa1806688ba773d5fe93bf62c9f9346db23f'
            }
            'Windows' {
              $csharpVsix = Join-Path $env:RUNNER_TEMP 'vscode-csharp-2.148.23-win32-x64.vsix'
              $csharpUri = 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-dotnettools/vsextensions/csharp/2.148.23/vspackage?targetPlatform=win32-x64'
              $csharpSha256 = '27cf5f0fdcd677f7af61a6d43f2dc75bac7ca2cffa1f29e3262b615bbcabb952'
            }
            default {
              throw "The .NET debugger E2E prerequisites do not support runner OS '$env:RUNNER_OS'."
            }
          }

          Get-PinnedArtifact -Uri $csharpUri -OutFile $csharpVsix -ExpectedSha256 $csharpSha256
          @(
            "ASPIRE_EXTENSION_E2E_DOTNET_RUNTIME_VSIX=$dotnetRuntimeVsix"
            "ASPIRE_EXTENSION_E2E_CSHARP_VSIX=$csharpVsix"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if ('${{ matrix.installresourcedebug }}' -eq 'true') {
            $goVsix = Join-Path $env:RUNNER_TEMP 'vscode-go-0.56.0.vsix'
            Get-PinnedArtifact `
              -Uri 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/golang/vsextensions/Go/0.56.0/vspackage' `
              -OutFile $goVsix `
              -ExpectedSha256 '9f5959fb17ba0a8dbd804387ddda50975fcaa9dd5267aa33eaaa89912072aacb'
            "ASPIRE_EXTENSION_E2E_GO_VSIX=$goVsix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Azure Functions E2E prerequisites
        if: ${{ matrix.installazurefunctions || matrix.installazurefunctionscoretools }}
        shell: bash
        run: |
          set -euo pipefail

          core_tools_version='4.12.1'
          core_tools_directory="$RUNNER_TEMP/azure-functions-core-tools"
          core_tools_archive="$RUNNER_TEMP/Azure.Functions.Cli.linux-x64.${core_tools_version}.zip"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$core_tools_archive" \
            "https://github.com/Azure/azure-functions-core-tools/releases/download/${core_tools_version}/Azure.Functions.Cli.linux-x64.${core_tools_version}.zip"
          echo 'faf8fb8d50b5293df338bec70594b12f45730e9fe251805298859b2238cf627e  '"$core_tools_archive" | sha256sum --check -
          mkdir -p "$core_tools_directory"
          unzip -q "$core_tools_archive" -d "$core_tools_directory"
          chmod +x "$core_tools_directory/func"
          echo "$core_tools_directory" >> "$GITHUB_PATH"
          export PATH="$core_tools_directory:$PATH"
          func --version

          {
            echo 'ASPIRE_EXTENSION_E2E_ENABLE_AZURE_FUNCTIONS=true'
            echo 'FUNCTIONS_CORE_TOOLS_TELEMETRY_OPTOUT=1'
          } >> "$GITHUB_ENV"

          if [ '${{ matrix.installazurefunctions }}' = 'true' ]; then
            azure_resource_groups_vsix="$RUNNER_TEMP/vscode-azureresourcegroups-0.12.7.vsix"
            curl --fail --location --compressed --retry 3 --retry-all-errors \
              --output "$azure_resource_groups_vsix" \
              'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-azuretools/vsextensions/vscode-azureresourcegroups/0.12.7/vspackage'
            echo 'e4a2e7ab012de3777e1ac1781e2c25d65f150ad6f3770e8cfcc5a3d3658df35a  '"$azure_resource_groups_vsix" | sha256sum --check -

            azure_functions_vsix="$RUNNER_TEMP/vscode-azurefunctions-1.22.0.vsix"
            curl --fail --location --compressed --retry 3 --retry-all-errors \
              --output "$azure_functions_vsix" \
              'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-azuretools/vsextensions/vscode-azurefunctions/1.22.0/vspackage'
            echo '146aede06f941b07a55c5aebd28c5e3df684d57b07cf6f9ebf90d7bb8ecd41a2  '"$azure_functions_vsix" | sha256sum --check -

            {
              echo 'ASPIRE_EXTENSION_E2E_INSTALL_AZURE_FUNCTIONS_VSIX=true'
              echo "ASPIRE_EXTENSION_E2E_AZURE_RESOURCE_GROUPS_VSIX=$azure_resource_groups_vsix"
              echo "ASPIRE_EXTENSION_E2E_AZURE_FUNCTIONS_VSIX=$azure_functions_vsix"
            } >> "$GITHUB_ENV"
          fi
      - name: Install resource debug E2E prerequisites
        if: ${{ matrix.installresourcedebug }}
        run: |
          # Ubuntu's Yama default allows ptrace only when the debugger is an ancestor of the target.
          # DCP launches the Go resource independently from Delve, so packaged attach needs this test-only policy.
          if ($env:RUNNER_OS -eq 'Linux') {
            sudo sysctl --write kernel.yama.ptrace_scope=0
            if ($LASTEXITCODE -ne 0 -or (Get-Content /proc/sys/kernel/yama/ptrace_scope).Trim() -ne '0') {
              throw 'Could not enable ptrace for Go resource attachment.'
            }
          }

          $debuggerBin = Join-Path $env:RUNNER_TEMP 'resource-debug-bin'
          New-Item -ItemType Directory -Path $debuggerBin -Force | Out-Null
          $env:GOBIN = $debuggerBin
          # Generated Go AppHosts require Go 1.26. Keep the CLI and Go extension on the same
          # toolchain, and use Delve with Go 1.26 support instead of disabling its version check.
          # https://github.com/go-delve/delve/blob/v1.27.2/pkg/goversion/compat.go
          $env:GOTOOLCHAIN = 'go1.26.10'
          go version
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not provision Go 1.26.10 for AppHost debugging.'
          }
          "GOTOOLCHAIN=$env:GOTOOLCHAIN" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          go install github.com/go-delve/delve/cmd/dlv@v1.27.2
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not install Delve for resource debugging.'
          }
          $debuggerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$debuggerBin$([IO.Path]::PathSeparator)$env:PATH"
          dlv version
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not run Delve for resource debugging.'
          }

          'ASPIRE_EXTENSION_E2E_ENABLE_RESOURCE_DEBUG=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install WinUI E2E debugger prerequisites
        if: ${{ matrix.installwinui }}
        shell: bash
        run: |
          set -euo pipefail

          # The known failure reproduces with the standalone C# debugger; C# Dev Kit is not
          # involved. Pin the exact debugger version so an upstream update cannot hide an
          # Aspire regression, and install its runtime dependency for the offline E2E host.
          # Raw Marketplace VSIX URLs are not Dependabot-managed. Rebaseline these pins
          # manually only when host compatibility requires it or the fixture is deliberately
          # moved; before changing C#, verify that the old TargetPath launch still reproduces
          # https://github.com/microsoft/aspire/issues/19091 and the RunCommand launch passes.
          dotnet_runtime_vsix="$RUNNER_TEMP/vscode-dotnet-runtime-3.1.0.vsix"
          curl --fail --location --compressed --retry 3 --retry-all-errors \
            --output "$dotnet_runtime_vsix" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-dotnettools/vsextensions/vscode-dotnet-runtime/3.1.0/vspackage'
          echo '8e675ffe5f3674430d63e28d2dc05ab40f36c8494e9549e79d3995d721b13f5a  '"$dotnet_runtime_vsix" | sha256sum --check -

          csharp_vsix="$RUNNER_TEMP/vscode-csharp-2.140.9-win32-x64.vsix"
          curl --fail --location --compressed --retry 3 --retry-all-errors \
            --output "$csharp_vsix" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-dotnettools/vsextensions/csharp/2.140.9/vspackage?targetPlatform=win32-x64'
          echo 'ed7a3ca7775b0afa0c7c8e51e203eba0ca5e7366969509a3bbdd707888b8536a  '"$csharp_vsix" | sha256sum --check -

          {
            echo 'ASPIRE_EXTENSION_E2E_ENABLE_WINUI=true'
            echo "ASPIRE_EXTENSION_E2E_DOTNET_RUNTIME_VSIX=$dotnet_runtime_vsix"
            echo "ASPIRE_EXTENSION_E2E_CSHARP_VSIX=$csharp_vsix"
          } >> "$GITHUB_ENV"
      - name: Set up the JDK for the Java E2E specs
        if: ${{ matrix.installjava }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache Java dependencies for the Java E2E specs
        if: ${{ matrix.installjava }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: java-e2e-${{ runner.os }}-${{ hashFiles('playground/JavaSpringBoot/**/pom.xml', 'playground/JavaSpringBoot/**/build.gradle*', 'playground/JavaSpringBoot/**/gradle-wrapper.properties', 'playground/JavaSpringBoot/**/maven-wrapper.properties', 'src/Aspire.Cli/Templating/Templates/java-starter/api/build.gradle', 'src/Aspire.Cli/Templating/Templates/java-starter/api/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            java-e2e-${{ runner.os }}-
      - name: Warm the Java dependency caches
        if: ${{ matrix.installjava }}
        shell: bash
        run: |
          set -euo pipefail

          # Resolving dependencies here rather than inside the specs keeps a cold cache from being
          # charged against the in-test wait for a resource endpoint, which is what made these shards
          # time out on cache misses. The AppHost project is deliberately excluded: it compiles against
          # the Aspire Java SDK that the CLI generates later, during the E2E run itself.
          #
          # A resolution failure must not fail the job - it only means the specs pay the download cost
          # they paid before this step existed.
          #
          # Retry before giving up, though. Both wrappers fetch their own distribution on a cold cache,
          # and a failure there is not merely a slower run: it leaves no Maven on the runner at all, so
          # the build inside the spec exits 1, the resource never starts, and the shard fails 15 minutes
          # later as "Timed out after 900000ms waiting for an HTTP endpoint for resource 'catalog'"
          # rather than as the download error it actually is.
          warm() {
            local description=$1
            local directory=$2
            shift 2

            local attempt
            for attempt in 1 2 3; do
              if ( cd "$directory" && "$@" ); then
                return 0
              fi

              if [ "$attempt" -lt 3 ]; then
                echo "warning: pre-resolving $description failed (attempt $attempt/3), retrying"
                sleep $((attempt * 15))
              fi
            done

            echo "warning: could not pre-resolve $description"
          }

          cd playground/JavaSpringBoot
          for maven_project in catalog worker; do
            # `dependency:go-offline` resolves the dependency tree but not every plugin a real build
            # runs, so compiling here is what actually leaves `~/.m2` - the directory this job caches -
            # holding the compiler, resources and Spring Boot plugins. The build output itself is
            # deliberately not reused: the specs copy the playground without `target/` so each run
            # builds clean, which is the same reason the Gradle project below is compiled rather than
            # only resolved.
            warm "Maven dependencies for $maven_project" "$maven_project" \
              ./mvnw --batch-mode --no-transfer-progress -q dependency:go-offline compile
          done
          warm "Gradle dependencies for orders" orders \
            ./gradlew --no-daemon --quiet compileJava
      - name: Install Java E2E prerequisites
        if: ${{ matrix.installjava }}
        shell: bash
        run: |
          set -euo pipefail

          # The E2E VS Code instance runs offline, and the extension only advertises the `java`
          # capability - which is what makes the CLI hand a Java AppHost back to the extension to
          # launch and debug, instead of spawning `java` itself - when redhat.java and
          # vscjava.vscode-java-debug are both installed. vscode-java-dependency is a hard activation
          # dependency of the debug extension. Versions and digests are pinned so a marketplace
          # release cannot change what these shards are testing.
          #
          # redhat.java also publishes platform-specific builds that embed a JRE; the universal build
          # is a third of the size and runs on the JDK installed above.
          java_language_vsix="$RUNNER_TEMP/redhat-java-1.55.0.vsix"
          curl --fail --location --compressed --retry 3 --retry-all-errors \
            --output "$java_language_vsix" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/redhat/vsextensions/java/1.55.0/vspackage'
          echo '011639c3ee347b9591895bfc77d8cf28f836c053d0a49ae4a83efe9dc473a603  '"$java_language_vsix" | sha256sum --check -

          java_debug_vsix="$RUNNER_TEMP/vscjava-vscode-java-debug-0.59.0.vsix"
          curl --fail --location --compressed --retry 3 --retry-all-errors \
            --output "$java_debug_vsix" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/vscjava/vsextensions/vscode-java-debug/0.59.0/vspackage'
          echo 'e5973fcd763a984ea4d6e57644ccf8f5fe6caa80c0e589f29403f00c9ace3920  '"$java_debug_vsix" | sha256sum --check -

          java_dependency_vsix="$RUNNER_TEMP/vscjava-vscode-java-dependency-0.27.6.vsix"
          curl --fail --location --compressed --retry 3 --retry-all-errors \
            --output "$java_dependency_vsix" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/vscjava/vsextensions/vscode-java-dependency/0.27.6/vspackage'
          echo 'e4e7c8b90953e62c8ebcedaaafb88b3c42ddec3fcc9e37f268ac3203427d9fa0  '"$java_dependency_vsix" | sha256sum --check -

          {
            echo "ASPIRE_EXTENSION_E2E_JAVA_VSIX=$java_language_vsix:$java_debug_vsix:$java_dependency_vsix"
          } >> "$GITHUB_ENV"

          java -version
      - name: Prepare Aspire CLI and package hive
        id: prepare_cli
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $archive = Get-ChildItem -Path '${{ github.workspace }}/artifacts/cli-archive' -Recurse -File -Filter '${{ matrix.archivepattern }}' | Select-Object -First 1
          if ($null -eq $archive) {
            Get-ChildItem -Path '${{ github.workspace }}/artifacts/cli-archive' -Recurse -File | Format-Table -AutoSize
            throw "Unable to find CLI archive matching ${{ matrix.archivepattern }}."
          }

          $bundleDir = Join-Path '${{ github.workspace }}' 'artifacts/bundle/${{ matrix.rid }}'
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          if ('${{ runner.os }}' -eq 'Windows') {
            Expand-Archive -Path $archive.FullName -DestinationPath $bundleDir -Force
          } else {
            tar -xzf $archive.FullName -C $bundleDir
          }

          $cli = Get-ChildItem -Path $bundleDir -Recurse -File -Filter '${{ matrix.clibinary }}' | Select-Object -First 1
          if ($null -eq $cli) {
            Get-ChildItem -Path $bundleDir -Recurse -File | Format-Table -AutoSize
            throw "Unable to find ${{ matrix.clibinary }} in extracted CLI archive."
          }

          if ('${{ runner.os }}' -ne 'Windows') {
            chmod +x $cli.FullName
          }

          & $cli.FullName setup
          # pwsh does not stop on a native command's exit code, so an unchecked failure here left the
          # shard running without the orchestration component and failing minutes later with a debug
          # startup timeout instead of the real reason - "The Aspire orchestration component is not
          # installed at ~/.nuget/packages/microsoft.developercontrolplane.<rid>/<version>/tools/dcp".
          if ($LASTEXITCODE -ne 0) { throw "aspire setup failed with exit code $LASTEXITCODE." }

          # A zero exit code only means setup ran, not that it produced an orchestration component. The
          # shards resolve DCP from this bundle rather than from ~/.nuget/packages, because a
          # guest-language AppHost never restores the Microsoft.DeveloperControlPlane.<rid> package.
          # Assert it is really here so a missing DCP fails on this line, naming the component, instead
          # of surfacing minutes later as an unexplained debug startup timeout.
          #
          # `aspire setup` extracts to SetupCommand.GetDefaultInstallPath(processPath), which is the
          # *parent of the parent* of the CLI binary - not the directory the archive was unpacked into.
          # With the CLI at artifacts/bundle/<rid>/aspire that install path is artifacts/bundle, so DCP
          # lands beside $bundleDir rather than inside it. Derive the same path the CLI derives instead
          # of assuming a layout, otherwise this assertion fails on every shard even when setup worked.
          $cliDir = Split-Path -Path $cli.FullName -Parent
          $installPath = Split-Path -Path $cliDir -Parent
          $dcpExecutable = if ('${{ runner.os }}' -eq 'Windows') { 'dcp.exe' } else { 'dcp' }
          $dcp = Get-ChildItem -Path $installPath -Recurse -File -Filter $dcpExecutable -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $dcp) {
            Get-ChildItem -Path $installPath -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "'aspire setup' succeeded but no $dcpExecutable exists under $installPath, so every AppHost in this shard would fail to orchestrate."
          }
          Write-Host "Orchestration component: $($dcp.FullName)"
          "ASPIRE_DCP_PATH=$($dcp.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $shippingDir = Join-Path '${{ github.workspace }}' 'artifacts/nugets/Debug/Shipping'
          if (-not (Test-Path $shippingDir)) {
            $shippingDir = Join-Path '${{ github.workspace }}' 'artifacts/nugets'
          }

          $samplePackage = Get-ChildItem -Path $shippingDir -Recurse -File -Filter 'Aspire.Hosting.AppHost.*.nupkg' | Select-Object -First 1
          if ($null -eq $samplePackage) {
            throw "Unable to find Aspire.Hosting.AppHost.*.nupkg under $shippingDir."
          }

          $hiveLabel = $null
          if ($samplePackage.Name -match '-pr\.([0-9]+)\.') {
            $hiveLabel = "pr-$($Matches[1])"
          } elseif ('${{ startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/internal/release/') }}' -eq 'true') {
            $hiveLabel = 'staging'
          } else {
            $hiveLabel = 'daily'
          }

          $hiveDir = Join-Path $HOME ".aspire/hives/$hiveLabel/packages"
          New-Item -ItemType Directory -Path $hiveDir -Force | Out-Null
          Get-ChildItem -Path $shippingDir -Recurse -File -Filter '*.nupkg' | Copy-Item -Destination $hiveDir -Force
          $ridNugets = Join-Path '${{ github.workspace }}' 'artifacts/nugets-rid'
          if (Test-Path $ridNugets) {
            Get-ChildItem -Path $ridNugets -Recurse -File -Filter '*.nupkg' | Copy-Item -Destination $hiveDir -Force
          }

          "ASPIRE_CLI_PACKAGES=$hiveDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASPIRE_EXTENSION_E2E_CLI_PATH=$($cli.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASPIRE_EXTENSION_E2E_APPHOST_SDK_VERSION=$(($samplePackage.Name -replace '^Aspire\.Hosting\.AppHost\.', '') -replace '\.nupkg$', '')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $cli.FullName --version
      - name: Compile extension E2E tests
        working-directory: extension
        run: |
          corepack yarn compile
          corepack yarn compile-e2e
          # run-e2e.js validates compiled spec matches, including brace globs that
          # PowerShell Test-Path does not expand.

          node -e "const fs=require('fs'); const file='.mocharc.e2e.js'; fs.appendFileSync(file, '\nmodule.exports.grep = /attaches to a Go resource launched with Run Without Debugging, hits a breakpoint, and detaches/;\n');"
      - name: Install Deno
        if: ${{ matrix.installdeno }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = if ('${{ runner.os }}' -eq 'Windows') {
            'x86_64-pc-windows-msvc'
          } else {
            'x86_64-unknown-linux-gnu'
          }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'deno'
          $archivePath = Join-Path $env:RUNNER_TEMP "deno-$target.zip"
          New-Item -ItemType Directory -Path $installDirectory -Force | Out-Null
          Invoke-WebRequest "https://github.com/denoland/deno/releases/download/v2.9.0/deno-$target.zip" -OutFile $archivePath
          Expand-Archive -Path $archivePath -DestinationPath $installDirectory -Force
          if ('${{ runner.os }}' -ne 'Windows') {
            chmod +x (Join-Path $installDirectory 'deno')
          }
          $installDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $installDirectory '${{ runner.os == 'Windows' && 'deno.exe' || 'deno' }}') --version
      - name: Install E2E recorder
        if: ${{ matrix.usexvfb }}
        run: |
          # ffmpeg only powers the diagnostic screen recordings, and run-e2e.js already skips
          # recording with a warning when the binary is missing. So this step must never be able to
          # fail or stall a shard: it is strictly a nice-to-have for debugging flakes after the fact.
          #
          # It used to call apt-get unguarded, which talks to the Azure Ubuntu mirrors. That is a
          # network dependency with no timeout, and a degraded mirror has hung this step past the
          # job timeout - taking down shards (including ones with no Java or recording relevance)
          # that were otherwise healthy. Bound every call and give up quietly instead.
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            ffmpeg -version | Select-Object -First 1
          }
          else {
            $installed = $false
            $attempts = 2

            for ($attempt = 1; $attempt -le $attempts; $attempt++) {
              # `timeout` (coreutils) bounds a stalled child and exits 124, which is what converts an
              # unresponsive mirror into a retryable failure rather than an open-ended wait.
              # `--kill-after` matters: plain `timeout` only sends SIGTERM, and apt/dpkg block or
              # defer signals around critical sections, so without the escalation to SIGKILL a
              # wedged child could still outlive its own timeout.
              sudo timeout --kill-after=30 180 apt-get update

              # Only the install decides success: `apt-get update` can time out while the install
              # still succeeds from the indices already on the runner image.
              sudo timeout --kill-after=30 180 apt-get install -y --no-install-recommends ffmpeg
              if ($LASTEXITCODE -eq 0) {
                $installed = $true
                break
              }

              if ($attempt -lt $attempts) {
                Write-Host "::warning::Attempt $attempt to install ffmpeg failed; retrying."
                Start-Sleep -Seconds 15
              }
            }

            if (-not $installed) {
              Write-Host '::warning::ffmpeg could not be installed; E2E screen recordings are disabled for this shard.'
            }
          }

          # GitHub's pwsh wrapper appends `if ((Test-Path variable:/LASTEXITCODE)) { exit $LASTEXITCODE }`,
          # so a failed apt-get would otherwise fail this step through the leftover exit code and take
          # the shard down over a missing diagnostic recorder. Exit explicitly to hold the
          # "this step must never fail the job" contract.
          # https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax#exit-codes-and-error-action-preference
          exit 0
      - name: Pin container runtime to Docker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"ASPIRE_CONTAINER_RUNTIME=docker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Run extension E2E tests
        working-directory: extension
        env:
          ASPIRE_EXTENSION_E2E_VSIX: ${{ github.workspace }}/extension/out/aspire-extension.vsix
          ASPIRE_EXTENSION_E2E_SHARD: ${{ matrix.shardname }}
          ASPIRE_EXTENSION_E2E_SPEC: ${{ matrix.spec }}
          ASPIRE_EXTENSION_E2E_BROWSER: ${{ matrix.browser }}
          ASPIRE_EXTENSION_E2E_ADVISORY_ISSUE: ${{ matrix.advisoryissue }}
          ASPIRE_EXTENSION_E2E_UNSET_CLI_START_TIMEOUT: ${{ matrix.unsetclistarttimeout }}
          ASPIRE_EXTENSION_E2E_RECORDING_MODE: ${{ matrix.usexvfb && 'always' || 'off' }}
        run: |

          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $records = @()
          New-Item -ItemType Directory -Path '.test-results/trials' -Force | Out-Null
          for ($iteration = 1; $iteration -le 5; $iteration++) {
            # MSBuild can retain task DLLs after an iteration. A unique shard gives each
            # trial its own package cache, avoiding attempts to delete a loaded Windows DLL.
            $shard = "resource-debug-tools-trial-$iteration"
            $env:ASPIRE_EXTENSION_E2E_SHARD = $shard
            $log = ".test-results/trials/iteration-$iteration.log"
            if ('${{ matrix.usexvfb }}' -eq 'true') {
              xvfb-run -a node scripts/run-e2e.js *>&1 | Tee-Object -FilePath $log
            } else {
              node scripts/run-e2e.js *>&1 | Tee-Object -FilePath $log
            }
            $exitCode = $LASTEXITCODE
            $mochaFile = ".test-results/e2e/$shard/mocha.json"
            $executed = 0
            $failures = $null
            if (Test-Path $mochaFile) {
              $mocha = Get-Content -Raw $mochaFile | ConvertFrom-Json
              $executed = $mocha.stats.tests
              $failures = $mocha.stats.failures
              Move-Item ".test-results/e2e/$shard" ".test-results/trials/iteration-$iteration" -Force
            }
            $records += [pscustomobject]@{ iteration=$iteration; exitCode=$exitCode; executed=$executed; failures=$failures }
            $records | ConvertTo-Json -Depth 10 | Set-Content '.test-results/trials/results.json'
          }
          if (@($records | Where-Object { $_.exitCode -ne 0 -or $_.executed -ne 1 -or $_.failures -ne 0 }).Count -gt 0) {
            throw 'At least one Go attach trial failed or did not execute exactly one test. Inspect results.json and per-iteration artifacts.'
          }
      - name: Stop resource monitor (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        continue-on-error: true
        shell: pwsh
        run: ./eng/scripts/ci-resource-monitor.ps1 -Mode Stop -OutputDirectory "${{ github.workspace }}/extension/.test-results/resource-monitor"
      - name: Upload E2E diagnostics
        id: upload_e2e_diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-attach-${{ matrix.rid }}-${{ matrix.variant }}-${{ matrix.index }}
          path: |
            extension/.test-results/**
            extension/.test-storage/**
            extension/.test-workspaces/**
            extension/.test-recordings/**
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Print E2E diagnostics links
        if: always()
        working-directory: extension
        run: |
          $artifactName = "go-attach-${{ matrix.rid }}-${{ matrix.variant }}-${{ matrix.index }}"
          $artifactUrl = "${{ steps.upload_e2e_diagnostics.outputs.artifact-url }}"
          $uploadOutcome = "${{ steps.upload_e2e_diagnostics.outcome }}"
          if ([string]::IsNullOrWhiteSpace($artifactUrl)) {
            $artifactUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
          }
          $hasResults = Test-Path ".test-results"
          $hasStorage = Test-Path ".test-storage"
          $recordings = Get-ChildItem -Path ".test-recordings" -Recurse -File -Filter "*.mp4" -ErrorAction SilentlyContinue
          $recordingLogs = Get-ChildItem -Path ".test-recordings" -Recurse -File -Filter "*.ffmpeg.log" -ErrorAction SilentlyContinue
          $screenshots = Get-ChildItem -Path ".test-storage" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "[/\\]screenshots[/\\]" }

          Write-Host "Extension E2E diagnostics artifact: $artifactName"
          Write-Host "Diagnostics upload outcome: $uploadOutcome"
          if ($uploadOutcome -ne 'success') {
            Write-Warning "Diagnostics upload did not complete successfully. Keeping the shard result based on the test step."
          }
          Write-Host "Artifacts page: $artifactUrl"
          if ($hasResults) {
            Write-Host "Mocha/state files are under .test-results inside the artifact."
          }
          if ($hasStorage) {
            Write-Host "VS Code logs and Aspire home diagnostics are under .test-storage inside the artifact."
          }
          if ($screenshots) {
            Write-Host "Failure screenshots:"
            $screenshots | ForEach-Object { Write-Host "  $($_.FullName.Replace((Get-Location).Path + [IO.Path]::DirectorySeparatorChar, ''))" }
          } else {
            Write-Host "No failure screenshots were found for this shard."
          }
          if ($recordings) {
            Write-Host "E2E recordings:"
            $recordings | ForEach-Object { Write-Host "  $($_.FullName.Replace((Get-Location).Path + [IO.Path]::DirectorySeparatorChar, ''))" }
          } else {
            Write-Host "No E2E recordings were kept for this shard. Linux CI keeps recordings by default; Windows shards upload screenshots and logs only."
          }
          if ($recordingLogs) {
            Write-Host "Recorder logs:"
            $recordingLogs | ForEach-Object { Write-Host "  $($_.FullName.Replace((Get-Location).Path + [IO.Path]::DirectorySeparatorChar, ''))" }
          }
