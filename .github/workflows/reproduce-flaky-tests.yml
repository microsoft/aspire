# Reproduces flaky tests by running them repeatedly across multiple OS runners.
#
# HOW TO USE:
# 1. Edit the CONFIGURATION section below with the test you want to reproduce
# 2. Push to your branch
# 3. Trigger: gh workflow run reproduce-flaky-tests.yml --repo microsoft/aspire --ref <your-branch>
# 4. Check the results across OSes and runners
#
# The configuration is designed to be edited by agents (Copilot, etc.)
# who modify the env vars below and push to trigger a run.
# Optional dispatch inputs and receipts: docs/ci/reproduce-flaky-tests.md

name: Reproduce Flaky Tests

on:
  workflow_dispatch:
    inputs:
      test_project:
        description: Test project shortname (empty uses TEST_PROJECT below)
        type: string
      test_method:
        description: Exact fully qualified method (no wildcards)
        type: string
      mode:
        description: single-test or quarantine-project (empty uses method or manual filter)
        type: string
      os:
        description: Comma-separated ubuntu-latest, windows-latest, macos-latest
        type: string
      repetitions:
        description: Iterations per runner (1-50; empty uses configuration below)
        type: string
      runner_count:
        description: Runners per OS (1-10; empty uses configuration below)
        type: string
      candidate_commit:
        description: Exact 40-character candidate SHA in this repository (empty uses dispatch ref)
        type: string
      correlation_id:
        description: Optional caller correlation ID (1-100 safe characters)
        type: string

permissions:
  contents: read

# ============================================================
# CONFIGURATION — Edit these values to customize the test run
# ============================================================
env:
  # Test project shortname (maps to tests/Aspire.{name}.Tests/ or tests/{name}.Tests/)
  # Examples: Hosting, Core, Dashboard, Components.Common, Cli.EndToEnd
  TEST_PROJECT: "Hosting"

  # Test filter arguments passed to dotnet test (after the -- separator).
  # Use quotes around wildcard patterns to prevent shell glob expansion.
  # Examples:
  #   --filter-method "*.TestMethodName"
  #   --filter-class "*.TestClassName"
  #   --filter-method "*.Test1" --filter-method "*.Test2"
  TEST_FILTER: '--filter-method "*.YourTestMethodName"'

  # Target operating systems (comma-separated)
  # Options: ubuntu-latest, windows-latest, macos-latest
  TARGET_OSES: "ubuntu-latest,windows-latest"

  # Number of parallel runners per OS
  # Total jobs = RUNNERS_PER_OS × number of OSes (must be ≤ 256)
  RUNNERS_PER_OS: "3"

  # Number of test iterations each runner executes
  ITERATIONS_PER_RUNNER: "3"

jobs:

  setup:
    name: Generate matrix
    if: ${{ github.repository == 'microsoft/aspire' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.configure.outputs.matrix }}
      is_cli_e2e: ${{ steps.configure.outputs.is_cli_e2e }}
      config: ${{ steps.configure.outputs.config }}
      candidate_commit: ${{ steps.configure.outputs.candidate_commit }}
      test_project: ${{ steps.configure.outputs.test_project }}
      test_filter: ${{ steps.configure.outputs.test_filter }}
      repetitions: ${{ steps.configure.outputs.repetitions }}
    steps:
      - name: Checkout workflow configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate configuration and generate matrix
        id: configure
        shell: pwsh
        env:
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        run: ./eng/scripts/reproduction-worker.ps1 -Operation Configure

  build_cli_e2e_image:
    name: Build CLI E2E Docker image
    needs: setup
    if: ${{ github.repository == 'microsoft/aspire' && needs.setup.outputs.is_cli_e2e == 'true' }}
    uses: ./.github/workflows/build-cli-e2e-image.yml

  reproduce:
    name: "${{ matrix.os }} #${{ matrix.index }}"
    needs: [setup, build_cli_e2e_image]
    if: >-
      ${{
        github.repository == 'microsoft/aspire' &&
        !cancelled() &&
        needs.setup.result == 'success' &&
        (needs.build_cli_e2e_image.result == 'success' || needs.build_cli_e2e_image.result == 'skipped')
      }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet
      TEST_PROJECT: ${{ needs.setup.outputs.test_project }}
      TEST_FILTER: ${{ needs.setup.outputs.test_filter }}
      ITERATIONS_PER_RUNNER: ${{ needs.setup.outputs.repetitions }}
      WORKER_CONFIG: ${{ needs.setup.outputs.config }}
      WORKER_WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKER_WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKER_RUNNER_INDEX: ${{ matrix.index }}

    steps:
      - name: Setup vars (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "DOTNET_SCRIPT=./dotnet.sh" >> $GITHUB_ENV
          echo "BUILD_SCRIPT=./build.sh" >> $GITHUB_ENV
          echo "${{ github.workspace }}/.dotnet" >> $GITHUB_PATH

      - name: Setup vars (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "DOTNET_SCRIPT=.\dotnet.cmd" >> $env:GITHUB_ENV
          echo "BUILD_SCRIPT=.\build.cmd" >> $env:GITHUB_ENV
          echo "${{ github.workspace }}\.dotnet" >> $env:GITHUB_PATH

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.candidate_commit || github.sha }}
          persist-credentials: false

      # Keep receipt logic at the workflow revision, not at the candidate revision.
      - name: Checkout worker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .reproduction-worker
          persist-credentials: false
          sparse-checkout: eng/scripts/reproduction-worker.ps1
          sparse-checkout-cone-mode: false

      - name: Record workflow and source identities
        shell: pwsh
        run: ./.reproduction-worker/eng/scripts/reproduction-worker.ps1 -Operation Start

      - name: Trust HTTPS development certificate (Linux)
        if: runner.os == 'Linux'
        run: |
          EXIT_CODE=0
          ${{ env.DOTNET_SCRIPT }} dev-certs https --trust || EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 4 ]; then
            echo "dev-certs https --trust failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
        env:
          WSL_INTEROP: ""

      - name: Verify Docker is running (Linux)
        if: runner.os == 'Linux'
        run: docker info

      - name: Download prebuilt CLI E2E Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-e2e-dotnet-image
          path: ${{ github.workspace }}/cli-e2e-image

      - name: Download prebuilt CLI E2E Java Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-e2e-polyglot-java-image
          path: ${{ github.workspace }}/cli-e2e-image

      - name: Download prebuilt CLI E2E polyglot Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-e2e-polyglot-image
          path: ${{ github.workspace }}/cli-e2e-image

      - name: Load prebuilt CLI E2E Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          eng/scripts/load-cli-e2e-images.sh \
            --image-dir "${{ github.workspace }}/cli-e2e-image" \
            --require-dotnet true \
            --require-polyglot true \
            --require-java true

      - name: Unlock macOS keychain
        if: runner.os == 'macOS'
        uses: ./.github/actions/unlock-macos-keychain

      - name: Compute test project path
        shell: pwsh
        run: |
          $testShortName = "${{ env.TEST_PROJECT }}"
          $projectPath1 = "${{ github.workspace }}/tests/$testShortName.Tests/$testShortName.Tests.csproj"
          $projectPath2 = "${{ github.workspace }}/tests/Aspire.$testShortName.Tests/Aspire.$testShortName.Tests.csproj"

          if (Test-Path -Path $projectPath1) {
              $projectPath = $projectPath1
          } elseif (Test-Path -Path $projectPath2) {
              $projectPath = $projectPath2
          } else {
              Write-Error "No test project found for shortname '$testShortName'. Looked at: $projectPath1, $projectPath2"
              exit 1
          }

          echo "TEST_PROJECT_PATH=$projectPath" >> $env:GITHUB_ENV
          Write-Host "Resolved test project: $projectPath"

      - name: Build test project
        run: >
          ${{ env.BUILD_SCRIPT }}
          -restore -ci -build
          -projects ${{ env.TEST_PROJECT_PATH }}
          /p:InstallBrowsersForPlaywright=false
          /p:RunQuarantinedTests=true

      - name: Run test iterations (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          ASPIRE__TEST__DCPLOGBASEPATH: ${{ github.workspace }}/testresults/dcp
          NUGET_PACKAGES: ${{ github.workspace }}/.packages
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: 'netaspireci.azurecr.io'
          # Skip default quarantine/outerloop exclusion filters so the target test can run
          SkipDefaultTestFilters: true
        run: |
          PASS=0
          FAIL=0
          ITERATIONS=${{ env.ITERATIONS_PER_RUNNER }}

          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::Iteration $i/$ITERATIONS"

            # Cleanup between iterations
            rm -rf "${{ github.workspace }}/testresults" 2>/dev/null || true
            pgrep -lf "dcp" 2>/dev/null | grep -E "\bdcp(\.exe|ctl)?\b" | awk '{print $1}' | while read pid; do
              kill -9 "$pid" 2>/dev/null || true
            done
            sleep 1

            # Retain output and TRX even when the iteration passes.
            ITER_DIR="${{ github.workspace }}/all-results/iteration-$i"
            mkdir -p "$ITER_DIR"
            ITER_OUTPUT="$ITER_DIR/test-output.log"
            set +e  # Disable errexit so pipefail doesn't abort before PIPESTATUS capture
            ${{ env.DOTNET_SCRIPT }} test --project "${{ env.TEST_PROJECT_PATH }}" \
              --no-restore \
              --no-build \
              -- \
              --timeout 10m \
              --report-trx \
              --results-directory "${{ github.workspace }}/testresults" \
              ${{ env.TEST_FILTER }} \
              2>&1 | tee "$ITER_OUTPUT"
            RESULT=${PIPESTATUS[0]}
            set -e

            if [ -d "${{ github.workspace }}/testresults" ]; then
              cp -R "${{ github.workspace }}/testresults/." "$ITER_DIR/"
            fi
            RECEIPT_RESULT=0
            pwsh -NoProfile -File ./.reproduction-worker/eng/scripts/reproduction-worker.ps1 \
              -Operation Iteration -Iteration "$i" -ProcessExitCode "$RESULT" || RECEIPT_RESULT=$?

            if [ "$RECEIPT_RESULT" -eq 0 ]; then
              echo "✅ Iteration $i: PASS"
              PASS=$((PASS + 1))
            else
              echo "❌ Iteration $i: FAIL (exit $RESULT)"
              FAIL=$((FAIL + 1))
            fi

            echo "::endgroup::"
          done

          echo ""
          echo "========================================"
          echo "Summary for runner #${{ matrix.index }} on ${{ matrix.os }}"
          echo "  Passed: $PASS / $ITERATIONS"
          echo "  Failed: $FAIL / $ITERATIONS"
          echo "========================================"

          if [ "$FAIL" -gt 0 ]; then exit 1; fi

      - name: Run test iterations (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASPIRE__TEST__DCPLOGBASEPATH: ${{ github.workspace }}/testresults/dcp
          NUGET_PACKAGES: ${{ github.workspace }}/.packages
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: 'netaspireci.azurecr.io'
          # Skip default quarantine/outerloop exclusion filters so the target test can run
          SkipDefaultTestFilters: true
        run: |
          $pass = 0
          $fail = 0
          $iterations = [int]"${{ env.ITERATIONS_PER_RUNNER }}"

          for ($i = 1; $i -le $iterations; $i++) {
            Write-Host "::group::Iteration $i/$iterations"

            # Cleanup between iterations
            Remove-Item -Recurse -Force "${{ github.workspace }}/testresults" -ErrorAction SilentlyContinue
            Get-Process | Where-Object { $_.ProcessName -match '^dcp' } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1

            # Retain output and TRX even when the iteration passes.
            $iterDirectory = Join-Path "${{ github.workspace }}/all-results" "iteration-$i"
            New-Item -ItemType Directory -Path $iterDirectory -Force | Out-Null
            $iterOutput = Join-Path $iterDirectory 'test-output.log'
            & ${{ env.DOTNET_SCRIPT }} test --project "${{ env.TEST_PROJECT_PATH }}" `
              --no-restore `
              --no-build `
              -- `
              --timeout 10m `
              --report-trx `
              --results-directory "${{ github.workspace }}/testresults" `
              ${{ env.TEST_FILTER }} *> $iterOutput
            $result = $LASTEXITCODE
            Get-Content $iterOutput

            if (Test-Path "${{ github.workspace }}/testresults") {
              Copy-Item -Recurse "${{ github.workspace }}/testresults/*" $iterDirectory
            }
            & pwsh -NoProfile -File ./.reproduction-worker/eng/scripts/reproduction-worker.ps1 `
              -Operation Iteration -Iteration $i -ProcessExitCode $result
            $receiptResult = $LASTEXITCODE

            if ($receiptResult -eq 0) {
              Write-Host "✅ Iteration ${i}: PASS"
              $pass++
            } else {
              Write-Host "❌ Iteration ${i}: FAIL (exit $result)"
              $fail++
            }

            Write-Host "::endgroup::"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Summary for runner #${{ matrix.index }} on ${{ matrix.os }}"
          Write-Host "  Passed: $pass / $iterations"
          Write-Host "  Failed: $fail / $iterations"
          Write-Host "========================================"

          if ($fail -gt 0) { exit 1 }

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproduction-${{ matrix.os }}-${{ matrix.index }}
          path: all-results/
          if-no-files-found: error

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failures-${{ matrix.os }}-${{ matrix.index }}
          path: all-results/
          if-no-files-found: ignore

  results:
    if: ${{ always() && github.repository == 'microsoft/aspire' }}
    runs-on: ubuntu-latest
    name: Reproduce Results
    needs: [setup, reproduce]
    permissions: {}
    steps:
      - name: Summary
        shell: bash
        env:
          WORKER_CONFIG: ${{ needs.setup.outputs.config }}
          REPRODUCE_RESULT: ${{ needs.reproduce.result }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          echo "## Reproduce Flaky Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          printf 'Workflow SHA: `%s`\n\n' "$WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '```json\n%s\n```\n' "$WORKER_CONFIG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$REPRODUCE_RESULT" = "success" ]; then
            echo "### ✅ All iterations passed on all runners" >> $GITHUB_STEP_SUMMARY
          elif [ "$REPRODUCE_RESULT" = "failure" ]; then
            echo "### ❌ Some runners reported failures" >> $GITHUB_STEP_SUMMARY
            echo "Check individual job logs and reproduction artifacts for execution counts and failures." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Reproduce job was $REPRODUCE_RESULT" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if reproduce did not succeed
        if: ${{ needs.reproduce.result != 'success' }}
        run: exit 1
