# Temporary investigation workflow for microsoft/aspire#20122.
# This branch must not be merged with these workflow changes.

name: Reproduce Flaky Tests

on:
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

env:
  EXTENSION_E2E_SHARD: dynamic-debug-configuration
  EXTENSION_E2E_SPEC: out/test-e2e/test-e2e/dynamicDebugConfiguration.e2e.test.js
  RUNNERS: "3"
  ITERATIONS_PER_RUNNER: "3"

jobs:

  build_packages:
    name: Build packages
    uses: ./.github/workflows/build-packages.yml

  build_cli_archive_windows:
    name: Build native CLI archive (Windows)
    uses: ./.github/workflows/build-cli-native-archives.yml
    with:
      targets: '[{"os": "windows-latest", "runner": "windows-latest", "rids": "win-x64"}]'

  package_extension:
    name: Package VS Code extension
    uses: ./.github/workflows/extension-unit-tests.yml
    with:
      packageVsix: true

  reproduce:
    name: "Windows runner #${{ matrix.runner }}"
    needs: [build_packages, build_cli_archive_windows, package_extension]
    if: >-
      ${{
        !cancelled() &&
        needs.build_packages.result == 'success' &&
        needs.build_cli_archive_windows.result == 'success' &&
        needs.package_extension.result == 'success'
      }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        runner: [1, 2, 3]
    env:
      NPM_REGISTRY: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-npm/npm/registry/
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.x'

      - name: Install Corepack
        working-directory: extension
        run: |
          $CorepackHome = Join-Path $env:RUNNER_TEMP 'corepack'
          $env:COREPACK_HOME = $CorepackHome
          "COREPACK_HOME=$CorepackHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $CorepackVersion = (Get-Content -Raw -Path 'scripts/corepack-version.txt').Trim()
          npm install --global --force --registry "$env:NPM_REGISTRY" "corepack@$CorepackVersion"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $npmGlobalBin = (npm prefix --global).Trim()
          $env:PATH = "$npmGlobalBin$([IO.Path]::PathSeparator)$env:PATH"
          $npmGlobalBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $installed = (corepack --version).Trim()
          if ($installed -ne $CorepackVersion) {
            Write-Error "corepack version mismatch: expected $CorepackVersion, got '$installed'."
            exit 1
          }

          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node ./scripts/prepareCorepackYarn.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          corepack yarn --version

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Download VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aspire-extension
          path: extension/out

      - name: Download CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-native-archives-win-x64
          path: artifacts/cli-archive

      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-nugets
          path: artifacts/nugets

      - name: Download RID-specific NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-nugets-for-win-x64
          path: artifacts/nugets-rid

      - name: Validate lockfile registries
        working-directory: extension
        run: node scripts/validate-lockfile-registry.cjs

      - name: Install extension dependencies
        working-directory: extension
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            corepack yarn install --frozen-lockfile --non-interactive
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            $exitCode = $LASTEXITCODE
            if ($attempt -eq 3) {
              Write-Error "corepack yarn install failed after $attempt attempts."
              exit $exitCode
            }

            $delay = $attempt * 30
            Write-Host "corepack yarn install failed with exit code $exitCode. Retrying in ${delay}s."
            Start-Sleep -Seconds $delay
          }

      - name: Prepare Aspire CLI and package hive
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $archive = Get-ChildItem -Path '${{ github.workspace }}/artifacts/cli-archive' -Recurse -File -Filter 'aspire-cli-win-x64*.zip' | Select-Object -First 1
          if ($null -eq $archive) {
            Get-ChildItem -Path '${{ github.workspace }}/artifacts/cli-archive' -Recurse -File | Format-Table -AutoSize
            throw 'Unable to find the win-x64 CLI archive.'
          }

          $bundleDir = Join-Path '${{ github.workspace }}' 'artifacts/bundle/win-x64'
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          Expand-Archive -Path $archive.FullName -DestinationPath $bundleDir -Force

          $cli = Get-ChildItem -Path $bundleDir -Recurse -File -Filter 'aspire.exe' | Select-Object -First 1
          if ($null -eq $cli) {
            Get-ChildItem -Path $bundleDir -Recurse -File | Format-Table -AutoSize
            throw 'Unable to find aspire.exe in the extracted CLI archive.'
          }

          & $cli.FullName setup
          if ($LASTEXITCODE -ne 0) { throw "aspire setup failed with exit code $LASTEXITCODE." }

          $cliDir = Split-Path -Path $cli.FullName -Parent
          $installPath = Split-Path -Path $cliDir -Parent
          $dcp = Get-ChildItem -Path $installPath -Recurse -File -Filter 'dcp.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $dcp) {
            throw "'aspire setup' succeeded but no dcp.exe exists under $installPath."
          }
          "ASPIRE_DCP_PATH=$($dcp.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $shippingDir = Join-Path '${{ github.workspace }}' 'artifacts/nugets/Debug/Shipping'
          if (-not (Test-Path $shippingDir)) {
            $shippingDir = Join-Path '${{ github.workspace }}' 'artifacts/nugets'
          }

          $samplePackage = Get-ChildItem -Path $shippingDir -Recurse -File -Filter 'Aspire.Hosting.AppHost.*.nupkg' | Select-Object -First 1
          if ($null -eq $samplePackage) {
            throw "Unable to find Aspire.Hosting.AppHost.*.nupkg under $shippingDir."
          }

          $hiveLabel = if ($samplePackage.Name -match '-pr\.([0-9]+)\.') {
            "pr-$($Matches[1])"
          } else {
            'daily'
          }

          $hiveDir = Join-Path $HOME ".aspire/hives/$hiveLabel/packages"
          New-Item -ItemType Directory -Path $hiveDir -Force | Out-Null
          Get-ChildItem -Path $shippingDir -Recurse -File -Filter '*.nupkg' | Copy-Item -Destination $hiveDir -Force
          Get-ChildItem -Path '${{ github.workspace }}/artifacts/nugets-rid' -Recurse -File -Filter '*.nupkg' | Copy-Item -Destination $hiveDir -Force

          "ASPIRE_CLI_PACKAGES=$hiveDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASPIRE_EXTENSION_E2E_CLI_PATH=$($cli.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASPIRE_EXTENSION_E2E_APPHOST_SDK_VERSION=$(($samplePackage.Name -replace '^Aspire\.Hosting\.AppHost\.', '') -replace '\.nupkg$', '')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $cli.FullName --version

      - name: Compile extension E2E tests
        working-directory: extension
        run: |
          corepack yarn compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          corepack yarn compile-e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path '${{ env.EXTENSION_E2E_SPEC }}')) {
            throw 'Compiled dynamic debug configuration shard was not found.'
          }

      - name: Run extension E2E iterations
        working-directory: extension
        env:
          ASPIRE_EXTENSION_E2E_VSIX: ${{ github.workspace }}/extension/out/aspire-extension.vsix
          ASPIRE_EXTENSION_E2E_SHARD: ${{ env.EXTENSION_E2E_SHARD }}
          ASPIRE_EXTENSION_E2E_SPEC: ${{ env.EXTENSION_E2E_SPEC }}
          ASPIRE_EXTENSION_E2E_RECORDING_MODE: off
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $iterations = [int]'${{ env.ITERATIONS_PER_RUNNER }}'
          $passed = 0
          $issueFailures = 0
          $otherFailures = 0
          $diagnosticsRoot = Join-Path '${{ github.workspace }}' "artifacts/e2e-iterations/runner-${{ matrix.runner }}"
          New-Item -ItemType Directory -Path $diagnosticsRoot -Force | Out-Null

          for ($iteration = 1; $iteration -le $iterations; $iteration++) {
            Write-Host "::group::Runner ${{ matrix.runner }} iteration $iteration/$iterations"
            $iterationDir = Join-Path $diagnosticsRoot "iteration-$iteration"
            New-Item -ItemType Directory -Path $iterationDir -Force | Out-Null
            $outputPath = Join-Path $iterationDir 'console.log'

            & node scripts/run-e2e.js *> $outputPath
            $result = $LASTEXITCODE
            Get-Content -Path $outputPath

            $mochaPath = Join-Path '.test-results/e2e' '${{ env.EXTENSION_E2E_SHARD }}/mocha.json'
            $testCount = 0
            if (Test-Path $mochaPath) {
              Copy-Item -Path (Split-Path $mochaPath -Parent) -Destination (Join-Path $iterationDir 'results') -Recurse -Force
              $mocha = Get-Content -Path $mochaPath -Raw | ConvertFrom-Json
              $testCount = [int]($mocha.stats.tests ?? $mocha.tests.Count)
            }

            if ($result -eq 0 -and $testCount -ne 3) {
              Write-Host "::error::Iteration $iteration reported success but executed $testCount tests; expected 3."
              $result = 8
            }

            if ($result -eq 0) {
              $passed++
              Write-Host "Iteration ${iteration}: PASS ($testCount tests)"
            } else {
              $combinedDiagnostics = Get-Content -Path $outputPath -Raw
              if (Test-Path $mochaPath) {
                $combinedDiagnostics += Get-Content -Path $mochaPath -Raw
              }

              if ($combinedDiagnostics -match '(?is)(EBUSY.*\.e2e-dynamic-debug|\.e2e-dynamic-debug.*EBUSY)') {
                $issueFailures++
                Write-Host "::error title=Original #20122 teardown signature reproduced::Iteration $iteration failed with EBUSY while deleting .e2e-dynamic-debug."
              } else {
                $otherFailures++
                Write-Host "::error title=Non-#20122 extension E2E failure::Iteration $iteration failed without the tracked EBUSY teardown signature."
              }
            }

            Write-Host "::endgroup::"
          }

          @"
          ### Windows runner ${{ matrix.runner }}

          | Outcome | Count |
          |---|---:|
          | Passing shard iterations | $passed |
          | #20122 EBUSY failures | $issueFailures |
          | Other failures | $otherFailures |
          | Tests expected per iteration | 3 |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if (($issueFailures + $otherFailures) -gt 0) {
            exit 1
          }

      - name: Upload E2E diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: extension-e2e-diagnostics-win-x64-${{ env.EXTENSION_E2E_SHARD }}-runner${{ matrix.runner }}
          path: |
            artifacts/e2e-iterations/**
            extension/.test-results/**
            extension/.test-storage/**/settings/User/**
            extension/.test-storage/**/settings/logs/**
            extension/.test-storage/**/screenshots/**
            extension/.test-storage/**/aspire-home/logs/**
            extension/.test-storage/**/aspire-home/cache/apphost-info/**
            extension/.test-workspaces/**/.aspire/**
            extension/.test-workspaces/**/*.log
          if-no-files-found: warn
          include-hidden-files: true

  results:
    name: Reproduce Results
    if: always()
    needs: [build_packages, build_cli_archive_windows, package_extension, reproduce]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        shell: bash
        run: |
          {
            echo "## Extension E2E verification for #20122"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Shard | \`${{ env.EXTENSION_E2E_SHARD }}\` |"
            echo "| Spec | \`${{ env.EXTENSION_E2E_SPEC }}\` |"
            echo "| OS | \`windows-latest\` |"
            echo "| Runners | ${{ env.RUNNERS }} |"
            echo "| Iterations per runner | ${{ env.ITERATIONS_PER_RUNNER }} |"
            echo "| Total shard invocations | 9 |"
            echo "| Total expected tests | 27 |"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Packages | ${{ needs.build_packages.result }} |"
            echo "| Windows CLI archive | ${{ needs.build_cli_archive_windows.result }} |"
            echo "| Extension VSIX | ${{ needs.package_extension.result }} |"
            echo "| Repeated shard runs | ${{ needs.reproduce.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.reproduce.result }}" != "success" ]; then
            exit 1
          fi
