# Reproduces flaky tests by running them repeatedly across multiple OS runners.
#
# HOW TO USE:
# 1. Edit the CONFIGURATION section below with the test you want to reproduce
# 2. Push to your branch
# 3. Trigger: gh workflow run reproduce-flaky-tests.yml --repo microsoft/aspire --ref <your-branch>
# 4. Check the results across OSes and runners
#
# The configuration is designed to be edited by agents (Copilot, etc.)
# who modify the env vars below and push to trigger a run.

name: Reproduce Flaky Tests

on:
  workflow_dispatch:
    inputs:
      runners_per_source:
        description: "Additional fresh runners per source for the admitted stage"
        required: true
        type: choice
        options:
          - "31"
          - "65"
          - "125"
        default: "31"

run-name: Aspire.Cli.Tests before/after validation (+${{ inputs.runners_per_source }} per source)
permissions: {}

# ============================================================
# CONFIGURATION — Edit these values to customize the test run
# ============================================================
env:
  # Test project shortname (maps to tests/Aspire.{name}.Tests/ or tests/{name}.Tests/)
  # Examples: Hosting, Core, Dashboard, Components.Common, Cli.EndToEnd
  TEST_PROJECT: "Cli"

  # Match regular CI selection, excluding quarantined and outerloop tests.
  TEST_FILTER: '--filter-not-trait "quarantined=true" --filter-not-trait "outerloop=true"'

  # Target operating systems (comma-separated)
  # Options: ubuntu-latest, windows-latest, macos-latest
  TARGET_OSES: "windows-latest"

  # Stage increments count all prior attempts, including lost runners:
  # 29 + 31 + 65 + 125 = 250 attempts per source, plus eight helpers overall.
  RUNNERS_PER_OS: ${{ inputs.runners_per_source }}

  ITERATIONS_PER_RUNNER: "1"
  BASELINE_SOURCE_SHA: "cedfcd0f14e6086a808106144134b3d6fb998afd"
  FIXED_SOURCE_SHA: "7ac27decf1b69288d1b32843fbbfe4a7778330b8"

jobs:

  setup:
    name: Generate matrix
    if: ${{ github.repository == 'microsoft/aspire' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          ERRORS=0

          if [[ "${{ env.TEST_PROJECT }}" != "Cli" ]]; then
            echo "::error::This comparison is pinned to Aspire.Cli.Tests."
            ERRORS=1
          fi

          if [[ "${{ env.RUNNERS_PER_OS }}" != "31" && "${{ env.RUNNERS_PER_OS }}" != "65" && "${{ env.RUNNERS_PER_OS }}" != "125" ]]; then
            echo "::error::RUNNERS_PER_OS must match an admitted stage increment (31, 65 or 125)."
            ERRORS=1
          fi

          if [[ "${{ env.ITERATIONS_PER_RUNNER }}" != "1" ]]; then
            echo "::error::ITERATIONS_PER_RUNNER must be 1 so each fresh runner executes once."
            ERRORS=1
          fi

          if [[ "${{ env.TARGET_OSES }}" != "windows-latest" ]]; then
            echo "::error::This comparison is pinned to the original Windows lane."
            ERRORS=1
          fi

          if [[ $ERRORS -ne 0 ]]; then exit 1; fi

      - name: Generate runner matrix
        id: generate
        shell: bash
        run: |
          IFS=',' read -ra OSES <<< "${{ env.TARGET_OSES }}"
          RUNNERS=${{ env.RUNNERS_PER_OS }}

          ENTRIES=""
          for os in "${OSES[@]}"; do
            os=$(echo "$os" | xargs)
            for i in $(seq 1 "$RUNNERS"); do
              for arm in baseline fixed; do
                if [ "$arm" = "baseline" ]; then
                  SOURCE_SHA="${{ env.BASELINE_SOURCE_SHA }}"
                else
                  SOURCE_SHA="${{ env.FIXED_SOURCE_SHA }}"
                fi
                if [ -n "$ENTRIES" ]; then ENTRIES="$ENTRIES,"; fi
                ENTRIES="${ENTRIES}{\"os\":\"${os}\",\"arm\":\"${arm}\",\"sourceSha\":\"${SOURCE_SHA}\",\"index\":${i}}"
              done
            done
          done

          MATRIX="{\"include\":[${ENTRIES}]}"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

          TOTAL=$(( RUNNERS * 2 * ${#OSES[@]} ))
          echo "Generated matrix: $TOTAL runners across two source arms"
          if [[ "$TOTAL" -ne 62 && "$TOTAL" -ne 130 && "$TOTAL" -ne 250 ]]; then
            echo "::error::Expected exactly 62, 130 or 250 matrix jobs, got $TOTAL."
            exit 1
          fi

  reproduce:
    name: "${{ matrix.arm }} ${{ matrix.os }} #${{ matrix.index }}"
    needs: [setup]
    if: ${{ github.repository == 'microsoft/aspire' && !cancelled() && needs.setup.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet
      SOURCE_SHA: ${{ matrix.sourceSha }}
      MSBUILDTERMINALLOGGER: "false"

    steps:
      - name: Setup vars (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "DOTNET_SCRIPT=./dotnet.sh" >> $GITHUB_ENV
          echo "BUILD_SCRIPT=./build.sh" >> $GITHUB_ENV
          echo "${{ github.workspace }}/.dotnet" >> $GITHUB_PATH

      - name: Setup vars (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "DOTNET_SCRIPT=.\dotnet.cmd" >> $env:GITHUB_ENV
          echo "BUILD_SCRIPT=.\build.cmd" >> $env:GITHUB_ENV
          Write-Output "NUGET_PACKAGES=${{ github.workspace }}/.nuget/packages" >> $env:GITHUB_ENV
          echo "${{ github.workspace }}\.dotnet" >> $env:GITHUB_PATH

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sourceSha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source checkout
        shell: pwsh
        env:
          VALIDATION_ARM: ${{ matrix.arm }}
          MATRIX_INDEX: ${{ matrix.index }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            Write-Error "Expected source $env:SOURCE_SHA but checked out $actual"
            exit 1
          }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          $status = (git status --porcelain)
          if ($status) {
            Write-Error "Source checkout is not clean: $status"
            exit 1
          }
          @(
            "run_id=$env:RUN_ID"
            "run_attempt=$env:RUN_ATTEMPT"
            "arm=$env:VALIDATION_ARM"
            "matrix_index=$env:MATRIX_INDEX"
            "source_sha=$actual"
            "source_tree=$tree"
            "clean=true"
          ) | Set-Content -Path source-verification.txt -Encoding utf8
          Write-Host "Verified $env:VALIDATION_ARM source $actual ($tree), clean checkout."

      - name: Trust HTTPS development certificate (Linux)
        if: runner.os == 'Linux'
        run: |
          EXIT_CODE=0
          ${{ env.DOTNET_SCRIPT }} dev-certs https --trust || EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 4 ]; then
            echo "dev-certs https --trust failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
        env:
          WSL_INTEROP: ""

      - name: Verify Docker is running (Linux)
        if: runner.os == 'Linux'
        run: docker info

      - name: Unlock macOS keychain
        if: runner.os == 'macOS'
        uses: ./.github/actions/unlock-macos-keychain

      - name: Compute test project path
        shell: pwsh
        run: |
          $testShortName = "${{ env.TEST_PROJECT }}"
          $projectPath1 = "${{ github.workspace }}/tests/$testShortName.Tests/$testShortName.Tests.csproj"
          $projectPath2 = "${{ github.workspace }}/tests/Aspire.$testShortName.Tests/Aspire.$testShortName.Tests.csproj"

          if (Test-Path -Path $projectPath1) {
              $projectPath = $projectPath1
          } elseif (Test-Path -Path $projectPath2) {
              $projectPath = $projectPath2
          } else {
              Write-Error "No test project found for shortname '$testShortName'. Looked at: $projectPath1, $projectPath2"
              exit 1
          }

          echo "TEST_PROJECT_PATH=$projectPath" >> $env:GITHUB_ENV
          Write-Host "Resolved test project: $projectPath"

      - name: Build test project
        run: >
          ${{ env.BUILD_SCRIPT }}
          -restore -ci -build
          -projects ${{ env.TEST_PROJECT_PATH }}
          /p:InstallBrowsersForPlaywright=false

      - name: Shutdown build server
        if: runner.os == 'Windows'
        run: ${{ env.DOTNET_SCRIPT }} build-server shutdown

      - name: Record .NET environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dotnetInfo = & ${{ env.DOTNET_SCRIPT }} --info
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet --info failed with exit code $LASTEXITCODE"
          }
          $dotnetInfo | Set-Content -Path runtime-info.txt -Encoding utf8

      - name: Run test iterations (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          ASPIRE__TEST__DCPLOGBASEPATH: ${{ github.workspace }}/testresults/dcp
          NUGET_PACKAGES: ${{ github.workspace }}/.packages
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: 'netaspireci.azurecr.io'
          # Apply the regular-CI filters explicitly for this workflow_dispatch run.
          SkipDefaultTestFilters: true
        run: |
          PASS=0
          FAIL=0
          ITERATIONS=${{ env.ITERATIONS_PER_RUNNER }}

          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::Iteration $i/$ITERATIONS"

            # Cleanup between iterations
            rm -rf "${{ github.workspace }}/testresults" 2>/dev/null || true
            pgrep -lf "dcp" 2>/dev/null | grep -E "\bdcp(\.exe|ctl)?\b" | awk '{print $1}' | while read pid; do
              kill -9 "$pid" 2>/dev/null || true
            done
            sleep 1

            # Run test (capture output for zero-test detection)
            ITER_OUTPUT="${{ github.workspace }}/iter-output-$i.log"
            set +e  # Disable errexit so pipefail doesn't abort before PIPESTATUS capture
            ${{ env.DOTNET_SCRIPT }} test --project "${{ env.TEST_PROJECT_PATH }}" \
              --no-restore \
              --no-build \
              -- \
              --timeout 10m \
              --results-directory "${{ github.workspace }}/testresults" \
              ${{ env.TEST_FILTER }} \
              2>&1 | tee "$ITER_OUTPUT"
            RESULT=${PIPESTATUS[0]}
            set -e

            # Detect zero-test runs (--ignore-exit-code 8 in Testing.targets masks exit code 8)
            if [ "$RESULT" -eq 0 ]; then
              if ! grep -qiE "total:\s*[1-9]" "$ITER_OUTPUT" 2>/dev/null; then
                echo "::error::Iteration $i: Zero tests executed. Verify TEST_FILTER and quarantine settings."
                RESULT=8
              fi
            fi
            rm -f "$ITER_OUTPUT"

            if [ "$RESULT" -eq 0 ]; then
              echo "✅ Iteration $i: PASS"
              PASS=$((PASS + 1))
            else
              echo "❌ Iteration $i: FAIL (exit $RESULT)"
              FAIL=$((FAIL + 1))
              mkdir -p "${{ github.workspace }}/all-results/failure-$i"
              cp -r "${{ github.workspace }}/testresults/"* "${{ github.workspace }}/all-results/failure-$i/" 2>/dev/null || true
            fi

            echo "::endgroup::"
          done

          echo ""
          echo "========================================"
          echo "Summary for runner #${{ matrix.index }} on ${{ matrix.os }}"
          echo "  Passed: $PASS / $ITERATIONS"
          echo "  Failed: $FAIL / $ITERATIONS"
          echo "========================================"

          if [ "$FAIL" -gt 0 ]; then exit 1; fi

      - name: Run test iterations (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASPIRE__TEST__DCPLOGBASEPATH: ${{ github.workspace }}/testresults/dcp
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: 'netaspireci.azurecr.io'
          UseSharedCompilation: false
          MSBUILDTERMINALLOGGER: "false"
          PLAYWRIGHT_INSTALLED: "false"
          # Apply the regular-CI filters explicitly for this workflow_dispatch run.
          SkipDefaultTestFilters: true
        run: |
          $pass = 0
          $fail = 0
          $iterations = [int]"${{ env.ITERATIONS_PER_RUNNER }}"
          $heartbeatProcess = Start-Process -FilePath "${{ env.DOTNET_SCRIPT }}" `
            -ArgumentList "${{ github.workspace }}\tools\scripts\Heartbeat.cs 60" `
            -NoNewWindow -PassThru

          try {
            for ($i = 1; $i -le $iterations; $i++) {
              Write-Host "::group::Iteration $i/$iterations"

              # Cleanup between iterations
              Remove-Item -Recurse -Force "${{ github.workspace }}/testresults" -ErrorAction SilentlyContinue
              Get-Process | Where-Object { $_.ProcessName -match '^dcp' } | Stop-Process -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Path "${{ github.workspace }}/testresults" -Force | Out-Null
              Start-Sleep -Seconds 1

              # Run test (capture output for zero-test detection)
              $iterOutput = Join-Path "${{ github.workspace }}" "iter-output-$i.log"
              & ${{ env.DOTNET_SCRIPT }} test --project "${{ env.TEST_PROJECT_PATH }}" `
                /p:ContinuousIntegrationBuild=true `
                /p:TrxFileNamePrefix="Cli" `
                -bl:${{ github.workspace }}/testresults/test.binlog `
                --no-launch-profile `
                --no-restore `
                --no-build `
                -- `
                --report-trx `
                --results-directory "${{ github.workspace }}/testresults" `
                ${{ env.TEST_FILTER }} *> $iterOutput
              $result = $LASTEXITCODE
              Get-Content $iterOutput

              # Detect zero-test runs (--ignore-exit-code 8 in Testing.targets masks exit code 8)
              if ($result -eq 0) {
                $content = Get-Content $iterOutput -Raw -ErrorAction SilentlyContinue
                if (-not ($content -match '(?i)total:\s*[1-9]')) {
                  Write-Host "::error::Iteration ${i}: Zero tests executed. Verify TEST_FILTER and quarantine settings."
                  $result = 8
                }
              }
              Remove-Item $iterOutput -ErrorAction SilentlyContinue

              if ($result -eq 0) {
                Write-Host "✅ Iteration ${i}: PASS"
                $pass++
              } else {
                Write-Host "❌ Iteration ${i}: FAIL (exit $result)"
                $fail++
                $dest = "${{ github.workspace }}/all-results/failure-$i"
                New-Item -ItemType Directory -Path $dest -Force | Out-Null
                Copy-Item -Recurse "${{ github.workspace }}/testresults/*" $dest -ErrorAction SilentlyContinue
              }

              Write-Host "::endgroup::"
            }
          }
          finally {
            if ($heartbeatProcess -and !$heartbeatProcess.HasExited) {
              $heartbeatProcess | Stop-Process -Force -ErrorAction SilentlyContinue
            }
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Summary for runner #${{ matrix.index }} on ${{ matrix.os }}"
          Write-Host "  Passed: $pass / $iterations"
          Write-Host "  Failed: $fail / $iterations"
          Write-Host "========================================"

          if ($fail -gt 0) { exit 1 }

      - name: Upload source receipt and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ matrix.arm }}-${{ matrix.index }}
          path: |
            source-verification.txt
            runtime-info.txt
            testresults/**/*.trx
            all-results/**
          if-no-files-found: warn
          retention-days: 7

  results:
    if: ${{ always() && github.repository == 'microsoft/aspire' }}
    runs-on: ubuntu-latest
    name: Reproduce Results
    needs: [reproduce]
    permissions: {}
    steps:
      - name: Summary
        shell: bash
        run: |
          echo "## Reproduce Flaky Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test Project | \`${{ env.TEST_PROJECT }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Filter | \`${{ env.TEST_FILTER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| OSes | ${{ env.TARGET_OSES }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Runs per source | ${{ env.RUNNERS_PER_OS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Baseline source | \`${{ env.BASELINE_SOURCE_SHA }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Fixed source | \`${{ env.FIXED_SOURCE_SHA }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Total test jobs | $(( ${{ env.RUNNERS_PER_OS }} * 2 )) |" >> $GITHUB_STEP_SUMMARY
          echo "| Invocations per job | ${{ env.ITERATIONS_PER_RUNNER }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.reproduce.result }}" = "success" ]; then
            echo "### ✅ All iterations passed on all runners" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.reproduce.result }}" = "failure" ]; then
            echo "### ❌ Some runners reported failures" >> $GITHUB_STEP_SUMMARY
            echo "Check individual job logs and uploaded failure artifacts for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Reproduce job was ${{ needs.reproduce.result }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if reproduce did not succeed
        if: ${{ needs.reproduce.result != 'success' }}
        run: exit 1
