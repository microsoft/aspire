# TEMPORARY diagnostics-only investigation. Do not merge this workflow into the clean fix PR.
# Reuse the default-branch-known workflow filename so dispatch works without an investigation PR:
# gh workflow run reproduce-flaky-tests.yml --repo microsoft/aspire --ref ellahathaway-diagnostics-lock-workflow-repro
# This does not launch VS Code, build AppHosts, run WinUI probes, or build the .NET product.
name: Reproduce Diagnostics Lock (TEMPORARY)
run-name: Diagnostics lock before/after (${{ github.ref_name }})

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: diagnostics-lock-repro-${{ github.ref }}
  cancel-in-progress: false

env:
  BASELINE_COMMIT: 103ae5d528b9002875b9fd9b322798d51d706cef
  FIXED_COMMIT: 3489dec97000d1fe3795e82a0643e5dccb4ce7c3
  ITERATIONS_PER_RUNNER: '3'
  NPM_REGISTRY: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-npm/npm/registry/
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

defaults:
  run:
    shell: pwsh

jobs:
  reproduce:
    name: Diagnostics ${{ matrix.variant }} runner ${{ matrix.runner }}/3
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, fixed]
        runner: [1, 2, 3]
    env:
      VARIANT: ${{ matrix.variant }}
      RUNNER_INDEX: ${{ matrix.runner }}
      RESULTS_DIRECTORY: ${{ github.workspace }}\diagnostics-results
      COREPACK_HOME: ${{ github.workspace }}\.diagnostics-corepack
      NPM_CONFIG_PREFIX: ${{ github.workspace }}\.diagnostics-tools
      NPM_CONFIG_CACHE: ${{ github.workspace }}\.diagnostics-npm-cache
      YARN_CACHE_FOLDER: ${{ github.workspace }}\.diagnostics-yarn-cache
    steps:
      - name: Checkout investigation revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.x'
          architecture: x64

      - name: Scope investigation state to this workspace
        run: |
          $temp = Join-Path $env:GITHUB_WORKSPACE '.diagnostics-temp'
          New-Item -ItemType Directory -Path $env:RESULTS_DIRECTORY, $temp -Force | Out-Null
          "TEMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned Corepack and seed pinned Yarn
        working-directory: extension
        run: |
          $CorepackVersion = (Get-Content -Raw -LiteralPath 'scripts\corepack-version.txt').Trim()
          if ($CorepackVersion -ne '0.34.7') { throw "Unexpected Corepack pin: $CorepackVersion" }
          # The same approved-feed bootstrap as extension-e2e-tests.yml, with npm's global
          # prefix and all caches scoped to this disposable workspace instead of the user profile.
          npm install --global --force --registry "$env:NPM_REGISTRY" "corepack@$CorepackVersion"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $npmGlobalBin = (npm prefix --global).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$npmGlobalBin$([IO.Path]::PathSeparator)$env:PATH"
          $npmGlobalBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $installed = (corepack --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $installed -ne $CorepackVersion) {
            throw "Expected Corepack $CorepackVersion, got '$installed'."
          }
          corepack enable --install-directory "$npmGlobalBin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .\scripts\prepareCorepackYarn.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $yarnVersion = (corepack yarn --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $yarnVersion -ne '1.22.22') {
            throw "Expected Yarn 1.22.22, got '$yarnVersion'."
          }
          "DIAGNOSTICS_COREPACK_VERSION=$installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DIAGNOSTICS_YARN_VERSION=$yarnVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install locked extension dependencies
        working-directory: extension
        run: |
          node .\scripts\validate-lockfile-registry.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack yarn install --frozen-lockfile --non-interactive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Select only the collector revision and record provenance
        run: |
          node -e "const a=require('node:assert/strict'); a.equal(process.platform,'win32'); a.equal(process.arch,'x64'); a.equal(process.versions.node.split('.')[0],'22');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code $env:FIXED_COMMIT -- extension\scripts\run-e2e.js extension\src\test\e2eStorageDiagnostics.test.ts extension\package.json extension\yarn.lock extension\tsconfig.json
          if ($LASTEXITCODE -ne 0) { throw 'The collector, regression suite, or build inputs differ from the known fixed commit.' }

          $collectorRevision = $env:FIXED_COMMIT
          if ($env:VARIANT -eq 'baseline') {
            $collectorRevision = $env:BASELINE_COMMIT
            # Only this file changes, only in the disposable Actions checkout. The new fixed-commit
            # regression suite stays present and proves the native OS lock before calling the collector.
            git restore --source=$collectorRevision --worktree -- extension\scripts\run-e2e.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --exit-code $collectorRevision -- extension\scripts\run-e2e.js
          if ($LASTEXITCODE -ne 0) { throw 'Collector does not match its recorded revision.' }

          $suiteBlob = (git rev-parse "$($env:FIXED_COMMIT):extension/src/test/e2eStorageDiagnostics.test.ts").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($suiteBlob -ne '5fd895122b4a68af7b57c08bbd96fe888c542598') { throw 'Not the final eighteen-test regression suite.' }
          $collectorBlob = (git rev-parse "$($collectorRevision):extension/scripts/run-e2e.js").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $context = [ordered]@{
            variant = $env:VARIANT
            runner = [int]$env:RUNNER_INDEX
            iterations = [int]$env:ITERATIONS_PER_RUNNER
            workflowRevision = $env:GITHUB_SHA
            baselineRevision = $env:BASELINE_COMMIT
            fixedRevision = $env:FIXED_COMMIT
            collectorRevision = $collectorRevision
            testRevision = $env:FIXED_COMMIT
            suiteBlob = $suiteBlob
            collectorBlob = $collectorBlob
            runnerOs = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
            osVersion = [Environment]::OSVersion.VersionString
            nodeVersion = (node -p 'process.version').Trim()
            nodePlatform = (node -p 'process.platform').Trim()
            nodeArch = (node -p 'process.arch').Trim()
            corepack = $env:DIAGNOSTICS_COREPACK_VERSION
            yarn = $env:DIAGNOSTICS_YARN_VERSION
          }
          $context | ConvertTo-Json | Out-File -LiteralPath "$env:RESULTS_DIRECTORY\context.json" -Encoding utf8
          $context | ConvertTo-Json

      - name: Compile the existing regression suite
        working-directory: extension
        run: corepack yarn run compile-tests

      - name: Run three iterations and require exact before/after results
        timeout-minutes: 5
        working-directory: extension
        run: |
          # Expected baseline exit 13 must reach the parser, not PowerShell's native-error handling.
          $PSNativeCommandUseErrorActionPreference = $false
          $unexpected = $false
          for ($iteration = 1; $iteration -le [int]$env:ITERATIONS_PER_RUNNER; $iteration++) {
            $prefix = Join-Path $env:RESULTS_DIRECTORY "iteration-$iteration"
            node .\node_modules\mocha\bin\mocha.js --no-config --no-package --ui tdd --timeout 20000 --reporter json --reporter-option "output=$prefix.json" .\out\test\e2eStorageDiagnostics.test.js 1> "$prefix.stdout.txt" 2> "$prefix.stderr.txt"
            $mochaExit = $LASTEXITCODE
            $mochaExit | Out-File -LiteralPath "$prefix.exit-code.txt" -Encoding utf8
            node --experimental-strip-types ..\.github\scripts\validate-diagnostics-repro.mts verify $env:VARIANT "$prefix.json" $mochaExit 1> "$prefix.validation.json" 2> "$prefix.validation-errors.txt"
            if ($LASTEXITCODE -ne 0) {
              $unexpected = $true
              Write-Host "::error::Iteration $iteration did not match the $env:VARIANT contract. Raw outputs are retained."
              Get-Content -LiteralPath "$prefix.validation-errors.txt"
            } else {
              Write-Host "Iteration $iteration ($env:VARIANT): $(Get-Content -Raw -LiteralPath "$prefix.validation.json")"
            }
          }
          if ($unexpected) { throw 'One or more iterations did not reproduce the exact expected results.' }

      - name: Upload every iteration, including failures
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: diagnostics-lock-${{ matrix.variant }}-${{ matrix.runner }}
          path: ${{ env.RESULTS_DIRECTORY }}
          if-no-files-found: error
          retention-days: 7

  results:
    name: Validate and summarize all 18 executions
    needs: reproduce
    if: always()
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the same investigation revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.x'
          architecture: x64

      - name: Download per-runner evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: diagnostics-lock-*
          path: diagnostics-collected-results

      - name: Revalidate raw results and write the final summary
        if: always()
        env:
          REPRODUCE_RESULT: ${{ needs.reproduce.result }}
        run: node --experimental-strip-types .\.github\scripts\validate-diagnostics-repro.mts summarize .\diagnostics-collected-results
