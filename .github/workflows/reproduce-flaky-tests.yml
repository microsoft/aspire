# Qualification branch only: unmodified listener plus the new regression test; the regression test is expected to fail.
name: Qualify socket listener reconnect at capacity (before)
run-name: Socket listener reconnect before at ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  socket_listener_reconnect:
    uses: ./.github/workflows/run-tests.yml
    with:
      testShortName: Hosting.Native.Core
      testProjectPath: tests/Aspire.Hosting.Native.Core.Tests/Aspire.Hosting.Native.Core.Tests.csproj
      os: ubuntu-latest
      ignoreTestFailures: false
      allowZeroTests: false
      extraTestArgs: >-
        --filter-class '*.SocketConnectionListenerTests' --filter-class '*.NativeCliProtocolTests'
