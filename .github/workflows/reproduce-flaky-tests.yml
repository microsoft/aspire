# Qualification branch only: original callbacks (outer token) plus forced ordering; qualification test expected to FAIL with the non-fatal Debug message.
name: Qualify NuGetPackagePrefetcher shutdown cancellation (before)
run-name: NuGetPackagePrefetcher cancellation before at ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  prefetcher_cancellation:
    uses: ./.github/workflows/run-tests.yml
    with:
      testShortName: Cli
      testProjectPath: tests/Aspire.Cli.Tests/Aspire.Cli.Tests.csproj
      os: ubuntu-latest
      ignoreTestFailures: false
      allowZeroTests: false
      extraTestArgs: >-
        --filter-class '*.NuGetPackagePrefetcherTests'
