# TEMPORARY #20103 investigation. DO NOT MERGE.
# New branch-only diagnostic experiment requested after the earlier bounded batch.
# Three fresh x64 jobs each run one stress suite, stopping at its first failure,
# with at most 30 stop/start/restart cycles and live remote evidence checkpoints.
name: Reproduce Flaky Tests

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: issue-20103-repro-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '35383851199'
  TESTED_SOURCE_SHA: '95a720c0f40cec0e967fa7a08cd5f17b012da095'
  EXPECTED_DCP_COMMIT: 'b9830ac8d11bd85d866ccbaf65783462f6f25742'
  NPM_REGISTRY: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-npm/npm/registry/
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

defaults:
  run:
    shell: pwsh

jobs:
  verify_source:
    name: Verify historical source and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate provenance
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:GITHUB_REF -ne 'refs/heads/ellahathaway-vs-code-e2e-flakiness-269') {
            throw 'Temporary investigation workflow must not run on another branch.'
          }
          New-Item -ItemType Directory -Path provenance | Out-Null
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID" | ConvertFrom-Json
          if ($run.event -ne 'push' -or $run.head_branch -ne 'main' -or
              $run.head_sha -cne $env:TESTED_SOURCE_SHA -or $run.run_attempt -ne 1 -or $run.status -ne 'completed') {
            throw 'Source run does not match the original main push.'
          }
          $pages = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID/artifacts?per_page=100" | ConvertFrom-Json
          $artifacts = @($pages | ForEach-Object { $_.artifacts })
          $expected = [ordered]@{
            'aspire-extension' = [long]10563691425
            'cli-native-archives-win-x64' = [long]10563941021
            'built-nugets' = [long]10563680586
            'built-nugets-for-win-x64' = [long]10563461815
          }
          $selected = foreach ($name in $expected.Keys) {
            $found = @($artifacts | Where-Object name -CEQ $name)
            if ($found.Count -ne 1 -or $found[0].id -ne $expected[$name] -or $found[0].expired -or
                $found[0].workflow_run.id -ne [long]$env:SOURCE_RUN_ID -or
                $found[0].workflow_run.head_sha -cne $env:TESTED_SOURCE_SHA) {
              throw "Required historical artifact '$name' is unavailable or has the wrong identity."
            }
            $found[0]
          }
          [ordered]@{
            workflowSha = $env:WORKFLOW_SHA
            testedSourceSha = $env:TESTED_SOURCE_SHA
            sourceRunId = $env:SOURCE_RUN_ID
            artifacts = @($selected)
            mode = 'diagnostic stress; three fresh jobs; at most thirty lifecycle cycles each'
          } | ConvertTo-Json -Depth 10 | Set-Content provenance/source.json -Encoding utf8

      - name: Upload provenance
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tree-actions-stress-provenance-attempt${{ github.run_attempt }}
          path: provenance
          if-no-files-found: error

  reproduce:
    name: Windows x64 shutdown stress ${{ matrix.index }}
    needs: verify_source
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3]
    env:
      REPRO_RUNNER_INDEX: ${{ matrix.index }}
      WORKFLOW_SHA: ${{ github.sha }}
      ASPIRE_EXTENSION_E2E_SKIP_CURRENT_CLI_REGRESSIONS: 'false'
      ASPIRE_EXTENSION_E2E_RECORDING_MODE: 'off'
    steps:
      - name: Checkout immutable product and test baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TESTED_SOURCE_SHA }}
          persist-credentials: false

      - name: Checkout investigation tooling only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: investigation
          sparse-checkout: .github/diagnostics/tree-actions
          persist-credentials: false

      - name: Initialize evidence
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:TESTED_SOURCE_SHA -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'Wrong tested source or runner architecture.'
          }
          $root = Join-Path $env:GITHUB_WORKSPACE "stress-results/runner-$env:REPRO_RUNNER_INDEX"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          "REPRO_RESULTS_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{
            workflowSha = $env:WORKFLOW_SHA; sourceSha = $env:TESTED_SOURCE_SHA
            sourceRunId = $env:SOURCE_RUN_ID; runnerIndex = $env:REPRO_RUNNER_INDEX
            imageOS = $env:ImageOS; imageVersion = $env:ImageVersion; architecture = $env:RUNNER_ARCH
          } | ConvertTo-Json | Set-Content (Join-Path $root environment.json) -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.x'

      - name: Install pinned Corepack
        working-directory: extension
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:COREPACK_HOME = Join-Path $env:RUNNER_TEMP corepack
          "COREPACK_HOME=$env:COREPACK_HOME" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $version = (Get-Content scripts/corepack-version.txt -Raw).Trim()
          npm install --global --force --registry "$env:NPM_REGISTRY" "corepack@$version"
          $npmGlobalBin = (npm prefix --global).Trim()
          $env:PATH = "$npmGlobalBin$([IO.Path]::PathSeparator)$env:PATH"
          $npmGlobalBin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          if ((corepack --version).Trim() -ne $version) { throw 'Corepack version mismatch.' }
          corepack enable
          node scripts/prepareCorepackYarn.mjs
          corepack yarn --version

      - name: Setup baseline SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Download baseline E2E VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '10563691425'
          path: extension/out
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download baseline CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '10563941021'
          path: artifacts/cli-archive
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download baseline packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '10563680586'
          path: artifacts/nugets
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download baseline x64 packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '10563461815'
          path: artifacts/nugets-rid
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Install locked extension dependencies
        working-directory: extension
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/validate-lockfile-registry.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            corepack yarn install --frozen-lockfile --non-interactive
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 3) { throw "Dependency installation failed: $LASTEXITCODE" }
            Start-Sleep -Seconds ($attempt * 30)
          }

      - name: Prepare original CLI and package hive
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $archives = @(Get-ChildItem artifacts/cli-archive -Recurse -File -Filter 'aspire-cli-win-x64*.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one CLI archive.' }
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'artifacts/bundle/win-x64'
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $bundle
          $clis = @(Get-ChildItem $bundle -Recurse -File -Filter aspire.exe)
          if ($clis.Count -ne 1) { throw 'Expected exactly one CLI executable.' }
          $cli = $clis[0].FullName
          & $cli setup
          $installRoot = Split-Path (Split-Path $cli -Parent) -Parent
          $dcps = @(Get-ChildItem $installRoot -Recurse -File -Filter dcp.exe)
          if ($dcps.Count -ne 1) { throw 'Expected exactly one DCP executable.' }
          $dcpVersion = & $dcps[0].FullName version | ConvertFrom-Json
          if ($dcpVersion.version -ne '0.26.2' -or $dcpVersion.commitHash -cne $env:EXPECTED_DCP_COMMIT) {
            throw 'Unexpected DCP build.'
          }
          $cliVersion = (& $cli --version | Out-String).Trim()
          if ($cliVersion -cne '13.6.0-ci') { throw "Unexpected CLI version: $cliVersion" }
          $hive = Join-Path $HOME '.aspire/hives/daily/packages'
          New-Item -ItemType Directory -Path $hive -Force | Out-Null
          foreach ($inputDirectory in @('artifacts/nugets', 'artifacts/nugets-rid')) {
            $packages = @(Get-ChildItem $inputDirectory -Recurse -File -Filter '*.nupkg')
            if ($packages.Count -eq 0) { throw "No packages in $inputDirectory." }
            $packages | Copy-Item -Destination $hive -Force
          }
          if (-not (Test-Path (Join-Path $hive 'Aspire.Hosting.AppHost.13.6.0-ci.nupkg'))) {
            throw 'Baseline AppHost package missing.'
          }
          $vsixes = @(Get-ChildItem extension/out -Recurse -File -Filter '*.vsix')
          if ($vsixes.Count -ne 1) { throw 'Baseline E2E VSIX missing or ambiguous.' }
          @(
            "ASPIRE_DCP_PATH=$($dcps[0].Directory.FullName)"
            "ASPIRE_CLI_PACKAGES=$hive"
            "ASPIRE_EXTENSION_E2E_CLI_PATH=$cli"
            'ASPIRE_EXTENSION_E2E_APPHOST_SDK_VERSION=13.6.0-ci'
            "ASPIRE_EXTENSION_E2E_VSIX=$($vsixes[0].FullName)"
            "DIAG_NODE_PATH=$((Get-Command node).Source)"
          ) | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{
            cliVersion = $cliVersion; dcp = $dcpVersion
            sdkVersion = (dotnet --version | Out-String).Trim()
            nodeVersion = (node --version | Out-String).Trim()
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:REPRO_RESULTS_ROOT versions.json) -Encoding utf8

      - name: Compile temporary diagnostics without modifying baseline files
        working-directory: extension
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = Join-Path $env:GITHUB_WORKSPACE 'investigation/.github/diagnostics/tree-actions'
          Copy-Item (Join-Path $tools treeActionsRestartDiagnostics.e2e.test.ts) src/test-e2e/
          corepack yarn compile
          corepack yarn compile-e2e
          if (-not (Test-Path out/test-e2e/test-e2e/treeActionsRestartDiagnostics.e2e.test.js)) {
            throw 'Diagnostic spec was not compiled.'
          }
          git diff --exit-code $env:TESTED_SOURCE_SHA -- src scripts/run-e2e.js .mocharc.e2e.js package.json yarn.lock
          $compiled = Join-Path $env:RUNNER_TEMP 'tree-actions-diagnostic-js'
          node node_modules/typescript/bin/tsc (Join-Path $tools RunDiagnosticSuite.ts) (Join-Path $tools RunDiagnosticSuite.test.ts) --outDir $compiled --target ES2022 --module commonjs --moduleResolution node --types node --typeRoots node_modules/@types --strict --skipLibCheck --rewriteRelativeImportExtensions
          node --test (Join-Path $compiled RunDiagnosticSuite.test.js)
          "DIAG_COMPILED_ROOT=$compiled" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run stress suite with live remote checkpoints
        id: stress
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('node:path');
            const { runDiagnostics } = require(path.join(process.env.DIAG_COMPILED_ROOT, 'RunDiagnosticSuite.js'));
            const uploadActionPath = path.resolve(process.env.RUNNER_TEMP, '..', '_actions', 'actions', 'upload-artifact', 'bbbca2ddaa5d8feaa63e36b76fdaad77386f024f', 'dist', 'upload', 'index.js');
            const result = await runDiagnostics({
              extensionRoot: path.join(process.env.GITHUB_WORKSPACE, 'extension'),
              outputRoot: process.env.REPRO_RESULTS_ROOT,
              temporaryRoot: path.join(process.env.RUNNER_TEMP, `tree-actions-r${process.env.REPRO_RUNNER_INDEX}`),
              toolsRoot: path.join(process.env.GITHUB_WORKSPACE, 'investigation', '.github', 'diagnostics', 'tree-actions'),
              nodePath: process.env.DIAG_NODE_PATH,
              uploadActionPath,
              runnerIndex: process.env.REPRO_RUNNER_INDEX,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              sourceSha: process.env.TESTED_SOURCE_SHA,
              workflowSha: process.env.WORKFLOW_SHA
            });
            core.info(JSON.stringify(result));
            if (result.runnerExitCode !== 0 || result.observerExitCode !== 0 || result.diagnosticErrors.length) {
              core.setFailed('Stress or diagnostic capture failed; preserved checkpoints must be inspected.');
            }

      - name: Verify actual stress execution
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $shard = "tree-actions-stress-r$env:REPRO_RUNNER_INDEX"
          $mochaFile = Join-Path $env:GITHUB_WORKSPACE "extension/.test-results/e2e/$shard/mocha.json"
          $controllerFile = Join-Path $env:REPRO_RESULTS_ROOT controller-result.json
          $stressFile = Join-Path $env:REPRO_RESULTS_ROOT observations/stress-status.json
          if (-not (Test-Path $mochaFile) -or -not (Test-Path $controllerFile) -or -not (Test-Path $stressFile)) {
            throw 'Stress results are incomplete; inspect the last persisted remote checkpoint. Do not count this as a pass.'
          }
          $mocha = Get-Content $mochaFile -Raw | ConvertFrom-Json
          $controller = Get-Content $controllerFile -Raw | ConvertFrom-Json
          $stress = Get-Content $stressFile -Raw | ConvertFrom-Json
          $summary = [ordered]@{
            runner = $env:REPRO_RUNNER_INDEX; sourceSha = $env:TESTED_SOURCE_SHA
            workflowSha = $env:WORKFLOW_SHA; mocha = $mocha.stats
            stress = $stress; controller = $controller
          }
          $summary | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $env:REPRO_RESULTS_ROOT summary.json) -Encoding utf8
          $summary | ConvertTo-Json -Depth 10 | Write-Host
          $expected = 'Aspire tree-actions shutdown diagnostics rapid stop/start/restart preserves the worker'
          if ($mocha.stats.tests -ne 1 -or $mocha.stats.passes -ne 1 -or $mocha.stats.failures -ne 0 -or
              $mocha.stats.pending -ne 0 -or $mocha.tests[0].fullTitle -cne $expected -or
              $mocha.tests[0].currentRetry -ne 0 -or $stress.completedCycles -ne 30 -or $stress.outcome -ne 'passed' -or
              $controller.runnerExitCode -ne 0 -or $controller.observerExitCode -ne 0 -or
              $controller.checkpointCount -lt 2 -or $controller.diagnosticErrors.Count -ne 0) {
            throw 'Stress did not complete all thirty cycles successfully, or diagnostic evidence is incomplete.'
          }

      - name: Upload final diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tree-actions-stress-runner-${{ matrix.index }}-attempt${{ github.run_attempt }}
          path: |
            stress-results/
            extension/.test-storage/**/screenshots/**
          include-hidden-files: true
          if-no-files-found: error
