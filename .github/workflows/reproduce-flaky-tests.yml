# Diagnostic branch only: preserve the real Git service and original 30s limit.
name: Diagnose agent init Git boundary
run-name: Agent init Git boundary at ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  agent_init_git:
    uses: ./.github/workflows/run-tests.yml
    with:
      testShortName: Cli
      testProjectPath: tests/Aspire.Cli.Tests/Aspire.Cli.Tests.csproj
      os: macos-latest
      ignoreTestFailures: false
      allowZeroTests: false
      extraTestArgs: >-
        --filter-method '*.AgentInitCommand_GlobalScope_InstallsTelemetryHook_ForSelectedDetectedEnvironment'
