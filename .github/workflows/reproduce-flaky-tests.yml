# Diagnostic branch only: one owner-exit fact with watchdog and child coverage.
name: Diagnose terminal owner exit stages
run-name: Terminal owner exit stages at ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  terminal_owner_exit_stages:
    uses: ./.github/workflows/run-tests.yml
    with:
      testShortName: Managed
      testProjectPath: tests/Aspire.Managed.Tests/Aspire.Managed.Tests.csproj
      os: windows-latest
      ignoreTestFailures: false
      allowZeroTests: false
      extraTestArgs: >-
        --filter-method '*.TerminalHostSubcommandStopsWhenOwningAppHostIsGone'
