# Diagnostic branch only: one original and one adjacent fact, no repeat loop.
name: Diagnose terminal control shutdown stages
run-name: Terminal control stages at ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  terminal_control_stages:
    uses: ./.github/workflows/run-tests.yml
    with:
      testShortName: Managed
      testProjectPath: tests/Aspire.Managed.Tests/Aspire.Managed.Tests.csproj
      os: windows-latest
      ignoreTestFailures: false
      allowZeroTests: false
      extraTestArgs: >-
        --filter-method '*.TerminalHostControlShutdownUnlinksSockets'
        --filter-method '*.TerminalHostSubcommandStopsWhenOwningAppHostIsGone'
