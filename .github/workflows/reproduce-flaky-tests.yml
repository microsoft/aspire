# Qualification branch only: regression test without the fixture fix; expected to fail.
name: Qualify DevTunnel monitor disposal (before)
run-name: DevTunnel disposal before at ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  devtunnel_disposal:
    uses: ./.github/workflows/run-tests.yml
    with:
      testShortName: Hosting.DevTunnels
      testProjectPath: tests/Aspire.Hosting.DevTunnels.Tests/Aspire.Hosting.DevTunnels.Tests.csproj
      os: ubuntu-latest
      ignoreTestFailures: false
      allowZeroTests: false
      extraTestArgs: >-
        --filter-method '*.FixtureDisposalStopsMonitorBeforeServicesAreDisposed'
