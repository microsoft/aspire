# Investigation only. Both arms use identical source at the pinned baseline;
# only the excluded arm omits the 26 added process-spawning test cases.
name: Reproduce Flaky Tests

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BASELINE: a0925cab2af4ff649e114a94df0dc61147dba564
  TEST_PROJECT_PATH: tests/Aspire.Cli.Tests/Aspire.Cli.Tests.csproj
  ITERATIONS_PER_RUNNER: "2"
  ITERATION_TIMEOUT_SECONDS: "900"
  DOTNET_ROOT: ${{ github.workspace }}/.dotnet
  NUGET_PACKAGES: ${{ github.workspace }}/.packages
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: netaspireci.azurecr.io
  MSBUILDTERMINALLOGGER: "false"
  NO_COLOR: "1"
  RunQuarantinedTests: "false"
  RunOuterloopTests: "false"
  SkipDefaultTestFilters: "false"
  EXCLUDED_METHODS: |
    ConfiguredGitSources_RealGitCheckoutRendersSelectedTemplate
    ConfiguredGitSourceObjects_RealGitRefsRenderOnlySelectedSubdirectory
    ValidateRepositoryPathRejectsLogicalEscapeRegardlessOfWorkingDirectory
    ListStartup_PreservesGlobalAndProjectConfigurationBytes
    RejectedCommand_PreservesGlobalAndProjectConfigurationBytes
    SuccessfulCommand_NormalizesOnlyTheUpdatedGlobalFile
    NormalStartup_MigratesBeforeSourceManagement
    SourceListing_RejectsLegacyConfigurationWithoutAttemptingMigration
    SourceCommands_RejectLegacyConfigurationWithoutWaitingForMutationLock
    NormalStartup_WaitsForGlobalLockAndRechecksBothFiles
    ConfigSet_MigratesBeforeEditingNonTemplateGlobalSettings
    ConfigDelete_MigratesBeforeEditingGlobalSettings
    ConfigSet_AppHostPathPreservesFlattenedLegacyFeatureSettings
    NormalStartup_MalformedLegacyGlobalConfigurationAllowsRecovery

jobs:
  reproduce:
    name: "${{ matrix.arm }} / macOS ARM64 / runner ${{ matrix.index }}"
    if: ${{ github.repository == 'microsoft/aspire' }}
    runs-on: macos-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        arm: [included, excluded]
        index: [1, 2, 3]
    env:
      COMPARISON_ARM: ${{ matrix.arm }}
      RUNNER_INDEX: ${{ matrix.index }}
    steps:
      - name: Checkout experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify unchanged baseline and architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p comparison
          git rev-parse HEAD | tee comparison/experiment-sha.txt
          test "$(git merge-base "$BASELINE" HEAD)" = "$BASELINE"
          test "$(git diff --name-only "$BASELINE" HEAD)" = ".github/workflows/reproduce-flaky-tests.yml"
          test "$(uname -m)" = "arm64"
          uname -a | tee comparison/platform.txt
          sw_vers | tee -a comparison/platform.txt
          env | sort | grep -E '^(Image|RUNNER_|DOTNET_|RunQuarantinedTests|RunOuterloopTests|SkipDefaultTestFilters|MSBUILDTERMINALLOGGER|NUGET_PACKAGES|TESTCONTAINERS_)' \
            > comparison/environment.txt
          echo "${{ github.workspace }}/.dotnet" >> "$GITHUB_PATH"

      - name: Unlock macOS keychain
        uses: ./.github/actions/unlock-macos-keychain

      - name: Restore and build identical test project
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh -restore -ci -build \
            -projects "$PWD/$TEST_PROJECT_PATH" \
            /p:InstallBrowsersForPlaywright=false \
            2>&1 | tee comparison/build.log
          ./dotnet.sh --info | tee comparison/dotnet-info.txt
          ./dotnet.sh --list-sdks | tee comparison/sdks.txt
          ./dotnet.sh --list-runtimes | tee comparison/runtimes.txt
          ./dotnet.sh msbuild "$TEST_PROJECT_PATH" \
            -getProperty:TestRunnerAdditionalArguments \
            > comparison/effective-test-arguments.txt
          cat comparison/effective-test-arguments.txt

      - name: Discover and execute controlled full-suite trials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import shlex
          import signal
          import subprocess
          import sys
          import time
          import xml.etree.ElementTree as ET

          root = pathlib.Path("comparison").resolve()
          arm = os.environ["COMPARISON_ARM"]
          methods = os.environ["EXCLUDED_METHODS"].split()
          excluded = [arg for method in methods for arg in ("--filter-not-method", "*." + method)]
          traits = [arg for trait in ("category=failing", "quarantined=true", "outerloop=true")
                    for arg in ("--filter-not-trait", trait)]
          base = ["./dotnet.sh", "test", "--project", os.environ["TEST_PROJECT_PATH"],
                  "--no-launch-profile", "--no-restore", "--no-build", "--"]
          timeout = int(os.environ["ITERATION_TIMEOUT_SECONDS"])
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}

          def process_table():
              output = subprocess.check_output(
                  ["ps", "-axo", "pid=,ppid=,lstart="], text=True)
              result = {}
              for line in output.splitlines():
                  parts = line.split(None, 2)
                  if len(parts) == 3:
                      result[int(parts[0])] = (int(parts[1]), parts[2])
              return result

          def refresh_descendants(tracked):
              table = process_table()
              changed = True
              while changed:
                  changed = False
                  for pid, (parent, started) in table.items():
                      if (parent in tracked and pid not in tracked
                              and table.get(parent, (None, None))[1] == tracked[parent]):
                          tracked[pid] = started
                          changed = True
              return table

          def terminate_tracked(tracked, directory):
              # Track descendants while their parent is alive, including detached
              # children; verify start times before signaling to avoid PID reuse.
              events = []
              for sig in (signal.SIGTERM, signal.SIGKILL):
                  table = refresh_descendants(tracked)
                  for pid, started in reversed(list(tracked.items())):
                      if pid in table and table[pid][1] == started:
                          try:
                              os.kill(pid, sig)
                              events.append({"pid": pid, "signal": sig.name})
                          except ProcessLookupError:
                              pass
                  if events and sig == signal.SIGTERM:
                      time.sleep(5)
              (directory / "cleanup.json").write_text(json.dumps(events, indent=2))

          def execute(command, directory, seconds):
              directory.mkdir(parents=True, exist_ok=True)
              (directory / "command.txt").write_text(shlex.join(command) + "\n")
              env = dict(os.environ, ASPIRE__TEST__DCPLOGBASEPATH=str(directory / "dcp"))
              started = time.monotonic()
              timed_out = False
              tracked = {}
              with (directory / "console.log").open("w") as log:
                  process = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT,
                                             env=env, start_new_session=True)
                  table = process_table()
                  if process.pid in table:
                      tracked[process.pid] = table[process.pid][1]
                  with (directory / "console.log").open() as reader:
                      try:
                          while process.poll() is None:
                              refresh_descendants(tracked)
                              chunk = reader.read()
                              if chunk:
                                  print(chunk, end="", flush=True)
                              if time.monotonic() - started >= seconds:
                                  timed_out = True
                                  print(f"::error::External {seconds}s deadline: {directory.name}", flush=True)
                                  break
                              time.sleep(1)
                      finally:
                          terminate_tracked(tracked, directory)
                      process.wait(timeout=30)
                      print(reader.read(), end="", flush=True)
              return {"exit_code": process.returncode, "timed_out": timed_out,
                      "elapsed_seconds": round(time.monotonic() - started, 2)}

          # Listing does not launch test bodies. Save both selections on every
          # runner to check the actual discovered case delta without a class filter.
          discoveries = {}
          for selection, filters in (("included", []), ("excluded", excluded)):
              directory = root / ("discovery-" + selection)
              result = execute(base + traits + filters + ["--list-tests"], directory, 180)
              discoveries[selection] = result
              if result["exit_code"] != 0 or result["timed_out"]:
                  (root / "discovery-status.json").write_text(json.dumps(discoveries, indent=2))
                  raise RuntimeError("Discovery failed; no full-suite trials executed")
          included_lines = (root / "discovery-included/console.log").read_text().splitlines()
          excluded_lines = (root / "discovery-excluded/console.log").read_text().splitlines()
          pattern = re.compile(r"\b(" + "|".join(re.escape(m) for m in methods) + r")\b")
          removed = [line for line in included_lines if pattern.search(line)]
          remaining = [line for line in excluded_lines if pattern.search(line)]
          discoveries["excluded_case_count"] = len(removed)
          discoveries["remaining_excluded_cases"] = remaining
          discoveries["removed_cases"] = removed
          parser = "ListDetection_UsesCommandPathAndGlobalOptionArity"
          discoveries["parser_cases_included"] = sum(parser in line for line in included_lines)
          discoveries["parser_cases_excluded"] = sum(parser in line for line in excluded_lines)
          (root / "discovery-status.json").write_text(json.dumps(discoveries, indent=2))
          if len(removed) != 26 or remaining:
              raise RuntimeError(f"Expected exactly 26 excluded cases; discovered {len(removed)}")
          if discoveries["parser_cases_included"] != 9 or discoveries["parser_cases_excluded"] != 9:
              raise RuntimeError("Expected all nine parser-only cases to remain in both arms")

          results = []
          for iteration in range(1, int(os.environ["ITERATIONS_PER_RUNNER"]) + 1):
              directory = root / f"iteration-{iteration}"
              command = base + traits + (excluded if arm == "excluded" else []) + [
                  "--results-directory", str(directory), "--report-trx",
                  "--report-trx-filename", "results.trx"]
              print(f"::group::{arm} runner {os.environ['RUNNER_INDEX']} iteration {iteration}", flush=True)
              result = execute(command, directory, timeout)
              result.update(arm=arm, runner=os.environ["RUNNER_INDEX"], iteration=iteration)
              trx = list(directory.rglob("*.trx"))
              result["trx_files"] = [str(path.relative_to(root)) for path in trx]
              result["counters"] = []
              result["failed_tests"] = []
              result["trx_errors"] = []
              for path in trx:
                  try:
                      tree = ET.parse(path)
                  except ET.ParseError as error:
                      result["trx_errors"].append({"file": str(path), "error": str(error)})
                      continue
                  counters = tree.find(".//t:Counters", ns)
                  if counters is not None:
                      result["counters"].append(dict(counters.attrib))
                  result["failed_tests"].extend(
                      dict(test.attrib) for test in tree.findall(".//t:UnitTestResult", ns)
                      if test.get("outcome") == "Failed")
              total = sum(int(c.get("total", 0)) for c in result["counters"])
              executed = sum(int(c.get("executed", 0)) for c in result["counters"])
              result["zero_tests_or_missing_trx"] = executed == 0
              failed = sum(int(c.get("failed", 0)) for c in result["counters"])
              result["passed"] = (result["exit_code"] == 0 and not result["timed_out"]
                                  and total > 0 and executed > 0 and failed == 0 and not result["trx_errors"])
              (directory / "status.json").write_text(json.dumps(result, indent=2))
              results.append(result)
              (root / "results.json").write_text(json.dumps(results, indent=2))
              print(json.dumps(result, indent=2), flush=True)
              print("::endgroup::", flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## {arm}, runner {os.environ['RUNNER_INDEX']}\n\n")
              summary.write("| Iteration | Passed | Timeout | Exit | TRX counts |\n|---|---|---|---|---|\n")
              for result in results:
                  summary.write(f"| {result['iteration']} | {result['passed']} | "
                                f"{result['timed_out']} | {result['exit_code']} | "
                                f"{json.dumps(result['counters'])} |\n")
          sys.exit(0 if all(result["passed"] for result in results) else 1)
          PY

      - name: Preserve every trial and build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comparison-${{ matrix.arm }}-runner-${{ matrix.index }}
          path: |
            comparison/
            artifacts/log/
          if-no-files-found: error
          retention-days: 30
