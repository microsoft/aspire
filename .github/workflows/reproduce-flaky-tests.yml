# TEMPORARY investigation for #20103. DO NOT MERGE.
# Dispatch this existing workflow from the investigation branch only. The tested
# checkout and all four build artifacts are pinned to the original failing push.
# Product code, test assertions, timeouts, skips, and retries remain unchanged.
name: Reproduce Flaky Tests

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: issue-20103-repro-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '35383851199'
  TESTED_SOURCE_SHA: '95a720c0f40cec0e967fa7a08cd5f17b012da095'
  EXPECTED_DCP_COMMIT: 'b9830ac8d11bd85d866ccbaf65783462f6f25742'
  ITERATIONS_PER_RUNNER: '10'
  NPM_REGISTRY: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-npm/npm/registry/
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

defaults:
  run:
    shell: pwsh

jobs:
  verify_source:
    name: Verify historical source and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate provenance
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:GITHUB_REF -ne 'refs/heads/ellahathaway-vs-code-e2e-flakiness-269') {
            throw 'Temporary investigation workflow must not run on another branch.'
          }
          New-Item -ItemType Directory -Path provenance | Out-Null
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID" | ConvertFrom-Json
          if ($run.event -ne 'push' -or $run.head_branch -ne 'main' -or
              $run.head_sha -cne $env:TESTED_SOURCE_SHA -or $run.run_attempt -ne 1 -or
              $run.status -ne 'completed') {
            throw 'Source run does not match the pinned original main push.'
          }
          $pages = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID/artifacts?per_page=100" | ConvertFrom-Json
          $artifacts = @($pages | ForEach-Object { $_.artifacts })
          $expected = [ordered]@{
            'aspire-extension' = [long]10563691425
            'cli-native-archives-win-x64' = [long]10563941021
            'built-nugets' = [long]10563680586
            'built-nugets-for-win-x64' = [long]10563461815
          }
          $selected = foreach ($name in $expected.Keys) {
            $found = @($artifacts | Where-Object name -CEQ $name)
            if ($found.Count -ne 1 -or $found[0].id -ne $expected[$name] -or
                $found[0].expired -or $found[0].size_in_bytes -le 0 -or
                $found[0].workflow_run.id -ne [long]$env:SOURCE_RUN_ID -or
                $found[0].workflow_run.head_sha -cne $env:TESTED_SOURCE_SHA) {
              throw "Artifact '$name' is missing, expired, ambiguous, or from another revision. Do not substitute another build."
            }
            $found[0]
          }
          [ordered]@{
            workflowSha = $env:WORKFLOW_SHA
            testedSourceSha = $env:TESTED_SOURCE_SHA
            sourceRunId = $env:SOURCE_RUN_ID
            sourceEvent = $run.event
            sourceAttempt = $run.run_attempt
            artifacts = @($selected)
          } | ConvertTo-Json -Depth 10 | Set-Content provenance/source.json -Encoding utf8
          Write-Host "Verified source $env:TESTED_SOURCE_SHA and all four immutable artifacts."

      - name: Upload provenance
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tree-actions-repro-provenance-attempt${{ github.run_attempt }}
          path: provenance
          if-no-files-found: error

  reproduce:
    name: Windows x64 tree-actions runner ${{ matrix.index }}
    needs: verify_source
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3]
    env:
      REPRO_RUNNER_INDEX: ${{ matrix.index }}
      WORKFLOW_SHA: ${{ github.sha }}
      ASPIRE_EXTENSION_E2E_SHARD: tree-actions
      ASPIRE_EXTENSION_E2E_SPEC: out/test-e2e/test-e2e/treeActions.e2e.test.js
      ASPIRE_EXTENSION_E2E_SKIP_CURRENT_CLI_REGRESSIONS: 'false'
      ASPIRE_EXTENSION_E2E_RECORDING_MODE: 'off'
    steps:
      - name: Checkout immutable tested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TESTED_SOURCE_SHA }}
          persist-credentials: false

      - name: Initialize evidence directory
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -cne $env:TESTED_SOURCE_SHA -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'The tested commit or runner architecture is wrong.'
          }
          $root = Join-Path $env:GITHUB_WORKSPACE "repro-results/runner-$env:REPRO_RUNNER_INDEX"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          "REPRO_RESULTS_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{
            workflowSha = $env:WORKFLOW_SHA
            testedSourceSha = $sha
            sourceRunId = $env:SOURCE_RUN_ID
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            runnerIndex = $env:REPRO_RUNNER_INDEX
            runnerArchitecture = $env:RUNNER_ARCH
            imageOS = $env:ImageOS
            imageVersion = $env:ImageVersion
          } | ConvertTo-Json | Set-Content (Join-Path $root environment.json) -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.x'

      - name: Install pinned Corepack
        working-directory: extension
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:COREPACK_HOME = Join-Path $env:RUNNER_TEMP 'corepack'
          "COREPACK_HOME=$env:COREPACK_HOME" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $version = (Get-Content scripts/corepack-version.txt -Raw).Trim()
          npm install --global --force --registry "$env:NPM_REGISTRY" "corepack@$version"
          $npmGlobalBin = (npm prefix --global).Trim()
          $env:PATH = "$npmGlobalBin$([IO.Path]::PathSeparator)$env:PATH"
          $npmGlobalBin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          if ((corepack --version).Trim() -ne $version) { throw 'Corepack version mismatch.' }
          corepack enable
          node scripts/prepareCorepackYarn.mjs
          corepack yarn --version

      - name: Setup baseline .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Download E2E-enabled VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '10563691425'
          path: extension/out
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download original Windows x64 CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '10563941021'
          path: artifacts/cli-archive
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download original NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '10563680586'
          path: artifacts/nugets
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download original Windows x64 NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '10563461815'
          path: artifacts/nugets-rid
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Install locked extension dependencies
        working-directory: extension
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/validate-lockfile-registry.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            corepack yarn install --frozen-lockfile --non-interactive
            if ($LASTEXITCODE -eq 0) { exit 0 }
            $code = $LASTEXITCODE
            if ($attempt -eq 3) { throw "Dependency installation failed with exit $code." }
            Start-Sleep -Seconds ($attempt * 30)
          }

      - name: Prepare and verify original CLI, DCP, and package hive
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $archives = @(Get-ChildItem artifacts/cli-archive -Recurse -File -Filter 'aspire-cli-win-x64*.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one Windows x64 CLI archive.' }
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'artifacts/bundle/win-x64'
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $bundle
          $clis = @(Get-ChildItem $bundle -Recurse -File -Filter aspire.exe)
          if ($clis.Count -ne 1) { throw 'Expected exactly one CLI executable.' }
          $cli = $clis[0].FullName
          & $cli setup
          $installRoot = Split-Path (Split-Path $cli -Parent) -Parent
          $dcps = @(Get-ChildItem $installRoot -Recurse -File -Filter dcp.exe)
          if ($dcps.Count -ne 1) { throw 'CLI setup did not produce exactly one DCP executable.' }
          $dcpVersion = & $dcps[0].FullName version | ConvertFrom-Json
          if ($dcpVersion.version -ne '0.26.2' -or $dcpVersion.commitHash -cne $env:EXPECTED_DCP_COMMIT) {
            throw 'DCP does not match the failing baseline.'
          }
          $cliVersion = (& $cli --version | Out-String).Trim()
          if ($cliVersion -cne '13.6.0-ci') { throw "Unexpected baseline CLI version: $cliVersion" }
          $shipping = Join-Path $env:GITHUB_WORKSPACE 'artifacts/nugets'
          $appHostPackages = @(Get-ChildItem $shipping -Recurse -File -Filter 'Aspire.Hosting.AppHost.13.6.0-ci.nupkg')
          if ($appHostPackages.Count -ne 1) { throw 'The original AppHost package is missing or ambiguous.' }
          $hive = Join-Path $HOME '.aspire/hives/daily/packages'
          New-Item -ItemType Directory -Path $hive -Force | Out-Null
          Get-ChildItem $shipping -Recurse -File -Filter '*.nupkg' | Copy-Item -Destination $hive -Force
          $ridPackages = @(Get-ChildItem artifacts/nugets-rid -Recurse -File -Filter '*.nupkg')
          if ($ridPackages.Count -eq 0) { throw 'RID-specific NuGet packages are missing.' }
          $ridPackages | Copy-Item -Destination $hive -Force
          $vsixes = @(Get-ChildItem extension/out -Recurse -File -Filter '*.vsix')
          if ($vsixes.Count -ne 1) { throw 'Expected the single E2E-enabled VSIX artifact.' }
          @(
            "ASPIRE_DCP_PATH=$($dcps[0].Directory.FullName)"
            "ASPIRE_CLI_PACKAGES=$hive"
            "ASPIRE_EXTENSION_E2E_CLI_PATH=$cli"
            'ASPIRE_EXTENSION_E2E_APPHOST_SDK_VERSION=13.6.0-ci'
            "ASPIRE_EXTENSION_E2E_VSIX=$($vsixes[0].FullName)"
          ) | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{
            cliVersion = $cliVersion
            dcp = $dcpVersion
            sdkVersion = (dotnet --version | Out-String).Trim()
            nodeVersion = (node --version | Out-String).Trim()
            appHostPackage = $appHostPackages[0].Name
            vsixName = $vsixes[0].Name
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:REPRO_RESULTS_ROOT versions.json) -Encoding utf8

      - name: Compile unchanged E2E tests
        working-directory: extension
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack yarn compile
          corepack yarn compile-e2e
          if (-not (Test-Path -LiteralPath $env:ASPIRE_EXTENSION_E2E_SPEC)) { throw 'Compiled tree-actions spec is missing.' }
          git diff --exit-code $env:TESTED_SOURCE_SHA -- src/test-e2e src/testing scripts/run-e2e.js .mocharc.e2e.js package.json yarn.lock

      - name: Run and preserve ten complete shard iterations
        id: iterations
        working-directory: extension
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $expected = @(
            'Aspire tree action command E2E routes all AppHost actions to the exact secondary AppHost and owning CLI target'
            'Aspire tree action command E2E uses the legacy pipeline input fallback for trimmed, invalid, and canceled input'
            'Aspire tree action command E2E lets the current CLI select and execute run and debug pipeline steps with exact final args'
            'Aspire tree action command E2E does not duplicate an AppHost launch while the same AppHost is reserved'
            'Aspire tree action command E2E keeps one durable operation per AppHost while a deploy session is in flight'
            'Aspire tree action command E2E routes view, copy, endpoint, log, and resource commands through tree handlers'
          )
          function Protect-RunnerLog([string]$text) {
            # Match the unchanged harness's redaction for this wrapper-owned log.
            # Examples: /login?t=<token>, JSON "token":"...", and RPC setup tokens.
            $text = $text -replace '(?i)/login\?t=[^"''\s<>\\)]+', '/login?t=<redacted>'
            $text = $text -replace '(?i)([?&]t=)[^"''\s<>\\)&]+', '$1<redacted>'
            $text = $text -replace '(?i)(Setting up RPC server with token: )[^\r\n]+', '$1<redacted>'
            return $text -replace '(?i)(token["'']?\s*[:=]\s*["'']?)[A-Za-z0-9+/=._-]{16,}', '$1<redacted>'
          }
          function Get-IterationOutcome($mocha, $exitCode, $logs, $nativePresent, $evidenceSafe, $cleanupSafe) {
            if (-not $evidenceSafe) { return 'evidence-failure' }
            if ($null -eq $mocha) { return 'no-mocha' }
            foreach ($field in @('tests', 'passes', 'failures', 'pending')) {
              if ($null -eq $mocha.$field -or $null -eq $mocha.stats.$field) { return 'invalid-mocha' }
              if (@($mocha.$field).Count -ne $mocha.stats.$field) { return 'invalid-mocha' }
            }
            # The reporter emits fullTitle/currentRetry for each completed test and
            # err.message for a failing test or hook; hooks may abort the suite early.
            $targetFailure = @($mocha.failures | Where-Object {
              $_.fullTitle -ceq $expected[-1] -and
              $_.err.message -match 'Timed out after 10000ms waiting for E2E control revision'
            }).Count -gt 0
            if ($targetFailure -and $logs -match "restart.*exited with code 16" -and
                $logs -match 'Failed to stop process tree' -and $logs -match 'context deadline exceeded') {
              return 'matching-restart-signature'
            }
            if ($mocha.stats.failures -gt 0) { return 'test-or-hook-failure' }
            if ($exitCode -ne 0) { return 'runner-failure' }
            $titles = @($mocha.passes | ForEach-Object fullTitle)
            $executed = @($mocha.tests | ForEach-Object fullTitle)
            if (-not $mocha.stats.end -or $mocha.stats.tests -ne 6 -or $mocha.stats.passes -ne 6 -or
                $mocha.stats.pending -ne 0 -or @($titles | Select-Object -Unique).Count -ne 6 -or
                @($executed | Select-Object -Unique).Count -ne 6 -or
                @(Compare-Object $expected $titles -CaseSensitive).Count -ne 0 -or
                @(Compare-Object $expected $executed -CaseSensitive).Count -ne 0 -or
                @($mocha.tests | Where-Object { $null -eq $_.currentRetry -or $_.currentRetry -ne 0 }).Count -gt 0) {
              return 'incomplete-or-retried-suite'
            }
            if (-not $nativePresent) { return 'missing-native-diagnostics' }
            if (-not $cleanupSafe) { return 'cleanup-failure' }
            return 'passed'
          }
          function Assert-Outcome($actual, $expectedOutcome) {
            if ($actual -cne $expectedOutcome) { throw "Result parser expected '$expectedOutcome', got '$actual'." }
          }
          $cases = @($expected | ForEach-Object { [pscustomobject]@{ fullTitle = $_; currentRetry = 0 } })
          $good = [pscustomobject]@{
            stats = [pscustomobject]@{ tests = 6; passes = 6; failures = 0; pending = 0; end = 'complete' }
            tests = $cases; passes = $cases; failures = @(); pending = @()
          }
          Assert-Outcome (Get-IterationOutcome $good 0 '' $true $true $true) 'passed'
          Assert-Outcome (Get-IterationOutcome $null 1 '' $false $true $true) 'no-mocha'
          Assert-Outcome (Get-IterationOutcome $good 0 '' $false $true $true) 'missing-native-diagnostics'
          Assert-Outcome (Get-IterationOutcome $good 0 '' $true $false $true) 'evidence-failure'
          Assert-Outcome (Get-IterationOutcome $good 0 '' $true $true $false) 'cleanup-failure'
          $failure = $good | ConvertTo-Json -Depth 10 | ConvertFrom-Json
          $failure.passes = @($failure.passes | Select-Object -First 5)
          $failure.stats.passes = 5
          $failure.stats.failures = 1
          $failure.failures = @([pscustomobject]@{
            fullTitle = $expected[-1]
            err = [pscustomobject]@{ message = 'Timed out after 10000ms waiting for E2E control revision 123.' }
          })
          $signature = "Command 'restart' exited with code 16. Failed to stop process tree: context deadline exceeded."
          Assert-Outcome (Get-IterationOutcome $failure 1 $signature $true $true $true) 'matching-restart-signature'
          $failure.failures[0].fullTitle = 'An unrelated after each hook'
          Assert-Outcome (Get-IterationOutcome $failure 1 $signature $true $true $true) 'test-or-hook-failure'
          $incomplete = $good | ConvertTo-Json -Depth 10 | ConvertFrom-Json
          $incomplete.tests = @($incomplete.tests | Select-Object -First 5)
          $incomplete.stats.tests = 5
          Assert-Outcome (Get-IterationOutcome $incomplete 0 '' $true $true $true) 'incomplete-or-retried-suite'
          Assert-Outcome (Protect-RunnerLog 'http://localhost/login?t=abcdef1234567890') 'http://localhost/login?t=<redacted>'
          Assert-Outcome (Protect-RunnerLog '{"token":"abcdef1234567890"}') '{"token":"<redacted>"}'
          Write-Host 'Eight result-accounting and two redaction checks passed; no E2E invocations used.'

          $diagnostics = @('.test-results', '.test-storage', '.test-workspaces', '.test-recordings')
          $canContinue = $true
          for ($iteration = 1; $iteration -le [int]$env:ITERATIONS_PER_RUNNER; $iteration++) {
            $destination = Join-Path $env:REPRO_RESULTS_ROOT ('iteration-{0:d2}' -f $iteration)
            New-Item -ItemType Directory -Path $destination | Out-Null
            $resultPath = Join-Path $destination result.json
            $logPath = Join-Path $destination runner.log
            $result = [ordered]@{
              iteration = $iteration; sourceSha = $env:TESTED_SOURCE_SHA
              startedUtc = [DateTime]::UtcNow.ToString('o'); finishedUtc = $null
              outcome = 'not-run'; runnerExitCode = $null; stats = $null
              nativeLogCount = 0; errors = @()
            }
            $result | ConvertTo-Json -Depth 10 | Set-Content $resultPath -Encoding utf8
            if (-not $canContinue) {
              $result.outcome = 'not-run-after-unsafe-cleanup-or-archive'
              $result.finishedUtc = [DateTime]::UtcNow.ToString('o')
              $result | ConvertTo-Json -Depth 10 | Set-Content $resultPath -Encoding utf8
              continue
            }
            Write-Host "::group::Tree-actions iteration $iteration/$env:ITERATIONS_PER_RUNNER"
            $evidenceSafe = $true
            $cleanupSafe = $true
            $mocha = $null
            try {
              if (Test-Path '.test-results/e2e/tree-actions/mocha.json') {
                throw 'Unarchived results exist; refusing to let the harness overwrite evidence.'
              }
              # This folder is under the unchanged runner's redacted results tree.
              # Archive it before prepareRunDirectories clears that tree next time.
              $env:DCP_DIAGNOSTICS_LOG_LEVEL = 'debug'
              $env:DCP_DIAGNOSTICS_LOG_FOLDER = Join-Path (Get-Location) '.test-results/e2e/tree-actions/native-dcp'
              $result.outcome = 'running'
              $result | ConvertTo-Json -Depth 10 | Set-Content $resultPath -Encoding utf8
              node scripts/run-e2e.js *> $logPath
              $result.runnerExitCode = $LASTEXITCODE
              $result | ConvertTo-Json -Depth 10 | Set-Content $resultPath -Encoding utf8
            }
            catch {
              $result.errors += ($_ | Out-String)
              $canContinue = $false
            }
            if (Test-Path -LiteralPath $logPath) {
              $output = Get-Content -LiteralPath $logPath -Raw
              $redacted = Protect-RunnerLog $output
              if ($redacted -cne $output) {
                Set-Content -LiteralPath $logPath -Value $redacted -NoNewline -Encoding utf8
              }
              if ($output -match 'One or more E2E cleanup steps failed:|Failed to stop Aspire E2E AppHost during cleanup:|Aspire E2E AppHost cleanup exited with code|Warning: unable to remove locked E2E path') {
                $cleanupSafe = $false
                $canContinue = $false
              }
              Write-Host "Runner exit: $($result.runnerExitCode). Full output is retained in the iteration artifact."
            }
            foreach ($relative in $diagnostics) {
              try {
                if (Test-Path -LiteralPath $relative) {
                  $archive = Join-Path $destination "extension/$relative"
                  New-Item -ItemType Directory -Path (Split-Path $archive -Parent) -Force | Out-Null
                  Move-Item -LiteralPath $relative -Destination $archive
                }
              }
              catch {
                $evidenceSafe = $false
                $canContinue = $false
                $result.errors += "Archive $relative failed: $($_ | Out-String)"
              }
            }
            try {
              $mochaPath = Join-Path $destination 'extension/.test-results/e2e/tree-actions/mocha.json'
              if (Test-Path -LiteralPath $mochaPath) {
                $mocha = Get-Content -LiteralPath $mochaPath -Raw | ConvertFrom-Json
                $result.stats = $mocha.stats
              }
              $nativeDirectory = Join-Path $destination 'extension/.test-results/e2e/tree-actions/native-dcp'
              if (Test-Path -LiteralPath $nativeDirectory) {
                $result.nativeLogCount = @(Get-ChildItem $nativeDirectory -Recurse -File -Filter '*.log').Count
              }
              $logs = @(Get-ChildItem $destination -Recurse -File -Filter '*.log')
              $signatureText = if ($logs.Count -gt 0) {
                ($logs | Select-String -Pattern 'restart.*exited with code 16|Failed to stop process tree|context deadline exceeded' | ForEach-Object Line) -join "`n"
              } else { '' }
              $result.outcome = Get-IterationOutcome $mocha $result.runnerExitCode $signatureText ($result.nativeLogCount -gt 0) $evidenceSafe $cleanupSafe
              if ($result.outcome -in @('no-mocha', 'invalid-mocha', 'missing-native-diagnostics') -or $result.nativeLogCount -eq 0) {
                # More attempts cannot diagnose the native stall without its logs.
                $canContinue = $false
              }
            }
            catch {
              $result.outcome = 'diagnostic-or-result-parse-failure'
              $result.errors += ($_ | Out-String)
              $canContinue = $false
            }
            $result.finishedUtc = [DateTime]::UtcNow.ToString('o')
            $result | ConvertTo-Json -Depth 10 | Set-Content $resultPath -Encoding utf8
            Write-Host ($result | ConvertTo-Json -Depth 10)
            Write-Host '::endgroup::'
          }
          # Test failures are persisted data here, not suppressed successes.
          # The following always-run summary and final aggregation enforce failure.
          exit 0

      - name: Write runner summary
        if: always()
        env:
          ITERATION_STEP_OUTCOME: ${{ steps.iterations.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE "repro-results/runner-$env:REPRO_RUNNER_INDEX"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $results = @(foreach ($i in 1..([int]$env:ITERATIONS_PER_RUNNER)) {
            $file = Join-Path $root ('iteration-{0:d2}/result.json' -f $i)
            if (Test-Path -LiteralPath $file) {
              Get-Content $file -Raw | ConvertFrom-Json
            } else {
              [pscustomobject]@{ iteration = $i; outcome = 'not-run-setup-or-interruption'; runnerExitCode = $null }
            }
          })
          [ordered]@{
            runnerIndex = [int]$env:REPRO_RUNNER_INDEX
            workflowSha = $env:WORKFLOW_SHA
            sourceRunId = $env:SOURCE_RUN_ID
            sourceSha = $env:TESTED_SOURCE_SHA
            iterationStepOutcome = $env:ITERATION_STEP_OUTCOME
            iterations = $results
          } | ConvertTo-Json -Depth 15 | Set-Content (Join-Path $root summary.json) -Encoding utf8
          $results | Select-Object iteration,outcome,runnerExitCode,nativeLogCount | Format-Table
          if ($env:ITERATION_STEP_OUTCOME -ne 'success' -or @($results | Where-Object outcome -NE 'passed').Count -gt 0) {
            throw 'At least one requested iteration did not pass completely; inspect its preserved evidence.'
          }

      - name: Upload every iteration and any unarchived evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tree-actions-repro-runner-${{ matrix.index }}-attempt${{ github.run_attempt }}
          path: |
            repro-results/
            extension/.test-results/
            extension/.test-storage/
            extension/.test-workspaces/
            extension/.test-recordings/
          include-hidden-files: true
          if-no-files-found: error

  results:
    name: Account for all 30 requested invocations
    needs: [verify_source, reproduce]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download runner evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tree-actions-repro-runner-*-attempt${{ github.run_attempt }}
          path: evidence
          merge-multiple: false

      - name: Aggregate exact runner and iteration identities
        if: always()
        env:
          SOURCE_RESULT: ${{ needs.verify_source.result }}
          REPRODUCE_RESULT: ${{ needs.reproduce.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          $summaries = if (Test-Path evidence) {
            @(Get-ChildItem evidence -Recurse -File -Filter summary.json | Where-Object {
              $_.Directory.Name -cmatch '^runner-[123]$'
            } | ForEach-Object {
              Get-Content $_.FullName -Raw | ConvertFrom-Json
            })
          } else { @() }
          $rows = @(foreach ($runner in 1..3) {
            $matching = @($summaries | Where-Object runnerIndex -EQ $runner)
            foreach ($iteration in 1..10) {
              $outcome = 'missing-or-invalid-runner-evidence'
              if ($matching.Count -eq 1 -and $matching[0].sourceSha -ceq $env:TESTED_SOURCE_SHA -and
                  $matching[0].sourceRunId -eq $env:SOURCE_RUN_ID -and
                  $matching[0].workflowSha -ceq $env:GITHUB_SHA -and @($matching[0].iterations).Count -eq 10) {
                $items = @($matching[0].iterations | Where-Object iteration -EQ $iteration)
                if ($items.Count -eq 1) { $outcome = $items[0].outcome }
              }
              [pscustomobject]@{ runner = $runner; iteration = $iteration; outcome = $outcome }
            }
          })
          $rows | ConvertTo-Json | Set-Content aggregate.json -Encoding utf8
          $passed = @($rows | Where-Object outcome -EQ 'passed').Count
          $matchingFailures = @($rows | Where-Object outcome -EQ 'matching-restart-signature').Count
          @(
            '# Windows tree-actions historical reproduction'
            "Source: $env:TESTED_SOURCE_SHA; artifacts: run $env:SOURCE_RUN_ID."
            'Requested: 3 Windows x64 runners, 10 full six-test shard invocations each.'
            "Complete passing invocations: $passed/30."
            "Matching restart-signature candidates: $matchingFailures. Correlate native process identity and timing before confirming the root cause."
            'Setup, hook, missing evidence, cancellation, and cleanup failures are not successful executions or confirmed reproductions.'
            'A green batch does not establish that the historical intermittent failure is fixed.'
            ''
            '| Runner | Iteration | Outcome |'
            '|---|---|---|'
            ($rows | ForEach-Object { "| $($_.runner) | $($_.iteration) | $($_.outcome) |" })
          ) | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $rows | Format-Table
          if ($env:SOURCE_RESULT -ne 'success' -or $env:REPRODUCE_RESULT -ne 'success' -or
              $summaries.Count -ne 3 -or $passed -ne 30) {
            throw 'Not all 30 requested invocations passed; preserved evidence distinguishes reproduction from infrastructure failures.'
          }

      - name: Upload aggregate accounting
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tree-actions-repro-accounting-attempt${{ github.run_attempt }}
          path: aggregate.json
          if-no-files-found: error
