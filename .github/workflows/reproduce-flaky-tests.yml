# Qualification branch only: fixture fix plus regression test; full DevTunnels suite as adjacent qualification.
name: Qualify DevTunnel monitor disposal (after)
run-name: DevTunnel disposal after at ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  devtunnel_disposal:
    uses: ./.github/workflows/run-tests.yml
    with:
      testShortName: Hosting.DevTunnels
      testProjectPath: tests/Aspire.Hosting.DevTunnels.Tests/Aspire.Hosting.DevTunnels.Tests.csproj
      os: ubuntu-latest
      ignoreTestFailures: false
      allowZeroTests: false
