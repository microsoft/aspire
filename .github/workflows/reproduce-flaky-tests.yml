# Qualification branch only: fix plus forced-interleaving test; repaired test and offset protocol expected to pass.
name: Qualify SignalingFakeTimeProvider timeout tie (after)
run-name: SignalingFakeTimeProvider tie after at ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  signaling_fake_time_provider:
    uses: ./.github/workflows/run-tests.yml
    with:
      testShortName: Hosting
      testProjectPath: tests/Aspire.Hosting.Tests/Aspire.Hosting.Tests.csproj
      os: windows-latest
      ignoreTestFailures: false
      allowZeroTests: false
      extraTestArgs: >-
        --filter-class '*.SignalingFakeTimeProviderTests'
        --filter-class '*.SignalingFakeTimeProviderInterleavingTests'
