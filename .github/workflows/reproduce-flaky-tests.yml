# TEMPORARY investigation harness for #19921. DO NOT MERGE into the fix PR (#20118).
# Only this workflow differs from 221026c4a730f6c891de65359d594722584f2071.
#
# Applicable setup, action pins, CLI/hive preparation and ExTester invocation are copied
# from .github/workflows/extension-e2e-tests.yml at that revision. The aspire-extension
# artifact is the E2E-bridge-enabled VSIX packaged by extension-unit-tests.yml, not the
# shipping VSIX. No production workflow, test, timeout, skip, or advisory is changed.
# PR CI built the merge, not the head: reproduce from that immutable complete source.
# The copied production setup, Deno action and global.json remain unchanged there.
# The investigation tree stays at the original fix; only the test checkout includes
# the published diagnostics and doctor DCP monitor fix. API base metadata is not the
# tested merge's parent.
#
# Dispatch only after all six pinned source-run artifacts exist:
# gh workflow run reproduce-flaky-tests.yml --repo microsoft/aspire --ref <investigation-branch>
# This file already exists on main, so no merge or additional PR is needed to dispatch it.

name: Reproduce Flaky Tests

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

env:
  INVESTIGATION_BASE_SHA: '221026c4a730f6c891de65359d594722584f2071'
  SOURCE_RUN_ID: '35134725366'
  FIX_HEAD_SHA: 'dc0894f1ce06edc7476ab17f7d2a5bc2c3f73089'
  SOURCE_API_BASE_SHA: '867c9ea4be9454d5e05bd41bf69da0ed07261c9c'
  TESTED_MAIN_PARENT_SHA: '6755259f92a7b1d4107c808aa270583f3f021842'
  TESTED_SOURCE_SHA: 'ebf8b4be54857fa7975ebed3a0f693cb10b0e57f'
  SOURCE_CHECKOUT_JOB_ID: '104928405966'
  ITERATIONS_PER_RUNNER: '3'
  EXPECTED_TESTS: '3'
  NPM_REGISTRY: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-npm/npm/registry/
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

defaults:
  run:
    shell: pwsh

jobs:
  verify_source:
    name: Verify fixed source and cross-run artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout investigation revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Path repro-source | Out-Null
          try {
            git merge-base --is-ancestor $env:INVESTIGATION_BASE_SHA HEAD
            # Compare trees, not a merge-base diff: every tracked byte other than this
            # temporary workflow must still match the original investigation base, not
            # the newer fix head. Test jobs separately pin its complete CI merge.
            git diff --exit-code $env:INVESTIGATION_BASE_SHA HEAD -- . ':(exclude).github/workflows/reproduce-flaky-tests.yml'
            $checkout = (git rev-parse HEAD).Trim()

            $runJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID"
            $runJson | Set-Content repro-source/source-run.json -Encoding utf8
            $run = $runJson | ConvertFrom-Json
            if ($run.head_sha -cne $env:FIX_HEAD_SHA -or $run.path -cne '.github/workflows/ci.yml' -or $run.event -cne 'pull_request' -or
                @($run.pull_requests).Count -ne 1 -or $run.pull_requests[0].number -ne 20118 -or
                $run.pull_requests[0].head.sha -cne $env:FIX_HEAD_SHA -or $run.pull_requests[0].base.sha -cne $env:SOURCE_API_BASE_SHA) {
              throw "Source run $env:SOURCE_RUN_ID is not PR #20118 CI for the pinned head/API base metadata."
            }

            # PR API base.sha remains 867c9ea... although the tested merge's first parent
            # is 6755259.... Validate both independently; never substitute one for the other.
            $commitJson = gh api "repos/$env:GITHUB_REPOSITORY/git/commits/$env:TESTED_SOURCE_SHA"
            $commitJson | Set-Content repro-source/tested-commit.json -Encoding utf8
            $commit = $commitJson | ConvertFrom-Json
            if ($commit.sha -cne $env:TESTED_SOURCE_SHA -or @($commit.parents).Count -ne 2 -or
                $commit.parents[0].sha -cne $env:TESTED_MAIN_PARENT_SHA -or $commit.parents[1].sha -cne $env:FIX_HEAD_SHA) {
              throw 'The tested source is not the expected immutable PR merge.'
            }
            $jobJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/jobs/$env:SOURCE_CHECKOUT_JOB_ID"
            $jobJson | Set-Content repro-source/checkout-job.json -Encoding utf8
            $job = $jobJson | ConvertFrom-Json
            if ($job.run_id -ne [long]$env:SOURCE_RUN_ID -or $job.head_sha -cne $env:FIX_HEAD_SHA -or $job.conclusion -cne 'success') {
              throw 'Checkout proof must come from the successful pinned source-run job.'
            }
            $checkoutLog = gh api "repos/$env:GITHUB_REPOSITORY/actions/jobs/$env:SOURCE_CHECKOUT_JOB_ID/logs" --allow-escape-sequences
            $checkoutLog = ($checkoutLog -join "`n") -replace '\x1b\[[0-?]*[ -/]*[@-~]', ''
            # actions/checkout emits, for example:
            # 2026-09-16T18:42:12Z [command]"...\git.exe" log -1 --format=%H
            # 2026-09-16T18:42:12Z ebf8b4be54857fa7975ebed3a0f693cb10b0e57f
            # Run/artifact head_sha instead names the PR head, so require this checkout proof.
            $proof = [regex]::Match($checkoutLog, '(?m)^.*\blog -1 --format=%H\r?\n[^\r\n]*\b(?<sha>[0-9a-f]{40})\r?$')
            if (-not $proof.Success -or $proof.Groups['sha'].Value -cne $env:TESTED_SOURCE_SHA) {
              throw 'Source job checkout log does not prove the pinned tested merge.'
            }
            $proof.Value | Set-Content repro-source/checkout-proof.log -Encoding utf8

            $inventoryJson = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID/artifacts?per_page=100"
            $inventoryJson | Set-Content repro-source/source-artifacts.json -Encoding utf8
            $artifacts = @($inventoryJson | ConvertFrom-Json | ForEach-Object { $_.artifacts })
            $required = @(
              'aspire-extension'
              'cli-native-archives-linux-x64'
              'cli-native-archives-win-x64'
              'built-nugets'
              'built-nugets-for-linux-x64'
              'built-nugets-for-win-x64'
            )
            $selected = foreach ($name in $required) {
              $matches = @($artifacts | Where-Object { $_.name -ceq $name })
              if ($matches.Count -ne 1 -or $matches[0].expired -or
                  $matches[0].workflow_run.id -ne [long]$env:SOURCE_RUN_ID -or
                  $matches[0].workflow_run.head_sha -cne $env:FIX_HEAD_SHA) {
                throw "Required artifact '$name' is missing, ambiguous, expired, or from a different source revision. No tests were run; do not substitute main or another run."
              }
              $matches[0]
            }
            @{
              investigationCheckout = $checkout
              investigationBaseSha = $env:INVESTIGATION_BASE_SHA
              sourceRunId = $env:SOURCE_RUN_ID
              fixHeadSha = $env:FIX_HEAD_SHA
              sourceApiBaseSha = $env:SOURCE_API_BASE_SHA
              testedMainParentSha = $env:TESTED_MAIN_PARENT_SHA
              testedSourceSha = $env:TESTED_SOURCE_SHA
              checkoutProofJobId = $env:SOURCE_CHECKOUT_JOB_ID
              artifacts = @($selected)
            } | ConvertTo-Json -Depth 20 | Set-Content repro-source/provenance.json -Encoding utf8
            "Verified PR head $env:FIX_HEAD_SHA, actual tested merge $env:TESTED_SOURCE_SHA, and all six artifacts from run $env:SOURCE_RUN_ID." |
              Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
            "API base metadata: $env:SOURCE_API_BASE_SHA; tested merge main parent: $env:TESTED_MAIN_PARENT_SHA; investigation base: $env:INVESTIGATION_BASE_SHA." |
              Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
          catch {
            $_ | Out-String | Set-Content repro-source/provenance-error.log -Encoding utf8
            throw
          }

      - name: Upload provenance
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: launch-profiles-source-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: repro-source/
          if-no-files-found: error

  reproduce:
    name: Launch profiles (${{ matrix.name }}, runner ${{ matrix.index }})
    needs: verify_source
    runs-on: ${{ matrix.runner }}
    # Three unchanged 40-minute ExTester budgets, plus cold acquisition, fixture restore,
    # production setup and diagnostic upload. No outer watchdog or test-timeout override.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
        index: [1, 2, 3]
        include:
          - runner: ubuntu-latest
            name: Linux
            rid: linux-x64
            archivePattern: aspire-cli-linux-x64*.tar.gz
            cliBinary: aspire
            useXvfb: true
          - runner: windows-latest
            name: Windows
            rid: win-x64
            archivePattern: aspire-cli-win-x64*.zip
            cliBinary: aspire.exe
            useXvfb: false
    env:
      # Each invocation refreshes the shard's NuGet cache. Reusable MSBuild workers
      # otherwise retain Aspire.Hosting.Tasks.dll and block the next Windows run.
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: 'false'
      REPRO_RESULTS_ROOT: ${{ github.workspace }}/repro-results/${{ matrix.rid }}-runner-${{ matrix.index }}
      REPRO_RID: ${{ matrix.rid }}
      REPRO_RUNNER_INDEX: ${{ matrix.index }}
      REPRO_USE_XVFB: ${{ matrix.useXvfb }}
      ASPIRE_EXTENSION_E2E_SHARD: launch-profiles
      ASPIRE_EXTENSION_E2E_SPEC: out/test-e2e/test-e2e/launchProfiles.e2e.test.js

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TESTED_SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify tested checkout and unchanged fix and diagnostic files
        id: tested_source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:TESTED_SOURCE_SHA) {
            throw "Expected tested merge $env:TESTED_SOURCE_SHA, checked out $actual."
          }
          $fixFiles = @(
            'extension/src/test-e2e/helpers/processArguments.ts'
            'extension/src/test-e2e/launchProfiles.e2e.test.ts'
            'extension/src/test/launchProfilesFixture.test.ts'
            'extension/src/test/processArguments.test.ts'
            'extension/scripts/get-windows-file-lock-owners.ps1'
            'extension/src/test/windowsFileLockOwners.test.ts'
            'src/Aspire.Cli/Utils/EnvironmentChecker/DcpConnectionChecker.cs'
            'tests/Aspire.Cli.Tests/Utils/DcpConnectionHealthCheckTests.cs'
          )
          # run-e2e.js and e2eLaunchProfile.test.ts include unrelated main-merge edits.
          # Execute their exact tested merge versions rather than asserting head equality.
          git diff --exit-code $env:FIX_HEAD_SHA HEAD -- @fixFiles
          New-Item -ItemType Directory -Path $env:REPRO_RESULTS_ROOT -Force | Out-Null
          @{
            testedCheckout = $actual
            fixHeadSha = $env:FIX_HEAD_SHA
            unchangedFixFiles = $fixFiles
          } | ConvertTo-Json | Set-Content (Join-Path $env:REPRO_RESULTS_ROOT tested-source.json) -Encoding utf8

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.x'

      - name: Install Corepack
        id: corepack
        working-directory: extension
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Keep the production job-local cache and feed seeding; never use Corepack's
          # upstream prepare endpoint or the hosted image's bundled Yarn.
          $CorepackHome = Join-Path $env:RUNNER_TEMP 'corepack'
          $env:COREPACK_HOME = $CorepackHome
          "COREPACK_HOME=$CorepackHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $CorepackVersion = (Get-Content -Raw -Path 'scripts/corepack-version.txt').Trim()
          npm install --global --force --registry "$env:NPM_REGISTRY" "corepack@$CorepackVersion"
          $npmGlobalBin = (npm prefix --global).Trim()
          $env:PATH = "$npmGlobalBin$([IO.Path]::PathSeparator)$env:PATH"
          $npmGlobalBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $installed = (corepack --version).Trim()
          if ($installed -ne $CorepackVersion) {
            throw "corepack version mismatch: expected $CorepackVersion, got '$installed'."
          }
          corepack enable
          node ./scripts/prepareCorepackYarn.mjs
          corepack yarn --version

      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Setup Deno
        id: setup_deno
        uses: ./.github/actions/setup-deno

      - name: Download VSIX
        id: vsix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aspire-extension
          path: extension/out
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download CLI archive
        id: cli_archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-native-archives-${{ matrix.rid }}
          path: artifacts/cli-archive
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download NuGet packages
        id: nugets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-nugets
          path: artifacts/nugets
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download RID-specific NuGet packages
        id: rid_nugets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-nugets-for-${{ matrix.rid }}
          path: artifacts/nugets-rid
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Assert E2E VSIX contains bridge
        id: vsix_bridge
        # The source run packages this with ASPIRE_EXTENSION_E2E_INCLUDE_BRIDGE=true.
        # Do not repackage locally or accidentally install its separate production VSIX.
        run: ./.github/scripts/assert-extension-e2e-bridge-vsix.ps1 -VsixPath extension/out/aspire-extension.vsix -Expected Present

      - name: Validate lockfile registries
        id: lockfile
        working-directory: extension
        run: node scripts/validate-lockfile-registry.cjs

      - name: Install extension dependencies
        id: dependencies
        working-directory: extension
        run: corepack yarn install --frozen-lockfile --non-interactive

      - name: Verify locked ExTester
        id: extester_feed
        working-directory: extension
        # This is the production feed preflight, not one of the test iterations.
        run: node scripts/run-e2e.js --verify-extester-feed

      - name: Prepare Aspire CLI and package hive
        id: prepare_cli
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $archives = @(Get-ChildItem -Path '${{ github.workspace }}/artifacts/cli-archive' -Recurse -File -Filter '${{ matrix.archivePattern }}')
          if ($archives.Count -ne 1) {
            throw "Expected one CLI archive matching ${{ matrix.archivePattern }}, found $($archives.Count)."
          }
          $archive = $archives[0]
          $bundleDir = Join-Path '${{ github.workspace }}' 'artifacts/bundle/${{ matrix.rid }}'
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          if ('${{ runner.os }}' -eq 'Windows') {
            Expand-Archive -Path $archive.FullName -DestinationPath $bundleDir -Force
          } else {
            tar -xzf $archive.FullName -C $bundleDir
          }
          $cli = Get-ChildItem -Path $bundleDir -Recurse -File -Filter '${{ matrix.cliBinary }}' | Select-Object -First 1
          if ($null -eq $cli) {
            throw "Unable to find ${{ matrix.cliBinary }} in extracted CLI archive."
          }
          if ('${{ runner.os }}' -ne 'Windows') {
            chmod +x $cli.FullName
          }
          & $cli.FullName setup
          if ($LASTEXITCODE -ne 0) { throw "aspire setup failed with exit code $LASTEXITCODE." }

          # Setup installs beside the CLI's directory, not necessarily inside $bundleDir.
          # Derive the install root exactly as the production workflow does.
          $cliDir = Split-Path -Path $cli.FullName -Parent
          $installPath = Split-Path -Path $cliDir -Parent
          $dcpExecutable = if ('${{ runner.os }}' -eq 'Windows') { 'dcp.exe' } else { 'dcp' }
          $dcp = Get-ChildItem -Path $installPath -Recurse -File -Filter $dcpExecutable | Select-Object -First 1
          if ($null -eq $dcp) {
            throw "'aspire setup' succeeded but no $dcpExecutable exists under $installPath."
          }
          Write-Host "Orchestration component: $($dcp.FullName)"
          "ASPIRE_DCP_PATH=$($dcp.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $shippingDir = Join-Path '${{ github.workspace }}' 'artifacts/nugets/Debug/Shipping'
          if (-not (Test-Path $shippingDir)) {
            $shippingDir = Join-Path '${{ github.workspace }}' 'artifacts/nugets'
          }
          $samplePackages = @(Get-ChildItem -Path $shippingDir -Recurse -File -Filter 'Aspire.Hosting.AppHost.*.nupkg')
          if ($samplePackages.Count -ne 1) {
            throw "Expected one Aspire.Hosting.AppHost package under $shippingDir, found $($samplePackages.Count)."
          }
          $samplePackage = $samplePackages[0]
          # This experiment only consumes PR CI. A non-PR package would select an unrelated
          # daily/staging hive in the normal workflow, so reject it rather than fall back.
          if ($samplePackage.Name -notmatch '-pr\.([0-9]+)\.') {
            throw "Expected a PR-versioned package from source run $env:SOURCE_RUN_ID, got $($samplePackage.Name)."
          }
          $hiveLabel = "pr-$($Matches[1])"
          $hiveDir = Join-Path $HOME ".aspire/hives/$hiveLabel/packages"
          New-Item -ItemType Directory -Path $hiveDir -Force | Out-Null
          Get-ChildItem -Path $shippingDir -Recurse -File -Filter '*.nupkg' | Copy-Item -Destination $hiveDir -Force
          $ridNugets = Join-Path '${{ github.workspace }}' 'artifacts/nugets-rid'
          $ridPackages = @(Get-ChildItem -Path $ridNugets -Recurse -File -Filter '*.nupkg')
          if ($ridPackages.Count -eq 0) {
            throw "The RID-specific NuGet artifact contains no packages."
          }
          $ridPackages | Copy-Item -Destination $hiveDir -Force

          "ASPIRE_CLI_PACKAGES=$hiveDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASPIRE_EXTENSION_E2E_CLI_PATH=$($cli.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASPIRE_EXTENSION_E2E_APPHOST_SDK_VERSION=$(($samplePackage.Name -replace '^Aspire\.Hosting\.AppHost\.', '') -replace '\.nupkg$', '')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path $env:REPRO_RESULTS_ROOT -Force | Out-Null
          & $cli.FullName --version | Tee-Object -FilePath (Join-Path $env:REPRO_RESULTS_ROOT cli-version.txt)

      - name: Compile extension E2E tests
        id: compile
        working-directory: extension
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack yarn compile
          corepack yarn compile-e2e
          if (-not (Test-Path $env:ASPIRE_EXTENSION_E2E_SPEC)) {
            throw "Compiled E2E shard spec was not found: $env:ASPIRE_EXTENSION_E2E_SPEC"
          }

      - name: Install Deno
        id: install_deno
        # Preserve the applicable second production install and its PATH ordering too.
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $target = if ('${{ runner.os }}' -eq 'Windows') {
            'x86_64-pc-windows-msvc'
          } else {
            'x86_64-unknown-linux-gnu'
          }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'deno'
          $archivePath = Join-Path $env:RUNNER_TEMP "deno-$target.zip"
          New-Item -ItemType Directory -Path $installDirectory -Force | Out-Null
          Invoke-WebRequest "https://github.com/denoland/deno/releases/download/v2.9.0/deno-$target.zip" -OutFile $archivePath
          Expand-Archive -Path $archivePath -DestinationPath $installDirectory -Force
          if ('${{ runner.os }}' -ne 'Windows') {
            chmod +x (Join-Path $installDirectory 'deno')
          }
          $installDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $installDirectory '${{ runner.os == 'Windows' && 'deno.exe' || 'deno' }}') --version

      - name: Install E2E recorder
        id: recorder
        if: ${{ matrix.useXvfb }}
        run: |
          # Same bounded, optional recorder acquisition as production. It never retries tests.
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            ffmpeg -version | Select-Object -First 1
          }
          else {
            $installed = $false
            $attempts = 2
            for ($attempt = 1; $attempt -le $attempts; $attempt++) {
              sudo timeout --kill-after=30 180 apt-get update
              sudo timeout --kill-after=30 180 apt-get install -y --no-install-recommends ffmpeg
              if ($LASTEXITCODE -eq 0) {
                $installed = $true
                break
              }
              if ($attempt -lt $attempts) {
                Write-Host "::warning::Attempt $attempt to install ffmpeg failed; retrying."
                Start-Sleep -Seconds 15
              }
            }
            if (-not $installed) {
              Write-Host '::warning::ffmpeg could not be installed; E2E screen recordings are disabled for this shard.'
            }
          }
          exit 0

      - name: Run all three complete ExTester iterations
        id: iterations
        working-directory: extension
        env:
          ASPIRE_EXTENSION_E2E_VSIX: ${{ github.workspace }}/extension/out/aspire-extension.vsix
          ASPIRE_EXTENSION_E2E_RECORDING_MODE: ${{ matrix.useXvfb && 'always' || 'off' }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Nonzero native exits are data until all iterations have been recorded.
          # Finish with our aggregate exit, never the last runner's exit or a retry.
          $PSNativeCommandUseErrorActionPreference = $false
          $script:lockOwnerQuery = $null

          function Get-LockWarningScope([string] $Output, [string] $StateFile, [string] $TemporaryDirectory) {
            $scope = [ordered]@{ status = 'scope-unavailable'; runId = $null; runRoot = $null; files = @(); error = $null }
            # The pinned runner emits (apostrophes inside paths are deliberately not guessed):
            # Warning: unable to remove locked E2E path 'C:\Temp\aev-ABC123': EBUSY: resource busy or locked, unlink 'C:\Temp\aev-ABC123\storage\settings\logs\...\exthost.log'
            $warnings = @($Output -split '\r?\n' | Where-Object { $_.Contains('Warning: unable to remove locked E2E path') })
            $scope.files = @($warnings | Select-Object -First 4 | ForEach-Object {
              $match = [regex]::Match($_, "^Warning: unable to remove locked E2E path '(?<root>[^'\r\n]+)': (?<code>[A-Z_]+): [^'\r\n]+, (?<operation>[a-z]+) '(?<file>[^'\r\n]+)'$")
              [ordered]@{
                file = if ($match.Success) { $match.Groups['file'].Value } else { $null }
                warningRoot = if ($match.Success) { $match.Groups['root'].Value } else { $null }
                warningCode = if ($match.Success) { $match.Groups['code'].Value } else { $null }
                operation = if ($match.Success) { $match.Groups['operation'].Value } else { $null }
                status = if ($match.Success) { 'scope-unavailable' } else { 'unparsed-warning' }
              }
            })
            $scope.omittedWarnings = [Math]::Max(0, $warnings.Count - 4)
            try {
              $state = Get-Content -LiteralPath $StateFile -Raw | ConvertFrom-Json
              $runIds = [regex]::Matches($Output, '(?m)^  storage diagnostics: \.test-storage[\\/]launch-profiles[\\/](?<id>[0-9]+-[0-9]+)\r?$')
              if ($runIds.Count -ne 1 -or $state.runId -cne $runIds[0].Groups['id'].Value) {
                $scope.error = 'State does not identify this runner invocation.'
                return $scope
              }
              $scope.runId = $state.runId
              $temporaryRoot = [IO.Path]::GetFullPath($TemporaryDirectory).TrimEnd('\')
              $appHost = $state.state.workspaceAppHostPath
              if ($appHost -notmatch '^[A-Za-z]:\\' -or $temporaryRoot -notmatch '^[A-Za-z]:\\') {
                $scope.error = 'No local absolute AppHost/temp path in current-run evidence.'
                return $scope
              }
              $relative = [IO.Path]::GetRelativePath($temporaryRoot, [IO.Path]::GetFullPath($appHost))
              $fixture = [regex]::Match($relative, '^(?<root>aev-[A-Za-z0-9]+)\\workspace\\.+$')
              if (-not $fixture.Success) {
                $scope.error = 'The current-run AppHost is not in a generated fixture under the configured temp directory.'
                return $scope
              }
              $scope.runRoot = Join-Path $temporaryRoot $fixture.Groups['root'].Value
              $scope.status = 'scoped'
              foreach ($file in $scope.files) {
                if ($file.status -eq 'unparsed-warning') { continue }
                $file.status = 'out-of-scope'
                if ($file.operation -ne 'unlink') {
                  $file.status = 'not-a-file-warning'
                  continue
                }
                # Reject device/UNC paths, alternate streams and traversal before any filesystem/API
                # lookup. Prefix checks include the separator so a sibling aev-* root cannot match.
                if ($file.file -notmatch '^[A-Za-z]:\\' -or $file.warningRoot -notmatch '^[A-Za-z]:\\' -or
                    $file.file.Substring(2) -match '[:*?"<>|]|(^|\\)\.\.?($|\\)' -or
                    $file.warningRoot.Substring(2) -match '[:*?"<>|]|(^|\\)\.\.?($|\\)') { continue }
                $candidateRoot = [IO.Path]::GetFullPath($file.warningRoot).TrimEnd('\')
                $candidate = [IO.Path]::GetFullPath($file.file)
                if ($candidateRoot.Equals($scope.runRoot, [StringComparison]::OrdinalIgnoreCase) -and
                    $candidate.StartsWith($scope.runRoot + '\', [StringComparison]::OrdinalIgnoreCase)) {
                  $file.file = $candidate
                  $file.status = 'scoped'
                }
              }
            }
            catch {
              # Never serialize state contents or the exception's potentially data-bearing message.
              $scope.status = 'scope-error'
              $scope.error = $_.Exception.GetType().FullName
            }
            return $scope
          }

          function Initialize-LockOwnerQuery {
            if ('AspireRepro.LockOwners' -as [type]) { return }
            Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Concurrent;
          using System.Collections.Generic;
          using System.Globalization;
          using System.IO;
          using System.Runtime.InteropServices;
          using System.Text;
          using System.Threading;
          using System.Threading.Tasks;

          namespace AspireRepro;

          public static class LockOwners
          {
              public sealed class Owner
              {
                  public uint Pid { get; init; }
                  public string StartTimeFileTimeUtc { get; init; }
                  public string StartedUtc { get; init; }
                  public string ApplicationName { get; init; }
              }

              public sealed class Observation
              {
                  public string File { get; init; }
                  public string Status { get; set; } = "query-error";
                  public string ObservedUtc { get; set; }
                  public string Stage { get; set; } = "path-check";
                  public uint? NativeCode { get; set; }
                  public uint? SessionEndCode { get; set; }
                  public string ErrorType { get; set; }
                  public Owner[] Owners { get; set; } = [];
              }

              public sealed class Capture
              {
                  public Task Worker { get; internal set; }
                  public CancellationTokenSource Cancellation { get; } = new();
                  public ConcurrentQueue<Observation> Observations { get; } = new();
              }

              public static Capture Begin(string root, string[] files)
              {
                  var capture = new Capture();
                  // Native queries have no cancellable timeout. A background task cannot hold up
                  // pwsh exit; cancellation only prevents subsequent queries, never touches owners.
                  capture.Worker = Task.Run(() =>
                  {
                      foreach (var file in files)
                      {
                          if (capture.Cancellation.IsCancellationRequested) { break; }
                          capture.Observations.Enqueue(Query(root, file, capture.Cancellation.Token));
                      }
                  });
                  // A timed-out caller will never await this worker again. Observe unexpected
                  // late faults without logging, mutating a snapshot, or changing test outcomes.
                  _ = capture.Worker.ContinueWith(task => { _ = task.Exception; },
                      CancellationToken.None, TaskContinuationOptions.OnlyOnFaulted |
                      TaskContinuationOptions.ExecuteSynchronously, TaskScheduler.Default);
                  return capture;
              }

              private static Observation Query(string root, string file, CancellationToken cancellation)
              {
                  var result = new Observation { File = file };
                  try
                  {
                      if (!Path.IsPathFullyQualified(file) ||
                          !Path.GetFullPath(file).StartsWith(Path.GetFullPath(root).TrimEnd('\\') + "\\", StringComparison.OrdinalIgnoreCase))
                      {
                          result.Status = "out-of-scope";
                          return result;
                      }
                      var current = root;
                      var segments = Path.GetRelativePath(root, file).Split(Path.DirectorySeparatorChar);
                      // Do not follow junctions/symlinks into an unrelated directory. Check from
                      // the known root outward, not by opening a potentially redirected final path.
                      if ((System.IO.File.GetAttributes(root) & FileAttributes.ReparsePoint) != 0)
                      {
                          result.Status = "reparse-point-rejected";
                          return result;
                      }
                      for (var i = 0; i < segments.Length; i++)
                      {
                          if (segments[i].EndsWith(' ') || segments[i].EndsWith('.'))
                          {
                              result.Status = "ambiguous-path-rejected";
                              return result;
                          }
                          current = Path.Combine(current, segments[i]);
                          var attributes = System.IO.File.GetAttributes(current);
                          if ((attributes & FileAttributes.ReparsePoint) != 0)
                          {
                              result.Status = "reparse-point-rejected";
                              return result;
                          }
                          if (i == segments.Length - 1 && (attributes & FileAttributes.Directory) != 0)
                          {
                              result.Status = "not-a-file";
                              return result;
                          }
                      }
                      result.Stage = "RmStartSession";
                      var code = RmStartSession(out var session, 0, new StringBuilder(33));
                      result.NativeCode = code;
                      if (code != 0) { return result; }
                      try
                      {
                          if (cancellation.IsCancellationRequested) { result.Status = "cancelled-between-queries"; return result; }
                          result.Stage = "RmRegisterResources";
                          // One file per session makes each owner attribution unambiguous.
                          code = RmRegisterResources(session, 1, [file], 0, IntPtr.Zero, 0, IntPtr.Zero);
                          result.NativeCode = code;
                          if (code != 0) { return result; }
                          uint count = 0;
                          ProcessInfo[] processes = null;
                          result.Stage = "RmGetList";
                          // ERROR_MORE_DATA can recur as processes enter/leave; bound both the
                          // resize count and allocation. This is enumeration, not a test retry.
                          // https://learn.microsoft.com/windows/win32/api/restartmanager/nf-restartmanager-rmgetlist
                          for (var read = 0; read < 3; read++)
                          {
                              if (cancellation.IsCancellationRequested) { result.Status = "cancelled-between-queries"; return result; }
                              code = RmGetList(session, out var needed, ref count, processes, out _);
                              result.NativeCode = code;
                              if (code == 234)
                              {
                                  if (needed == 0 || needed > 256) { result.Status = "owner-buffer-limit"; return result; }
                                  count = needed;
                                  processes = new ProcessInfo[count];
                                  continue;
                              }
                              if (code != 0) { return result; }
                              var owners = new List<Owner>();
                              for (var i = 0; i < count; i++)
                              {
                                  var process = processes[i];
                                  var started = ((long)process.Process.StartHigh << 32) | process.Process.StartLow;
                                  // RM_UNIQUE_PROCESS is PID + creation FILETIME, not PID alone.
                                  // No command line, environment, system-wide process sweep or handle mutation.
                                  // https://learn.microsoft.com/windows/win32/api/restartmanager/ns-restartmanager-rm_unique_process
                                  owners.Add(new Owner
                                  {
                                      Pid = process.Process.Pid,
                                      StartTimeFileTimeUtc = started.ToString(CultureInfo.InvariantCulture),
                                      StartedUtc = DateTime.FromFileTimeUtc(started).ToString("O"),
                                      ApplicationName = process.ApplicationName
                                  });
                              }
                              result.Owners = owners.ToArray();
                              result.Status = count == 0 ? "no-owners-observed" : "owners-observed";
                              return result;
                          }
                          result.Status = "owner-list-kept-changing";
                      }
                      finally
                      {
                          // Ends only our query session. Never shut down/restart an application.
                          result.SessionEndCode = RmEndSession(session);
                          if (result.SessionEndCode != 0) { result.Status = "session-end-error"; }
                      }
                  }
                  catch (FileNotFoundException) { result.Status = "file-missing"; }
                  catch (DirectoryNotFoundException) { result.Status = "file-missing"; }
                  catch (Exception error) { result.Status = "query-error"; result.ErrorType = error.GetType().FullName; }
                  finally { result.ObservedUtc = DateTime.UtcNow.ToString("O"); }
                  return result;
              }

              [StructLayout(LayoutKind.Sequential)]
              private struct UniqueProcess
              {
                  public uint Pid;
                  public uint StartLow;
                  public uint StartHigh;
              }

              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              private struct ProcessInfo
              {
                  public UniqueProcess Process;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 256)] public string ApplicationName;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 64)] public string ServiceName;
                  public int ApplicationType;
                  public uint ApplicationStatus;
                  public uint SessionId;
                  [MarshalAs(UnmanagedType.Bool)] public bool Restartable;
              }

              [DllImport("rstrtmgr.dll", CharSet = CharSet.Unicode, ExactSpelling = true)]
              private static extern uint RmStartSession(out uint session, uint flags, StringBuilder key);
              [DllImport("rstrtmgr.dll", CharSet = CharSet.Unicode, ExactSpelling = true)]
              private static extern uint RmRegisterResources(uint session, uint fileCount,
                  [MarshalAs(UnmanagedType.LPArray, ArraySubType = UnmanagedType.LPWStr)] string[] files,
                  uint applicationCount, IntPtr applications, uint serviceCount, IntPtr services);
              [DllImport("rstrtmgr.dll", ExactSpelling = true)]
              private static extern uint RmGetList(uint session, out uint needed, ref uint count,
                  [In, Out] ProcessInfo[] processes, out uint rebootReasons);
              [DllImport("rstrtmgr.dll", ExactSpelling = true)]
              private static extern uint RmEndSession(uint session);
          }
          '@
          }

          function Wait-LockOwnerQuery($Query, [string[]] $Files, [int] $TimeoutMilliseconds) {
            $status = 'completed'
            try {
              if (-not $Query.Worker.Wait($TimeoutMilliseconds)) {
                $status = 'timeout'
                $Query.Cancellation.Cancel()
              }
            }
            catch {
              $status = 'query-task-error'
              $Query.Cancellation.Cancel()
            }
            $observations = @($Query.Observations.ToArray())
            foreach ($file in $Files) {
              if ($file -notin $observations.File) {
                $missingStatus = if ($status -eq 'completed') { 'missing-query-result' } else { $status }
                $observations += [ordered]@{ File = $file; Status = $missingStatus; Owners = @(); SessionEndCode = $null }
              }
            }
            if ($status -eq 'completed' -and @($observations | Where-Object { $_.Status -notin @('owners-observed', 'no-owners-observed') }).Count -gt 0) {
              $status = 'completed-with-query-errors'
            }
            return [ordered]@{
              status = $status
              backgroundQueryStillRunning = -not $Query.Worker.IsCompleted
              observations = $observations
            }
          }

          function Write-WindowsLockDiagnostics([string] $Output, [string] $StateFile, [string] $Destination) {
            $report = [ordered]@{
              capturedUtc = [DateTime]::UtcNow.ToString('o')
              status = 'diagnostic-error'
              interpretation = 'Point-in-time Restart Manager observation only. Empty lists, missing files, errors and timeouts do not establish that the original lock was absent or unrelated.'
              timeoutMilliseconds = 10000
              scope = $null
              query = $null
              errorType = $null
            }
            try {
              $temporaryDirectory = if ($env:ASPIRE_EXTENSION_E2E_TEMP_ROOT) { $env:ASPIRE_EXTENSION_E2E_TEMP_ROOT } else { [IO.Path]::GetTempPath() }
              $report.scope = Get-LockWarningScope $Output $StateFile $temporaryDirectory
              $files = @($report.scope.files | Where-Object { $_.status -eq 'scoped' } | ForEach-Object { $_.file } | Select-Object -Unique)
              if ($report.scope.status -ne 'scoped' -or $files.Count -eq 0) {
                $report.status = 'no-scoped-files'
              } elseif ($null -ne $script:lockOwnerQuery -and -not $script:lockOwnerQuery.Worker.IsCompleted) {
                $report.status = 'previous-query-still-running'
              } else {
                Initialize-LockOwnerQuery
                $script:lockOwnerQuery = [AspireRepro.LockOwners]::Begin($report.scope.runRoot, [string[]]$files)
                $report.query = Wait-LockOwnerQuery $script:lockOwnerQuery $files $report.timeoutMilliseconds
                $report.status = $report.query.status
              }
            }
            catch {
              $report.errorType = $_.Exception.GetType().FullName
            }
            # No query thread writes artifacts: the snapshot is final before the next iteration.
            # A timed-out native call may finish later; no further calls start while it is outstanding.
            $report | ConvertTo-Json -Depth 20 | Set-Content (Join-Path $Destination lock-owners.json) -Encoding utf8
            Write-Host "Windows lock-owner diagnostic: $($report.status). Original cleanup failure remains blocking."
          }

          $expectedTitles = @(
            'Aspire launch profiles E2E debugs a Deno AppHost through the built-in JavaScript debugger'
            'Aspire launch profiles E2E uses the AppHost launch profile selected by launch.json'
            'Aspire launch profiles E2E forwards launch profiles from launch.json and the AppHost start tool to the selected CLI'
          )
          $expectedTitleSet = ($expectedTitles | Sort-Object) -join "`n"
          $failed = 0
          $evidenceSafe = $true
          $diagnosticPaths = @(
            '.test-results/e2e/launch-profiles'
            '.test-storage/launch-profiles'
            '.test-workspaces/launch-profiles'
            '.test-recordings/launch-profiles'
          )

          for ($i = 1; $i -le [int]$env:ITERATIONS_PER_RUNNER; $i++) {
            Write-Host "::group::Iteration $i/$env:ITERATIONS_PER_RUNNER"
            $destination = Join-Path $env:REPRO_RESULTS_ROOT ('iteration-{0:d2}' -f $i)
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            $log = Join-Path $destination runner.log
            $resultPath = Join-Path $destination result.json
            $result = [ordered]@{
              iteration = $i
              startedUtc = [DateTime]::UtcNow.ToString('o')
              finishedUtc = $null
              outcome = 'running'
              runnerExitCode = $null
              mochaStatus = 'missing'
              tests = 0
              executed = 0
              passes = 0
              pending = 0
              failures = 0
              categories = [Collections.Generic.List[string]]::new()
              errors = [Collections.Generic.List[string]]::new()
            }
            $result | ConvertTo-Json -Depth 20 | Set-Content $resultPath -Encoding utf8

            if (-not $evidenceSafe) {
              # A failed archive must not let the next invocation overwrite the only evidence.
              # Record the remaining slots as not run, not as successful test executions.
              $result.categories.Add('not-run-evidence-preservation')
              $result.errors.Add('Previous diagnostics could not be archived; retained originals are uploaded separately.')
              'Runner not launched because previous evidence could not be preserved.' | Set-Content $log -Encoding utf8
            }
            else {
              try {
                if (Test-Path '.test-results/e2e/launch-profiles/mocha.json') {
                  throw 'Unarchived Mocha results exist before this iteration; refusing to overwrite them.'
                }
                # The unchanged harness creates a new temporary fixture and VS Code instance.
                # Its Git-common-dir download/NuGet caches stay warm; only diagnostic copies move.
                if ($env:REPRO_USE_XVFB -eq 'true') {
                  xvfb-run -a node scripts/run-e2e.js *> $log
                } else {
                  node scripts/run-e2e.js *> $log
                }
                $result.runnerExitCode = $LASTEXITCODE
              }
              catch {
                $result.categories.Add('runner-invocation-failure')
                $result.errors.Add(($_ | Out-String))
              }
              # Persist the native exit before touching or parsing any diagnostics.
              $result | ConvertTo-Json -Depth 20 | Set-Content $resultPath -Encoding utf8

              if (Test-Path -LiteralPath $log) {
                $output = Get-Content -LiteralPath $log -Raw
                # These are exact warning/error prefixes in the pinned runner and teardown.
                # For example, "Aspire E2E AppHost cleanup exited with code 1" can otherwise
                # accompany exit 0 and three passes. A shutdown failure is never green here.
                if ($output -match 'One or more E2E cleanup steps failed:|Failed to stop Aspire E2E AppHost during cleanup:|Aspire E2E AppHost cleanup exited with code|Warning: unable to remove locked E2E path|Launch profiles E2E teardown failed\.') {
                  $result.categories.Add('cleanup-failure')
                }
                if ($IsWindows -and $output.Contains('Warning: unable to remove locked E2E path')) {
                  # Query before copying/printing diagnostics adds delay or the next run starts.
                  # Persist the original failure first; diagnostic success cannot change it.
                  $result | ConvertTo-Json -Depth 20 | Set-Content $resultPath -Encoding utf8
                  try {
                    Write-WindowsLockDiagnostics $output '.test-results/e2e/launch-profiles/extension-state.json' $destination
                  }
                  catch {
                    $evidenceSafe = $false
                    $result.categories.Add('lock-diagnostic-write-failure')
                    $result.errors.Add(($_ | Out-String))
                  }
                }
                Get-Content -LiteralPath $log | Write-Host
              }

              foreach ($relative in $diagnosticPaths) {
                try {
                  if (Test-Path -LiteralPath $relative) {
                    $archivePath = Join-Path $destination "extension/$relative"
                    New-Item -ItemType Directory -Path (Split-Path $archivePath -Parent) -Force | Out-Null
                    Move-Item -LiteralPath $relative -Destination $archivePath
                  }
                }
                catch {
                  $evidenceSafe = $false
                  $result.categories.Add('diagnostic-archive-failure')
                  $result.errors.Add("$relative`: $($_ | Out-String)")
                }
              }

              $mochaPath = Join-Path $destination 'extension/.test-results/e2e/launch-profiles/mocha.json'
              if (-not (Test-Path -LiteralPath $mochaPath)) {
                $result.categories.Add('no-mocha')
              }
              else {
                try {
                  # e2e-mocha-reporter.cjs writes this only at EVENT_RUN_END:
                  # { stats: { tests: 3, passes: 3, pending: 0, failures: 0, end: "..." },
                  #   tests: [{ fullTitle: "...", currentRetry: 0 }], passes: [...],
                  #   failures: [], pending: [] }. Hook failures are in failures, not tests.
                  $mocha = Get-Content -LiteralPath $mochaPath -Raw | ConvertFrom-Json -AsHashtable
                  foreach ($field in @('tests', 'passes', 'pending', 'failures')) {
                    if ($mocha[$field] -isnot [array] -or
                        $mocha.stats[$field] -isnot [long] -or $mocha.stats[$field] -lt 0) {
                      throw "Invalid Mocha array or integer statistic: $field"
                    }
                    $result[$field] = $mocha.stats[$field]
                    if ($mocha.stats[$field] -ne $mocha[$field].Count) {
                      $result.categories.Add('inconsistent-mocha-counts')
                    }
                  }
                  if ([string]::IsNullOrWhiteSpace($mocha.stats.end)) {
                    throw 'Mocha did not report an end time.'
                  }
                  $result.mochaStatus = 'completed'
                  $result.executed = $result.tests - $result.pending
                  if ($result.executed -ne [int]$env:EXPECTED_TESTS -or $result.tests -ne [int]$env:EXPECTED_TESTS) {
                    $result.categories.Add('incomplete-suite')
                  }
                  if ($result.pending -ne 0 -or $mocha.pending.Count -ne 0) {
                    $result.categories.Add('skipped-tests')
                  }
                  if ($result.passes -ne [int]$env:EXPECTED_TESTS -or $mocha.passes.Count -ne [int]$env:EXPECTED_TESTS) {
                    $result.categories.Add('not-all-tests-passed')
                  }
                  foreach ($field in @('tests', 'passes')) {
                    $titles = @($mocha[$field] | ForEach-Object { $_.fullTitle })
                    if (($titles | Sort-Object) -join "`n" -cne $expectedTitleSet) {
                      $result.categories.Add('unexpected-test-set')
                    }
                  }
                  foreach ($test in @($mocha.tests) + @($mocha.passes) + @($mocha.failures) + @($mocha.pending)) {
                    if ($test.currentRetry -isnot [long] -or $test.currentRetry -ne 0) {
                      $result.categories.Add('retry-or-invalid-retry-count')
                    }
                  }
                  foreach ($failure in $mocha.failures) {
                    if ($failure.fullTitle -cin $expectedTitles) {
                      $result.categories.Add('mocha-test-failure')
                    } elseif ($failure.fullTitle -match '(?i)after (each|all)|teardown') {
                      $result.categories.Add('cleanup-failure')
                    } else {
                      $result.categories.Add('setup-or-harness-hook-failure')
                    }
                  }
                  if ($result.failures -gt 0 -and $mocha.failures.Count -eq 0) {
                    $result.categories.Add('unreported-mocha-failure')
                  }
                }
                catch {
                  $result.mochaStatus = 'invalid'
                  $result.categories.Add('invalid-mocha')
                  $result.errors.Add(($_ | Out-String))
                }
              }
              if ($null -eq $result.runnerExitCode -or $result.runnerExitCode -ne 0) {
                $result.categories.Add('runner-failure')
              }
            }

            $result.categories = @($result.categories | Select-Object -Unique)
            $result.finishedUtc = [DateTime]::UtcNow.ToString('o')
            $result.outcome = if ($result.categories.Count -eq 0) { 'passed' } else { 'failed' }
            $result | ConvertTo-Json -Depth 20 | Set-Content $resultPath -Encoding utf8
            if ($result.outcome -ne 'passed') {
              $failed++
              Write-Host "::error::Iteration ${i}: $($result.categories -join ', '); runner exit '$($result.runnerExitCode)'. See $resultPath."
            }
            Write-Host "Iteration ${i}: $($result.outcome); executed=$($result.executed), passes=$($result.passes), failures=$($result.failures), pending=$($result.pending)."
            Write-Host '::endgroup::'
          }
          if ($failed -gt 0) { exit 1 }
          exit 0

      - name: Record every iteration and setup outcome
        id: record_results
        if: always()
        env:
          ITERATION_STEP_OUTCOME: ${{ steps.iterations.outcome }}
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:REPRO_RESULTS_ROOT -Force | Out-Null
          $env:STEP_OUTCOMES | Set-Content (Join-Path $env:REPRO_RESULTS_ROOT job-steps.json) -Encoding utf8
          $iterations = foreach ($i in 1..([int]$env:ITERATIONS_PER_RUNNER)) {
            $destination = Join-Path $env:REPRO_RESULTS_ROOT ('iteration-{0:d2}' -f $i)
            $path = Join-Path $destination result.json
            if (Test-Path -LiteralPath $path) {
              Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            } else {
              $category = if ($env:ITERATION_STEP_OUTCOME -in @('', 'skipped')) { 'setup-failure' } else { 'missing-iteration' }
              $missing = @{
                iteration = $i
                outcome = 'not-run'
                runnerExitCode = $null
                mochaStatus = 'missing'
                tests = 0
                executed = 0
                passes = 0
                pending = 0
                failures = 0
                categories = @($category)
                errors = @('No iteration record. See job-steps.json and the failed setup/runner step logs; this is not a test reproduction.')
              }
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
              $missing | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8
              $missing
            }
          }
          @{
            rid = $env:REPRO_RID
            runnerIndex = [int]$env:REPRO_RUNNER_INDEX
            sourceRunId = $env:SOURCE_RUN_ID
            fixHeadSha = $env:FIX_HEAD_SHA
            testedSourceSha = $env:TESTED_SOURCE_SHA
            iterationStepOutcome = $env:ITERATION_STEP_OUTCOME
            iterations = @($iterations)
          } | ConvertTo-Json -Depth 20 | Set-Content (Join-Path $env:REPRO_RESULTS_ROOT job-summary.json) -Encoding utf8

      - name: Upload every iteration's E2E evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: launch-profiles-repro-${{ matrix.rid }}-runner-${{ matrix.index }}-attempt${{ github.run_attempt }}
          # Preserve the production diagnostic allowlist, under each unique iteration.
          # Explicitly retain the runner's windows-file-locks.json beside workflow diagnostics.
          # The original paths are included only as a fallback after an archive failure;
          # later iterations then remain not-run so those originals cannot be overwritten.
          path: |
            repro-results/**/result.json
            repro-results/**/runner.log
            repro-results/**/lock-owners.json
            repro-results/**/extension/.test-results/e2e/launch-profiles/windows-file-locks.json
            repro-results/**/cli-version.txt
            repro-results/**/tested-source.json
            repro-results/**/job-steps.json
            repro-results/**/job-summary.json
            repro-results/**/extension/.test-results/**
            repro-results/**/extension/.test-storage/**/settings/User/**
            repro-results/**/extension/.test-storage/**/settings/logs/**
            repro-results/**/extension/.test-storage/**/screenshots/**
            repro-results/**/extension/.test-storage/**/aspire-home/logs/**
            repro-results/**/extension/.test-storage/**/aspire-home/cache/apphost-info/**
            repro-results/**/extension/.test-workspaces/**/.aspire/**
            repro-results/**/extension/.test-workspaces/**/*.log
            repro-results/**/extension/.test-recordings/**
            extension/.test-results/**
            extension/.test-results/e2e/launch-profiles/windows-file-locks.json
            extension/.test-storage/**/settings/User/**
            extension/.test-storage/**/settings/logs/**
            extension/.test-storage/**/screenshots/**
            extension/.test-storage/**/aspire-home/logs/**
            extension/.test-storage/**/aspire-home/cache/apphost-info/**
            extension/.test-workspaces/**/.aspire/**
            extension/.test-workspaces/**/*.log
            extension/.test-recordings/**
          if-no-files-found: error
          include-hidden-files: true

  results:
    name: Aggregate all 18 full-suite iterations
    if: always()
    needs: [verify_source, reproduce]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download runner evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: launch-profiles-repro-*-runner-*-attempt${{ github.run_attempt }}
          path: repro-aggregate

      - name: Summarize and fail on any unsuccessful or missing iteration
        if: always()
        env:
          SOURCE_JOB_RESULT: ${{ needs.verify_source.result }}
          REPRO_JOB_RESULT: ${{ needs.reproduce.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          $summaries = @()
          if (Test-Path repro-aggregate) {
            $summaries = @(Get-ChildItem repro-aggregate -Recurse -File -Filter job-summary.json)
          }
          $jobs = @($summaries | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json })
          $lines = [Collections.Generic.List[string]]::new()
          $lines.Add('## Launch-profiles ExTester reproduction results')
          $lines.Add('')
          $lines.Add("Fix head: $env:FIX_HEAD_SHA; tested merge: $env:TESTED_SOURCE_SHA; artifacts: run $env:SOURCE_RUN_ID.")
          $lines.Add('Requested: 3 fresh ubuntu-latest jobs + 3 fresh windows-latest jobs, 3 full-suite iterations/job, 3 tests/iteration (9 iterations/OS, 18 iterations and 54 tests total).')
          $lines.Add("Provenance job: $env:SOURCE_JOB_RESULT; runner jobs: $env:REPRO_JOB_RESULT.")
          $lines.Add('')
          $lines.Add('| RID | Runner | Iteration | Outcome | Exit | Executed | Pass | Fail | Pending | Classification |')
          $lines.Add('|---|---:|---:|---|---:|---:|---:|---:|---:|---|')
          $failed = $env:SOURCE_JOB_RESULT -ne 'success' -or $env:REPRO_JOB_RESULT -ne 'success' -or $jobs.Count -ne 6
          $passed = 0
          foreach ($rid in @('linux-x64', 'win-x64')) {
            foreach ($index in 1..3) {
              $matching = @($jobs | Where-Object { $_.rid -ceq $rid -and $_.runnerIndex -eq $index })
              if ($matching.Count -ne 1) {
                $failed = $true
                $lines.Add("| $rid | $index | 1-3 | missing/duplicate runner evidence | n/a | 0 | 0 | 0 | 0 | infrastructure failure |")
                continue
              }
              $job = $matching[0]
              if ($job.sourceRunId -ne $env:SOURCE_RUN_ID -or $job.fixHeadSha -cne $env:FIX_HEAD_SHA -or
                  $job.testedSourceSha -cne $env:TESTED_SOURCE_SHA -or
                  @($job.iterations).Count -ne [int]$env:ITERATIONS_PER_RUNNER -or $job.iterationStepOutcome -ne 'success') {
                $failed = $true
              }
              foreach ($i in 1..([int]$env:ITERATIONS_PER_RUNNER)) {
                $matchingIteration = @($job.iterations | Where-Object { $_.iteration -eq $i })
                if ($matchingIteration.Count -ne 1) {
                  $failed = $true
                  $lines.Add("| $rid | $index | $i | missing/duplicate iteration | n/a | 0 | 0 | 0 | 0 | missing-iteration |")
                  continue
                }
                $result = $matchingIteration[0]
                $exit = if ($null -eq $result.runnerExitCode) { 'not launched' } else { [string]$result.runnerExitCode }
                $categories = @($result.categories) -join ', '
                $lines.Add("| $rid | $index | $i | $($result.outcome) | $exit | $($result.executed) | $($result.passes) | $($result.failures) | $($result.pending) | $categories |")
                if ($result.outcome -ceq 'passed' -and $null -ne $result.runnerExitCode -and $result.runnerExitCode -eq 0 -and
                    $result.mochaStatus -ceq 'completed' -and @($result.categories).Count -eq 0 -and
                    $result.tests -eq [int]$env:EXPECTED_TESTS -and $result.executed -eq [int]$env:EXPECTED_TESTS -and
                    $result.passes -eq [int]$env:EXPECTED_TESTS -and $result.failures -eq 0 -and $result.pending -eq 0) {
                  $passed++
                } else {
                  $failed = $true
                }
              }
            }
          }
          $lines.Add('')
          $lines.Add("Successful complete iterations: $passed/18. Each successful iteration contains all three named tests, no pending tests, no Mocha retries, and runner exit 0.")
          $lines.Add('Setup/feed, missing Mocha, hook, cleanup, and diagnostic failures are not successful iterations or confirmed test reproductions. Inspect the preserved Mocha errors and runner logs before attributing any failure to #19921.')
          $lines | Set-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $lines | Write-Host
          if ($failed -or $passed -ne 18) { exit 1 }
          exit 0
