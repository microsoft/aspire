name: Investigate Windows native WASM attachment

# Investigation-only adaptation of the existing dispatchable reproduction entry point.
# Every worker runs the unchanged eight-test shard once in a fresh VS Code workspace.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source commit corresponding to the artifact-producing run
        type: string
        default: 9b0f7891cd1e2bb89e5cdbc926cca9aa17e2bbd7
        required: true
      artifact_run_id:
        description: Existing CI run supplying matching CLI and NuGet artifacts
        type: string
        default: '34314035384'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  reproduce:
    name: Windows x64 native attachment ${{ matrix.index }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3, 4, 5]
    defaults:
      run:
        shell: pwsh
        working-directory: subject\extension
    env:
      NPM_REGISTRY: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-npm/npm/registry/
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      MSBUILDTERMINALLOGGER: 'false'

    steps:
      - name: Checkout investigation instrumentation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: instrumentation

      - name: Checkout reproduction subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          path: subject

      - name: Verify artifact source identity
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          $artifactHead = (gh api "repos/microsoft/aspire/actions/runs/$env:ARTIFACT_RUN_ID" --jq '.head_sha').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve artifact source run.' }
          if ($head -ne $artifactHead) { throw "Source $head does not match artifact run head $artifactHead." }
          Write-Host "Reproduction source: $head; artifact run: $env:ARTIFACT_RUN_ID"
          Write-Host "Native architecture: $([Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.x'

      - name: Setup subject SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: subject/global.json

      - name: Install pinned extension tooling
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:COREPACK_HOME = Join-Path $env:RUNNER_TEMP 'corepack'
          "COREPACK_HOME=$env:COREPACK_HOME" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $version = (Get-Content -Raw scripts\corepack-version.txt).Trim()
          npm install --global --force --registry "$env:NPM_REGISTRY" "corepack@$version"
          $npmGlobalBin = (npm prefix --global).Trim()
          $env:PATH = "$npmGlobalBin;$env:PATH"
          $npmGlobalBin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          if ((corepack --version).Trim() -ne $version) { throw 'Incorrect Corepack version.' }
          corepack enable
          node scripts\prepareCorepackYarn.mjs
          node scripts\validate-lockfile-registry.cjs
          corepack yarn install --frozen-lockfile --non-interactive

      - name: Inject lifecycle-only instrumentation
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item ..\..\instrumentation\extension\src\testing\wasmInvestigationProbe.ts src\testing\wasmInvestigationProbe.ts
          $bridgePath = Join-Path (Get-Location) 'src\testing\e2eStateFileBridge.ts'
          $bridge = [IO.File]::ReadAllText($bridgePath)
          if (-not $bridge.Contains('installWasmInvestigationProbe')) {
            $marker = '  const extensionHostSessionId = randomUUID();'
            if (($bridge.Split($marker)).Count -ne 2) { throw 'Expected one E2E bridge initialization marker.' }
            $bridge = "import { installWasmInvestigationProbe } from './wasmInvestigationProbe';`n" + $bridge
            $bridge = $bridge.Replace($marker, "$marker`n  context.subscriptions.push(installWasmInvestigationProbe(context.logUri.fsPath));")
            [IO.File]::WriteAllText($bridgePath, $bridge)
          }
          git --no-pager diff --stat

      - name: Download matching CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-native-archives-win-x64
          path: subject/artifacts/cli-archive
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download matching NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-nugets
          path: subject/artifacts/nugets
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download matching Windows NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-nugets-for-win-x64
          path: subject/artifacts/nugets-rid
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Acquire pinned C# debugger prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-PinnedArtifact([string] $Uri, [string] $OutFile, [string] $Hash) {
            Invoke-WebRequest -Uri $Uri -OutFile $OutFile -MaximumRetryCount 3 -RetryIntervalSec 5
            if ((Get-FileHash $OutFile -Algorithm SHA256).Hash -ne $Hash) {
              throw "Checksum mismatch for $OutFile."
            }
          }
          $runtime = Join-Path $env:RUNNER_TEMP 'dotnet-runtime.vsix'
          $csharp = Join-Path $env:RUNNER_TEMP 'csharp-win32-x64.vsix'
          Get-PinnedArtifact 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-dotnettools/vsextensions/vscode-dotnet-runtime/3.1.0/vspackage' $runtime '8e675ffe5f3674430d63e28d2dc05ab40f36c8494e9549e79d3995d721b13f5a'
          Get-PinnedArtifact 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-dotnettools/vsextensions/csharp/2.148.23/vspackage?targetPlatform=win32-x64' $csharp '27cf5f0fdcd677f7af61a6d43f2dc75bac7ca2cffa1f29e3262b615bbcabb952'
          "ASPIRE_EXTENSION_E2E_DOTNET_RUNTIME_VSIX=$runtime" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ASPIRE_EXTENSION_E2E_CSHARP_VSIX=$csharp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare matching CLI and package hive
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $subject = (Resolve-Path ..).Path
          $archive = Get-ChildItem ..\artifacts\cli-archive -Recurse -File -Filter 'aspire-cli-win-x64*.zip' | Select-Object -First 1
          if ($null -eq $archive) { throw 'Matching CLI archive missing.' }
          $bundle = Join-Path $subject 'artifacts\bundle\win-x64'
          New-Item -ItemType Directory $bundle -Force | Out-Null
          Expand-Archive $archive.FullName -DestinationPath $bundle
          $cli = Get-ChildItem $bundle -Recurse -File -Filter aspire.exe | Select-Object -First 1
          if ($null -eq $cli) { throw 'Extracted CLI missing.' }
          & $cli.FullName setup
          $installPath = Split-Path (Split-Path $cli.FullName -Parent) -Parent
          $dcp = Get-ChildItem $installPath -Recurse -File -Filter dcp.exe | Select-Object -First 1
          if ($null -eq $dcp) { throw 'CLI setup did not produce DCP.' }
          $packages = Get-ChildItem ..\artifacts\nugets -Recurse -File -Filter '*.nupkg'
          $sample = $packages | Where-Object Name -Like 'Aspire.Hosting.AppHost.*.nupkg' | Select-Object -First 1
          if ($null -eq $sample) { throw 'AppHost package missing.' }
          $version = $sample.Name -replace '^Aspire\.Hosting\.AppHost\.', '' -replace '\.nupkg$', ''
          $label = if ($sample.Name -match '-pr\.([0-9]+)\.') { "pr-$($Matches[1])" } else { 'daily' }
          $hive = Join-Path $HOME ".aspire\hives\$label\packages"
          New-Item -ItemType Directory $hive -Force | Out-Null
          $packages | Copy-Item -Destination $hive
          Get-ChildItem ..\artifacts\nugets-rid -Recurse -File -Filter '*.nupkg' | Copy-Item -Destination $hive -Force
          @(
            "ASPIRE_DCP_PATH=$($dcp.Directory.FullName)"
            "ASPIRE_CLI_PACKAGES=$hive"
            "ASPIRE_EXTENSION_E2E_CLI_PATH=$($cli.FullName)"
            "ASPIRE_EXTENSION_E2E_APPHOST_SDK_VERSION=$version"
          ) | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $cli.FullName --version

      - name: Build instrumented subject VSIX and unchanged E2E tests
        env:
          ASPIRE_EXTENSION_E2E_INCLUDE_BRIDGE: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack yarn compile-e2e
          corepack yarn run vsce package --pre-release -o out\aspire-extension.vsix
          if (-not (Test-Path out\test-e2e\test-e2e\browserDebugger.e2e.test.js)) {
            throw 'Browser debugger Mocha spec was not compiled.'
          }

      - name: Run one fresh eight-test native proof shard
        env:
          ASPIRE_EXTENSION_E2E_SHARD: browser-debugger
          ASPIRE_EXTENSION_E2E_SPEC: out/test-e2e/test-e2e/browserDebugger.e2e.test.js
          ASPIRE_EXTENSION_E2E_BROWSER: msedge
          ASPIRE_EXTENSION_E2E_RECORDING_MODE: 'off'
          ASPIRE_EXTENSION_E2E_ADVISORY_ISSUE: ''
        run: |
          $env:ASPIRE_EXTENSION_E2E_VSIX = Join-Path (Get-Location) 'out\aspire-extension.vsix'
          node scripts\run-e2e.js
          $testExit = $LASTEXITCODE
          $mochaPath = '.test-results\e2e\browser-debugger\mocha.json'
          if (-not (Test-Path $mochaPath)) { throw "No Mocha results; runner exited $testExit." }
          $mocha = Get-Content -Raw $mochaPath | ConvertFrom-Json
          $mocha.stats | ConvertTo-Json -Compress
          if ($mocha.stats.tests -ne 8 -or $mocha.stats.pending -ne 0) {
            throw 'Expected all eight actual Mocha tests with no pending tests.'
          }
          if ($mocha.stats.failures -gt 0 -and $testExit -eq 0) { throw 'Runner masked Mocha failures.' }
          exit $testExit

      - name: Preserve all proof and lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wasm-native-investigation-${{ matrix.index }}-attempt${{ github.run_attempt }}
          path: |
            subject/extension/.test-results/**
            subject/extension/.test-storage/**
            subject/extension/.test-workspaces/**
          include-hidden-files: true
          if-no-files-found: warn
