# Diagnostic-branch configuration of the existing reproduction dispatch.
# Reuse the normal native package producers and the unmodified E2E fixture.
name: Diagnose extension notification dismissal
run-name: Diagnostic logs at ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  build_packages:
    uses: ./.github/workflows/build-packages.yml

  build_cli_archive_linux:
    uses: ./.github/workflows/build-cli-native-archives.yml
    with:
      targets: '[{"os": "ubuntu-latest", "runner": "8-core-ubuntu-latest", "rids": "linux-x64"}]'

  diagnostic_logs:
    needs: [build_packages, build_cli_archive_linux]
    uses: ./.github/workflows/extension-e2e-tests.yml
    with:
      diagnosticLogsOnly: true
