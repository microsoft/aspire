# Reproduces flaky tests by running them repeatedly across multiple OS runners.
#
# HOW TO USE:
# 1. Edit the CONFIGURATION section below with the test you want to reproduce
# 2. Push to your branch
# 3. Trigger: gh workflow run reproduce-flaky-tests.yml --repo microsoft/aspire --ref <your-branch>
# 4. Check the results across OSes and runners
#
# The configuration is designed to be edited by agents (Copilot, etc.)
# who modify the env vars below and push to trigger a run.

name: Reproduce Flaky Tests

on:
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

# ============================================================
# CONFIGURATION — Edit these values to customize the test run
# ============================================================
env:
  # Test project shortname (maps to tests/Aspire.{name}.Tests/ or tests/{name}.Tests/)
  # Examples: Hosting, Core, Dashboard, Components.Common, Cli.EndToEnd
  TEST_PROJECT: "Managed"
  TEST_SOURCE_SHA: "95591e288737d36c176a20cb9515e8cf02905e56"

  # Test filter arguments passed to dotnet test (after the -- separator).
  # Use quotes around wildcard patterns to prevent shell glob expansion.
  # Examples:
  #   --filter-method "*.TestMethodName"
  #   --filter-class "*.TestClassName"
  #   --filter-method "*.Test1" --filter-method "*.Test2"
  TEST_FILTER: '--filter-not-trait "quarantined=true" --filter-not-trait "outerloop=true"'

  # Target operating systems (comma-separated)
  # Options: ubuntu-latest, windows-latest, macos-latest
  TARGET_OSES: "ubuntu-latest"

  # Number of parallel runners per OS
  # Test allocations = RUNNERS_PER_OS × number of OSes; plus 2 helper allocations.
  RUNNERS_PER_OS: "48"

  # Number of test iterations each runner executes
  ITERATIONS_PER_RUNNER: "1"

jobs:

  setup:
    name: Generate matrix
    if: ${{ github.repository == 'microsoft/aspire' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          ERRORS=0

          # Validate RUNNERS_PER_OS is a positive integer
          if ! [[ "${{ env.RUNNERS_PER_OS }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::RUNNERS_PER_OS must be a positive integer, got '${{ env.RUNNERS_PER_OS }}'"
            ERRORS=1
          fi

          # Validate ITERATIONS_PER_RUNNER is a positive integer
          if ! [[ "${{ env.ITERATIONS_PER_RUNNER }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::ITERATIONS_PER_RUNNER must be a positive integer, got '${{ env.ITERATIONS_PER_RUNNER }}'"
            ERRORS=1
          fi

          # Validate TARGET_OSES is not empty and contains only known runners
          if [[ -z "${{ env.TARGET_OSES }}" ]]; then
            echo "::error::TARGET_OSES must not be empty"
            ERRORS=1
          else
            IFS=',' read -ra CHECK_OSES <<< "${{ env.TARGET_OSES }}"
            for os in "${CHECK_OSES[@]}"; do
              os=$(echo "$os" | xargs)
              if [[ "$os" != "ubuntu-latest" && "$os" != "windows-latest" && "$os" != "macos-latest" ]]; then
                echo "::error::Unknown OS in TARGET_OSES: '$os'. Allowed: ubuntu-latest, windows-latest, macos-latest"
                ERRORS=1
              fi
            done
          fi

          # Validate TEST_FILTER is not the placeholder
          if [[ "$TEST_FILTER" == *"YourTestMethodName"* ]]; then
            echo "::error::TEST_FILTER still contains the placeholder 'YourTestMethodName'. Configure it with the actual test to reproduce."
            ERRORS=1
          fi

          if [[ $ERRORS -ne 0 ]]; then exit 1; fi

      - name: Generate runner matrix
        id: generate
        shell: bash
        run: |
          IFS=',' read -ra OSES <<< "${{ env.TARGET_OSES }}"
          RUNNERS=${{ env.RUNNERS_PER_OS }}

          ENTRIES=""
          for os in "${OSES[@]}"; do
            os=$(echo "$os" | xargs)
            for i in $(seq 1 "$RUNNERS"); do
              if [ -n "$ENTRIES" ]; then ENTRIES="$ENTRIES,"; fi
              ENTRIES="${ENTRIES}{\"os\":\"${os}\",\"index\":${i}}"
            done
          done

          MATRIX="{\"include\":[${ENTRIES}]}"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

          TOTAL=$((RUNNERS * ${#OSES[@]}))
          echo "Generated matrix: $TOTAL runners across ${#OSES[@]} OS(es)"
          echo "Each runner will execute ${{ env.ITERATIONS_PER_RUNNER }} iterations"
          echo "Total test executions: $(( TOTAL * ${{ env.ITERATIONS_PER_RUNNER }} ))"

  reproduce:
    name: "${{ matrix.os }} #${{ matrix.index }}"
    needs: [setup]
    if: >-
      ${{
        github.repository == 'microsoft/aspire' &&
        !cancelled() &&
        needs.setup.result == 'success'
      }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet
      RECEIPT_INDEX: ${{ matrix.index }}
      MSBUILDTERMINALLOGGER: "false"

    steps:
      - name: Setup vars (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "DOTNET_SCRIPT=./dotnet.sh" >> "$GITHUB_ENV"
          echo "BUILD_SCRIPT=./build.sh" >> "$GITHUB_ENV"
          echo "${{ github.workspace }}/.dotnet" >> "$GITHUB_PATH"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_SOURCE_SHA }}

      - name: Retain before-build source receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "$env:GITHUB_WORKSPACE/all-results"
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          # Operator code belongs to the workflow ref, not the tested checkout.
          git --no-pager fetch --no-tags --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Cannot fetch operator source." }
          $archive = Join-Path $env:RUNNER_TEMP "pr-21433-operator.zip"
          git --no-pager archive --format=zip "--output=$archive" $env:GITHUB_SHA .github/validation/pr-21433-source-receipt.ps1
          if ($LASTEXITCODE -ne 0) { throw "Cannot read operator source." }
          Expand-Archive -LiteralPath $archive -DestinationPath "$env:RUNNER_TEMP/pr-21433-operator"
          $script = "$env:RUNNER_TEMP/pr-21433-operator/.github/validation/pr-21433-source-receipt.ps1"
          & $script -Stage before-build -OutputPath "$bundle/before-build.json" -Index $env:RECEIPT_INDEX

      - name: Trust HTTPS development certificate (Linux)
        if: runner.os == 'Linux'
        run: |
          EXIT_CODE=0
          ${{ env.DOTNET_SCRIPT }} dev-certs https --trust || EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 4 ]; then
            echo "dev-certs https --trust failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
        env:
          WSL_INTEROP: ""

      - name: Verify Docker is running (Linux)
        if: runner.os == 'Linux'
        run: docker info

      - name: Unlock macOS keychain
        if: runner.os == 'macOS'
        uses: ./.github/actions/unlock-macos-keychain

      - name: Compute test project path
        shell: pwsh
        run: |
          $testShortName = "${{ env.TEST_PROJECT }}"
          $projectPath1 = "${{ github.workspace }}/tests/$testShortName.Tests/$testShortName.Tests.csproj"
          $projectPath2 = "${{ github.workspace }}/tests/Aspire.$testShortName.Tests/Aspire.$testShortName.Tests.csproj"

          if (Test-Path -Path $projectPath1) {
              $projectPath = $projectPath1
          } elseif (Test-Path -Path $projectPath2) {
              $projectPath = $projectPath2
          } else {
              Write-Error "No test project found for shortname '$testShortName'. Looked at: $projectPath1, $projectPath2"
              exit 1
          }

          echo "TEST_PROJECT_PATH=$projectPath" >> $env:GITHUB_ENV
          Write-Host "Resolved test project: $projectPath"

      - name: Build test project
        run: >
          ${{ env.BUILD_SCRIPT }}
          -restore -ci -build
          -configuration Debug
          -projects ${{ env.TEST_PROJECT_PATH }}
          /p:InstallBrowsersForPlaywright=false
          /p:RunQuarantinedTests=false

      - name: Retain after-build source and SDK receipts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:RUNNER_TEMP/pr-21433-operator/.github/validation/pr-21433-source-receipt.ps1" -Stage after-build `
            -OutputPath "$env:GITHUB_WORKSPACE/all-results/after-build.json" -Index $env:RECEIPT_INDEX
          & $env:DOTNET_SCRIPT --info *> "$env:GITHUB_WORKSPACE/all-results/dotnet-info.txt"
          if ($LASTEXITCODE -ne 0) { throw "Cannot retain dotnet information." }
          & $env:DOTNET_SCRIPT build-server shutdown
          if ($LASTEXITCODE -ne 0) { throw "Cannot stop build servers before tests." }

      - name: Run test iterations (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASPIRE__TEST__DCPLOGBASEPATH: ${{ github.workspace }}/testresults/dcp
          NUGET_PACKAGES: ${{ github.workspace }}/.packages
          PLAYWRIGHT_INSTALLED: "false"
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: 'netaspireci.azurecr.io'
          MSBUILDTERMINALLOGGER: "false"
          ASPIRE_E2E_UBUNTU_APT_MIRROR: ${{ runner.os == 'Linux' && (runner.arch == 'ARM64' && 'https://azure.ports.ubuntu.com/ubuntu-ports/' || 'http://azure.archive.ubuntu.com/ubuntu/') || '' }}
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/all-results"
          mkdir -p "$bundle/iteration-1" "$GITHUB_WORKSPACE/testresults"
          # Keep evidence even if copying results fails; never lose the test exit.
          # Invoked indirectly by the EXIT trap on both test outcomes.
          # shellcheck disable=SC2329
          retain_results() {
            step_exit=$?
            trap - EXIT
            if [ -n "${HEARTBEAT_PID:-}" ]; then
              kill "$HEARTBEAT_PID" 2>/dev/null || true
              wait "$HEARTBEAT_PID" 2>/dev/null || true
            fi
            copy_exit=0
            cp -R "$GITHUB_WORKSPACE/testresults/." "$bundle/iteration-1/" || copy_exit=$?
            echo "::endgroup::"
            if [ "$step_exit" -eq 0 ] && [ "$copy_exit" -ne 0 ]; then
              step_exit=$copy_exit
            fi
            exit "$step_exit"
          }
          echo "::group::Iteration 1/1"
          trap 'retain_results' EXIT
          # Match regular CI's heartbeat without leaving it running after this step.
          ./dotnet.sh "$GITHUB_WORKSPACE/tools/scripts/Heartbeat.cs" 60 &
          HEARTBEAT_PID=$!
          set +e
          ./dotnet.sh test --project "${{ env.TEST_PROJECT_PATH }}" \
            /p:ContinuousIntegrationBuild=true \
            /p:TrxFileNamePrefix="Managed" \
            -bl:"$GITHUB_WORKSPACE/testresults/test.binlog" \
            --no-launch-profile --no-restore --no-build -- \
            --ignore-exit-code 8 --crashdump --hangdump --hangdump-type none \
            --hangdump-timeout 10m --timeout 20m --report-trx \
            --results-directory "$GITHUB_WORKSPACE/testresults" \
            ${{ env.TEST_FILTER }} 2>&1 | tee "$bundle/test-output.log"
          PIPE_CODES=("${PIPESTATUS[@]}")
          set -e
          RAW_TEST_EXIT_CODE=${PIPE_CODES[0]}
          printf '%s\n' "$RAW_TEST_EXIT_CODE" > "$bundle/test-exit-code.raw.txt"
          NORMALIZED_TEST_EXIT_CODE=0
          bash .github/workflows/normalize-mtp-exit-code.sh "$RAW_TEST_EXIT_CODE" || NORMALIZED_TEST_EXIT_CODE=$?
          printf '%s\n' "$NORMALIZED_TEST_EXIT_CODE" > "$bundle/test-exit-code.txt"
          # A failed tee is an evidence failure even if tests passed.
          if [ "${PIPE_CODES[1]}" -ne 0 ]; then exit "${PIPE_CODES[1]}"; fi
          exit "$NORMALIZED_TEST_EXIT_CODE"

      - name: Upload original validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.index }}
          path: all-results/
          if-no-files-found: error
          retention-days: 30

  results:
    if: ${{ always() && github.repository == 'microsoft/aspire' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Reproduce Results
    needs: [reproduce]
    permissions: {}
    steps:
      - name: Summary
        shell: bash
        run: |
          # Keep the native summary's independent append operations.
          # shellcheck disable=SC2129
          echo "## Reproduce Flaky Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test Project | \`${{ env.TEST_PROJECT }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Filter | \`${{ env.TEST_FILTER }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OSes | ${{ env.TARGET_OSES }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runners per OS | ${{ env.RUNNERS_PER_OS }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Iterations per runner | ${{ env.ITERATIONS_PER_RUNNER }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.reproduce.result }}" = "success" ]; then
            echo "### ✅ All iterations passed on all runners" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.reproduce.result }}" = "failure" ]; then
            echo "### ❌ Some runners reported failures" >> "$GITHUB_STEP_SUMMARY"
            echo "Check individual job logs and uploaded failure artifacts for details." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ Reproduce job was ${{ needs.reproduce.result }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if reproduce did not succeed
        if: ${{ needs.reproduce.result != 'success' }}
        run: exit 1
