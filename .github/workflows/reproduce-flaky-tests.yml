# Qualification branch only: fix plus forced ordering; all tests expected to pass.
name: Qualify NuGetPackagePrefetcher shutdown cancellation (after)
run-name: NuGetPackagePrefetcher cancellation after at ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  prefetcher_cancellation:
    uses: ./.github/workflows/run-tests.yml
    with:
      testShortName: Cli
      testProjectPath: tests/Aspire.Cli.Tests/Aspire.Cli.Tests.csproj
      os: ubuntu-latest
      ignoreTestFailures: false
      allowZeroTests: false
      extraTestArgs: >-
        --filter-class '*.NuGetPackagePrefetcherTests'
