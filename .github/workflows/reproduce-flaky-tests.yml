# Qualification branch only: forced busy-dispatcher exemplar click (after).
name: Qualify metrics exemplar click dispatch (after)
run-name: Exemplar click dispatch after at ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  exemplar_click:
    uses: ./.github/workflows/run-tests.yml
    with:
      testShortName: Dashboard.Components
      testProjectPath: tests/Aspire.Dashboard.Components.Tests/Aspire.Dashboard.Components.Tests.csproj
      os: windows-latest
      ignoreTestFailures: false
      allowZeroTests: false
      extraTestArgs: >-
        --filter-method '*.ChartContainer_UnavailableHistogramPercentiles_TablePreservesExemplars'
        --filter-method '*.Qualification_ExemplarClickWhileDispatcherBusy'
