# Qualification branch only. The parent commit is the clean test-only repair.
# Exercise the exact repaired original, paired pre/post-observation controls,
# and adjacent ambiguity contracts through the unchanged native build/test lane.
name: Qualify sandbox rejected-create cancellation phase
run-name: Sandbox cancellation phase qualification at ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  cancellation_phase:
    uses: ./.github/workflows/run-tests.yml
    with:
      testShortName: Hosting.Azure
      testProjectPath: tests/Aspire.Hosting.Azure.Tests/Aspire.Hosting.Azure.Tests.csproj
      os: ubuntu-latest
      ignoreTestFailures: false
      allowZeroTests: false
      extraTestArgs: >-
        --filter-method '*.AzureDevComputeClientKeepsCancellationAfterRejectedCreateDefinite'
        --filter-method '*.DiagnosticAzureDevComputeCreateCancellationOrdering'
        --filter-method '*.DiagnosticAzureDevComputeRejectedCreateCancellationPhase'
        --filter-method '*.AzureDevComputeClientMarksRejectedCreateResponsesAsDefinite'
        --filter-method '*.AzureDevComputeClientMarksCancellationBeforeCreateDispatchAsDefinite'
