name: Scratch Playground Build Cost

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: f09aa73a685c64f9bf1aeed55d94c658a29f9312
  MSBUILDTERMINALLOGGER: "false"

jobs:
  measure:
    name: ${{ matrix.variant }} / repeat ${{ matrix.repeat }}
    if: ${{ github.repository == 'microsoft/aspire' }}
    runs-on: 8-core-ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: [baseline, playgrounds, managed]
        repeat: [1, 2, 3]
    steps:
      - name: Checkout the fixed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Measure a fresh build
        env:
          VARIANT: ${{ matrix.variant }}
          REPEAT: ${{ matrix.repeat }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import subprocess
          import sys
          import time

          source_sha = subprocess.check_output(
              ["git", "--no-pager", "rev-parse", "HEAD"], text=True
          ).strip()
          if source_sha != os.environ["SOURCE_SHA"]:
              raise RuntimeError(f"Unexpected source commit: {source_sha}")

          variant = os.environ["VARIANT"]
          command = [
              "./build.sh", "-restore", "-build", "-ci", "-bl",
              "-p:InstallBrowsersForPlaywright=false",
              "-p:SkipTestProjects=true", "-p:SkipNativeBuild=true",
          ]
          if variant in ("baseline", "playgrounds"):
              command.extend([
                  "-pack", "-p:SkipBundleDeps=true",
                  f"-p:SkipPlaygroundProjects={'true' if variant == 'baseline' else 'false'}",
              ])
          elif variant != "managed":
              raise ValueError(f"Unknown variant: {variant}")

          output = Path("benchmark-results")
          output.mkdir()
          metrics = {
              "variant": variant,
              "repeat": int(os.environ["REPEAT"]),
              "source_sha": source_sha,
              "workflow_sha": os.environ["GITHUB_SHA"],
              "command": command,
              "platform": platform.platform(),
              "cpu_count": os.cpu_count(),
              "memory_bytes": os.sysconf("SC_PHYS_PAGES") * os.sysconf("SC_PAGE_SIZE"),
              "disk_free_before_bytes": shutil.disk_usage(".").free,
              "status": "running",
          }
          metrics_path = output / "metrics.json"
          metrics_path.write_text(json.dumps(metrics, indent=2) + "\n")
          print("Command:", " ".join(command), flush=True)

          started = time.perf_counter()
          with (output / "build.log").open("w") as log:
              process = subprocess.Popen(
                  command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True
              )
              for line in process.stdout:
                  log.write(line)
                  print(line, end="", flush=True)
              exit_code = process.wait()
          metrics["seconds"] = round(time.perf_counter() - started, 3)
          metrics["exit_code"] = exit_code
          metrics["status"] = "passed" if exit_code == 0 else "failed"
          metrics["disk_free_after_bytes"] = shutil.disk_usage(".").free
          metrics["package_names"] = sorted(
              str(path.relative_to("artifacts/packages"))
              for path in Path("artifacts/packages").rglob("*.nupkg")
          )
          sdk = subprocess.run(
              ["./dotnet.sh", "--version"], capture_output=True, text=True
          )
          metrics["sdk_version"] = sdk.stdout.strip()
          metrics["sdk_probe_exit_code"] = sdk.returncode
          metrics["sdk_probe_stderr"] = sdk.stderr.strip()
          metrics_path.write_text(json.dumps(metrics, indent=2) + "\n")
          print(json.dumps(metrics, indent=2), flush=True)
          sys.exit(exit_code or sdk.returncode)
          PY

      - name: Upload measurements and build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playground-build-cost-${{ matrix.variant }}-${{ matrix.repeat }}
          path: |
            benchmark-results
            artifacts/log
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
