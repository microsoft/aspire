# Diagnostic branch only: one source-comparable stderr-boundary observation.
name: Diagnose ComputeRunArguments stderr boundary
run-name: ComputeRunArguments stderr at ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  msbuild_stderr:
    uses: ./.github/workflows/run-tests.yml
    with:
      testShortName: Cli
      testProjectPath: tests/Aspire.Cli.Tests/Aspire.Cli.Tests.csproj
      os: windows-latest
      ignoreTestFailures: false
      allowZeroTests: false
      extraTestArgs: >-
        --filter-method '*.ComputeRunArgumentsPopulatesRunPropertiesForSdkProject'
