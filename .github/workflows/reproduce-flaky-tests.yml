name: Investigation - Azure Functions E2E baseline

# Investigation only: do not merge. Reuse the existing dispatchable workflow ID.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NPM_REGISTRY: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-npm/npm/registry/
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout investigation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify source and runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          git diff --exit-code 9c2af96f9163e2d89c2e9e789f5d40c395606f14 -- extension src global.json Directory.Packages.props NuGet.config
          echo 'Baseline source/artifacts: 9c2af96f9163e2d89c2e9e789f5d40c395606f14, run 34519184641' >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.x'

      - name: Install Corepack
        working-directory: extension
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $CorepackHome = Join-Path $env:RUNNER_TEMP 'corepack'
          $env:COREPACK_HOME = $CorepackHome
          "COREPACK_HOME=$CorepackHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $CorepackVersion = (Get-Content -Raw -Path 'scripts/corepack-version.txt').Trim()
          npm install --global --force --registry "$env:NPM_REGISTRY" "corepack@$CorepackVersion"
          $npmGlobalBin = Join-Path (npm prefix --global).Trim() 'bin'
          $env:PATH = "$npmGlobalBin$([IO.Path]::PathSeparator)$env:PATH"
          $npmGlobalBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $installed = (corepack --version).Trim()
          if ($installed -ne $CorepackVersion) { throw "Corepack mismatch: $installed" }
          corepack enable
          node ./scripts/prepareCorepackYarn.mjs
          corepack yarn --version

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Download VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aspire-extension
          path: extension/out
          run-id: 34519184641
          github-token: ${{ github.token }}

      - name: Download CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-native-archives-linux-x64
          path: artifacts/cli-archive
          run-id: 34519184641
          github-token: ${{ github.token }}

      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-nugets
          path: artifacts/nugets
          run-id: 34519184641
          github-token: ${{ github.token }}

      - name: Download RID-specific NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-nugets-for-linux-x64
          path: artifacts/nugets-rid
          run-id: 34519184641
          github-token: ${{ github.token }}

      - name: Validate lockfile registries
        working-directory: extension
        run: node scripts/validate-lockfile-registry.cjs

      - name: Install extension dependencies
        working-directory: extension
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            corepack yarn install --frozen-lockfile --non-interactive
            if ($LASTEXITCODE -eq 0) { exit 0 }
            $exitCode = $LASTEXITCODE
            if ($attempt -eq 3) { exit $exitCode }
            Start-Sleep -Seconds ($attempt * 30)
          }

      - name: Verify locked ExTester
        working-directory: extension
        run: node scripts/run-e2e.js --verify-extester-feed

      - name: Install Azure Functions E2E prerequisites
        shell: bash
        run: |
          set -euo pipefail
          core_tools_version='4.12.1'
          core_tools_directory="$RUNNER_TEMP/azure-functions-core-tools"
          core_tools_archive="$RUNNER_TEMP/Azure.Functions.Cli.linux-x64.${core_tools_version}.zip"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$core_tools_archive" \
            "https://github.com/Azure/azure-functions-core-tools/releases/download/${core_tools_version}/Azure.Functions.Cli.linux-x64.${core_tools_version}.zip"
          echo 'faf8fb8d50b5293df338bec70594b12f45730e9fe251805298859b2238cf627e  '"$core_tools_archive" | sha256sum --check -
          mkdir -p "$core_tools_directory"
          unzip -q "$core_tools_archive" -d "$core_tools_directory"
          chmod +x "$core_tools_directory/func"
          echo "$core_tools_directory" >> "$GITHUB_PATH"
          export PATH="$core_tools_directory:$PATH"
          func --version

          dotnet_runtime_vsix="$RUNNER_TEMP/vscode-dotnet-runtime-3.1.0.vsix"
          curl --fail --location --compressed --retry 3 --retry-all-errors \
            --output "$dotnet_runtime_vsix" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-dotnettools/vsextensions/vscode-dotnet-runtime/3.1.0/vspackage'
          echo '8e675ffe5f3674430d63e28d2dc05ab40f36c8494e9549e79d3995d721b13f5a  '"$dotnet_runtime_vsix" | sha256sum --check -

          csharp_vsix="$RUNNER_TEMP/vscode-csharp-2.148.23-linux-x64.vsix"
          curl --fail --location --compressed --retry 3 --retry-all-errors \
            --output "$csharp_vsix" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-dotnettools/vsextensions/csharp/2.148.23/vspackage?targetPlatform=linux-x64'
          echo '18b503e614a979212762683b35a4fa1806688ba773d5fe93bf62c9f9346db23f  '"$csharp_vsix" | sha256sum --check -

          azure_resource_groups_vsix="$RUNNER_TEMP/vscode-azureresourcegroups-0.12.7.vsix"
          curl --fail --location --compressed --retry 3 --retry-all-errors \
            --output "$azure_resource_groups_vsix" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-azuretools/vsextensions/vscode-azureresourcegroups/0.12.7/vspackage'
          echo 'e4a2e7ab012de3777e1ac1781e2c25d65f150ad6f3770e8cfcc5a3d3658df35a  '"$azure_resource_groups_vsix" | sha256sum --check -

          azure_functions_vsix="$RUNNER_TEMP/vscode-azurefunctions-1.22.0.vsix"
          curl --fail --location --compressed --retry 3 --retry-all-errors \
            --output "$azure_functions_vsix" \
            'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-azuretools/vsextensions/vscode-azurefunctions/1.22.0/vspackage'
          echo '146aede06f941b07a55c5aebd28c5e3df684d57b07cf6f9ebf90d7bb8ecd41a2  '"$azure_functions_vsix" | sha256sum --check -
          {
            echo 'ASPIRE_EXTENSION_E2E_ENABLE_AZURE_FUNCTIONS=true'
            echo "ASPIRE_EXTENSION_E2E_DOTNET_RUNTIME_VSIX=$dotnet_runtime_vsix"
            echo "ASPIRE_EXTENSION_E2E_CSHARP_VSIX=$csharp_vsix"
            echo "ASPIRE_EXTENSION_E2E_AZURE_RESOURCE_GROUPS_VSIX=$azure_resource_groups_vsix"
            echo "ASPIRE_EXTENSION_E2E_AZURE_FUNCTIONS_VSIX=$azure_functions_vsix"
            echo 'FUNCTIONS_CORE_TOOLS_TELEMETRY_OPTOUT=1'
          } >> "$GITHUB_ENV"

      - name: Prepare CLI bundle
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = Get-ChildItem artifacts/cli-archive -Recurse -File -Filter 'aspire-cli-linux-x64*.tar.gz' | Select-Object -First 1
          if ($null -eq $archive) { throw 'CLI archive missing.' }
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/bundle/linux-x64'
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          tar -xzf $archive.FullName -C $bundleDir
          $cli = Get-ChildItem $bundleDir -Recurse -File -Filter aspire | Select-Object -First 1
          if ($null -eq $cli) { throw 'CLI executable missing.' }
          chmod +x $cli.FullName
          & $cli.FullName setup
          $installPath = Split-Path (Split-Path $cli.FullName -Parent) -Parent
          $dcp = Get-ChildItem $installPath -Recurse -File -Filter dcp | Select-Object -First 1
          if ($null -eq $dcp) { throw "aspire setup produced no DCP under $installPath." }
          "ASPIRE_DCP_PATH=$($dcp.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $shippingDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/nugets/Debug/Shipping'
          if (-not (Test-Path $shippingDir)) { $shippingDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/nugets' }
          $samplePackage = Get-ChildItem $shippingDir -Recurse -File -Filter 'Aspire.Hosting.AppHost.*.nupkg' | Select-Object -First 1
          if ($null -eq $samplePackage) { throw 'AppHost package missing.' }
          $hiveLabel = if ($samplePackage.Name -match '-pr\.([0-9]+)\.') { "pr-$($Matches[1])" } else { 'daily' }
          $hiveDir = Join-Path $HOME ".aspire/hives/$hiveLabel/packages"
          New-Item -ItemType Directory -Path $hiveDir -Force | Out-Null
          Get-ChildItem $shippingDir -Recurse -File -Filter '*.nupkg' | Copy-Item -Destination $hiveDir -Force
          Get-ChildItem artifacts/nugets-rid -Recurse -File -Filter '*.nupkg' | Copy-Item -Destination $hiveDir -Force
          "ASPIRE_CLI_PACKAGES=$hiveDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ASPIRE_EXTENSION_E2E_CLI_PATH=$($cli.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ASPIRE_EXTENSION_E2E_APPHOST_SDK_VERSION=$(($samplePackage.Name -replace '^Aspire\.Hosting\.AppHost\.', '') -replace '\.nupkg$', '')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $cli.FullName --version

      - name: Compile extension E2E tests
        working-directory: extension
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          corepack yarn compile
          corepack yarn compile-e2e
          if (-not (Test-Path out/test-e2e/test-e2e/azureFunctions.e2e.test.js)) { throw 'Compiled spec missing.' }

      - name: Run up to ten fresh baseline iterations
        timeout-minutes: 150
        working-directory: extension
        env:
          ASPIRE_EXTENSION_E2E_VSIX: ${{ github.workspace }}/extension/out/aspire-extension.vsix
          ASPIRE_EXTENSION_E2E_SPEC: out/test-e2e/test-e2e/azureFunctions.e2e.test.js
          ASPIRE_EXTENSION_E2E_ADVISORY_ISSUE: ''
          ASPIRE_EXTENSION_E2E_VSCODE_VERSION: '1.130.0'
          ASPIRE_EXTENSION_E2E_RECORDING_MODE: always
        run: node ../.github/scripts/investigate-functions-e2e.mjs

      - name: Upload raw iteration diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: functions-baseline-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            extension/.test-results/**
            extension/.test-storage/**/settings/User/**
            extension/.test-storage/**/settings/logs/**
            extension/.test-storage/**/screenshots/**
            extension/.test-storage/**/aspire-home/logs/**
            extension/.test-storage/**/aspire-home/cache/apphost-info/**
            extension/.test-workspaces/**/.aspire/**
            extension/.test-workspaces/**/*.log
            extension/.test-recordings/**
          include-hidden-files: true
          if-no-files-found: warn
