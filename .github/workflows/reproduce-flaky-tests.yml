name: Reproduce Flaky Tests

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspector:
    name: Windows inspector diagnostics
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: extension
    env:
      NPM_REGISTRY: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-npm/npm/registry/
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
      - name: Install pinned Corepack and Yarn
        shell: pwsh
        run: |
          $env:COREPACK_HOME = Join-Path $env:RUNNER_TEMP 'inspector-corepack'
          "COREPACK_HOME=$env:COREPACK_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $version = (Get-Content scripts/corepack-version.txt).Trim()
          npm install --global --force --registry "$env:NPM_REGISTRY" "corepack@$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = (npm prefix --global).Trim()
          $env:PATH = "$bin$([IO.Path]::PathSeparator)$env:PATH"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          node scripts/prepareCorepackYarn.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack yarn --version
      - name: Install dependencies
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            corepack yarn install --frozen-lockfile --non-interactive
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds ($attempt * 30)
          }
      - name: Compile and lint
        shell: pwsh
        run: |
          corepack yarn compile-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack yarn compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack yarn lint
          exit $LASTEXITCODE
      - name: Three targeted iterations
        shell: pwsh
        run: |
          $failed = 0
          for ($iteration = 1; $iteration -le 3; $iteration++) {
            Write-Host "INSPECTOR ITERATION $iteration"
            corepack yarn unit-test --run out/test/nodeInspectorAttach.test.js
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          Write-Host "INSPECTOR RESULT failures=$failed iterations=3"
          if ($failed -gt 0) { exit 1 }
