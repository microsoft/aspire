name: GitHub Actions security analysis

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    if: ${{ github.repository == 'microsoft/aspire' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: |
            .github/actions/
            .github/workflows/
