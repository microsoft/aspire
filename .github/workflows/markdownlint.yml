name: Markdownlint

permissions:
  contents: read

# run even on changes without markdown changes, so that we can
# make it in GitHub a required check for PR's
on:
  pull_request:

jobs:
  lint:

    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'microsoft' }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 20.x
    - name: Run Markdownlint
      run: |
        echo "::add-matcher::.github/workflows/markdownlint-problem-matcher.json"
        npm i -g markdownlint-cli@0.45.0
        markdownlint --ignore '.dotnet/' --ignore 'tools/' --ignore 'docs/plans/' --ignore '**/AnalyzerReleases.*.md' '**/*.md'
