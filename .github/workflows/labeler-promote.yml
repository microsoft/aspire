# Promote a model from staging to 'ACTIVE', backing up the currently 'ACTIVE' model
name: "Labeler: Promotion"

on:
  # Dispatched via the Actions UI, promotes the staged models from
  # a staged slot into the prediction environment
  workflow_dispatch:
    inputs:
      issues:
        description: "Issues: Promote Model"
        type: boolean
        required: true
      pulls:
        description: "Pulls: Promote Model"
        type: boolean
        required: true
      staged_key:
        description: "The cache key suffix to use for promoting a staged model to 'ACTIVE'. Defaults to 'staged'."
        required: true
        default: "staged"
      backup_key:
        description: "The cache key suffix to use for backing up the currently active model. Defaults to 'backup'."
        default: "backup"

# Disable every configurable permission on the automatic GITHUB_TOKEN by default.
# Each promotion job opts into only the scope required by the action it runs.
permissions: {}

jobs:
  promote-issues:
    if: ${{ inputs.issues }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # The promotion action deletes the active GitHub Actions cache.
    steps:
      - name: "Promote Model for Issues"
        uses: dotnet/issue-labeler/promote@160b6b1e1e8d36da09beb34ef1e4806d2c0520a3 # v2.2.0
        with:
          type: "issues"
          staged_key: ${{ inputs.staged_key }}
          backup_key: ${{ inputs.backup_key }}

  promote-pulls:
    if: ${{ inputs.pulls }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # The promotion action deletes the active GitHub Actions cache.
    steps:
      - name: "Promote Model for Pull Requests"
        uses: dotnet/issue-labeler/promote@160b6b1e1e8d36da09beb34ef1e4806d2c0520a3 # v2.2.0
        with:
          type: "pulls"
          staged_key: ${{ inputs.staged_key }}
          backup_key: ${{ inputs.backup_key }}
