# WithReference(pricing) in the AppHost projects the resolved endpoint as the environment variable
# services__pricing__http__0. SmallRye Config matches an environment variable to a property name
# ignoring case and punctuation, so the Aspire name resolves here as written. The default keeps the
# service runnable with `mvnw quarkus:dev` outside the AppHost.
quarkus.rest-client.pricing-api.url=${services__pricing__http__0:http://localhost:8081}

# quarkus-opentelemetry is compiled into the application, which is why AddQuarkusApp needs no
# WithOtelAgent call: no Java agent is involved.
quarkus.otel.enabled=true

# quarkus-opentelemetry reads its own quarkus.otel.* configuration rather than the standard OTEL_*
# environment variables, so the endpoint has to be named here under the property it does read.
# `aspire run` does not need this line — AddQuarkusApp mirrors the values Aspire resolved onto the
# QUARKUS_OTEL_* environment variables SmallRye Config maps to these properties. A published container
# does, because there the compute environment supplies OTEL_* after every AppHost callback has run, and
# the mirroring finds nothing to copy. The value is a SmallRye expression, expanded inside the JVM at
# startup, so it does not matter when the variable was set. It cannot be passed as an environment
# variable instead: Docker Compose interpolates '${...}' in its own file and rejects this form.
# The defaults match the extension's own, so the service still runs outside Aspire.
# See https://smallrye.io/smallrye-config/Main/config/expressions/.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
quarkus.otel.service.name=${OTEL_SERVICE_NAME:inventory}
