spring.application.name={{projectNameLower}}-api

# Only the health endpoint is exposed. The AppHost polls /actuator/health through
# withHttpHealthCheck, and the remaining actuator endpoints report internals that a
# service reachable through withExternalHttpEndpoints should not publish.
management.endpoints.web.exposure.include=health

# In publish and deploy mode the AppHost bundles the built frontend into this container
# at /app/static via publishWithContainerFiles, so the API serves the SPA from the same
# origin as /api/weatherforecast and no CORS or proxy configuration is needed. The
# directory does not exist during local development, where Vite serves the frontend and
# proxies /api here instead; Spring skips locations that are not present.
spring.web.resources.static-locations=classpath:/static/,file:./static/
